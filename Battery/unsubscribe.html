<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe | Goldsure</title><style>body{margin:0;background:#f5f3ee;color:#201f1c;font:16px Arial,sans-serif}.card{max-width:520px;margin:10vh auto;padding:34px;background:#fff;border-top:4px solid #c6a34f;box-shadow:0 8px 30px #0001}img{height:40px;width:auto}h1{font-family:Tahoma,Arial,sans-serif;margin:28px 0 12px;font-size:28px}p{line-height:1.6;color:#605b50}button{border:0;background:#171512;color:#f2d68b;font-weight:bold;padding:14px 18px;border-radius:4px;cursor:pointer}.message{display:none;margin-top:20px;padding:14px;background:#eff8f1;color:#146c3b}</style></head><body><main class="card"><img src="/assets/Goldsure-Horizontal-Logo-RGB-600px-w-72ppi.jpg" alt="Goldsure"><h1>Unsubscribe from battery updates</h1><p>You will no longer receive this Goldsure battery campaign. This does not affect important service or installation updates.</p><button id="confirm">Unsubscribe</button><div class="message" id="message"></div></main><script>const token=new URLSearchParams(location.search).get('t')||'';const button=document.getElementById('confirm'),message=document.getElementById('message');if(!token){button.disabled=true;message.textContent='This unsubscribe link is invalid.';message.style.display='block'}button.addEventListener('click',async()=>{button.disabled=true;try{const r=await fetch('/api/battery/request-callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'battery-email-unsubscribe',trackingToken:token})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to update your preference.');message.textContent='You have been unsubscribed from Goldsure battery campaign updates.';message.style.display='block';button.style.display='none'}catch(e){message.textContent=e.message;message.style.display='block';button.disabled=false}})</script></body></html>
