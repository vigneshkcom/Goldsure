<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Battery Quotation | Goldsure</title><style>body{margin:0;padding:30px 15px;background:#eef0f3;font:14px Arial,sans-serif;color:#182437}.sheet{max-width:650px;margin:auto;background:white;border-radius:12px;overflow:hidden}header{padding:25px 32px;background:#0c1119;border-bottom:3px solid #b08d2e;color:#cfac50;display:flex;align-items:center;justify-content:space-between}header img{width:150px}header span{font-size:11px;letter-spacing:2px}main{padding:30px}h1{font-size:25px}p{line-height:1.7}small,.muted{color:#718094}.total{background:#f5efdf;border-radius:10px;padding:22px;margin:25px 0}.total strong{display:block;font-size:35px;margin:9px 0;color:#8b6c21}a{color:#987722}button,.button{display:inline-block;background:#182437;color:white;text-decoration:none;padding:13px 20px;border-radius:8px;border:0;font:inherit;cursor:pointer}footer{text-align:center;font-size:10px;padding:20px;border-top:1px solid #eee}.files a{display:block;padding:11px 0}.notes{white-space:pre-wrap}#state{max-width:650px;margin:35px auto;text-align:center}@media(max-width:500px){body{padding:0}.sheet{border-radius:0}header{padding:20px}main{padding:24px}header img{width:120px}}</style></head><body><div id="state">Loading your quotation…</div><article class="sheet" id="quote" hidden><header><img src="/assets/goldsure-inverted-logo.jpg" alt="Goldsure"><span>BATTERY QUOTE</span></header><main><p id="reference" class="muted"></p><h1 id="name"></h1><p id="address"></p><h2 id="battery"></h2><p id="inverter"></p><p id="phase" class="muted"></p><div><p>System price before STC discount <strong id="gross" style="float:right"></strong></p><p style="color:#267550">Federal STC discount <strong id="deduction" style="float:right"></strong><br><small id="stc-calculation"></small></p></div><div class="total">Customer out-of-pocket amount<strong id="price"></strong><small id="tax"></small></div><p id="stcs"></p><p id="notes" class="notes"></p><a class="button" id="pdf">Download quotation PDF</a><div class="files" id="files"></div><p>Questions? Reply to your quote email or call <a href="tel:0721455155">07 2145 5155</a>.</p></main><footer>Goldsure Pty Ltd · ABN 66 683 305 106</footer></article><script type="module">
import {batteryPricing} from '/Battery/quotes/pricing.js';
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');const endpoint='/api/battery/request-callback?module=quotes';try{if(!token)throw Error('This quotation link is incomplete.');const r=await fetch(endpoint+'&action=public&token='+encodeURIComponent(token));const data=await r.json();if(!r.ok)throw Error(data.error);const q=data.quote,p=q.package_snapshot;$('reference').textContent=q.reference+' · '+new Date(q.created_at).toLocaleDateString('en-AU',{timeZone:'Australia/Sydney'});$('name').textContent='Prepared for '+q.customer.name;$('address').textContent=q.customer.address;$('battery').textContent=p.capacity_kwh+'kWh '+p.battery_name;$('inverter').textContent=p.inverter_kw+'kW '+p.inverter_brand+' Inverter';$('phase').textContent=p.phase;const pricing=batteryPricing(p),currency=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n);$('gross').textContent=currency(pricing.gross);$('deduction').textContent='−'+currency(pricing.deduction);$('stc-calculation').textContent=p.stcs+' STCs × '+currency(pricing.rate);$('price').textContent=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(p.oop);$('tax').textContent={inclusive:'GST included',exclusive:'GST excluded'}[p.tax_treatment]||'';$('stcs').textContent='STC quantity: '+p.stcs+' certificates';$('notes').textContent=q.customer_notes;$('notes').hidden=!q.customer_notes;$('pdf').href=endpoint+'&action=public-pdf&token='+encodeURIComponent(token);for(const d of p.documents){const a=document.createElement('a');a.textContent=d.name;a.href=endpoint+'&action=public-document&token='+encodeURIComponent(token)+'&document_id='+encodeURIComponent(d.id);$('files').append(a);}$('state').hidden=true;$('quote').hidden=false;const key='battery-view-'+token;if(!sessionStorage.getItem(key)){fetch(endpoint+'&action=record-view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).then(r=>{if(r.ok)sessionStorage.setItem(key,'1')}).catch(()=>{});}}catch(error){$('state').textContent=error.message+' Contact info@goldsure.com.au for help.';}
