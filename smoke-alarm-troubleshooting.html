<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work in Progress | Goldsure</title>

<style>
:root{
  --gold:#D4AF37;
  --dark:#1f2933;
  --muted:#6b7280;
  --bg:#f1f4f7;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-family:'Segoe UI', Helvetica, Arial, sans-serif;
  color:var(--dark);
}

.card{
  background:#fff;
  padding:48px 40px;
  border-radius:14px;
  max-width:520px;
  width:100%;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

.badge{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  background:rgba(212,175,55,0.15);
  color:var(--gold);
  margin-bottom:20px;
}

h1{
  margin:0 0 12px;
  font-size:28px;
  font-weight:700;
}

p{
  margin:0;
  font-size:15px;
  line-height:1.6;
  color:var(--muted);
}

.footer{
  margin-top:32px;
  font-size:12px;
  color:#9ca3af;
}
</style>
</head>

<body>
  <div class="card">
    <div class="badge">Work in Progress</div>
    <h1>Coming Soon</h1>
    <p>
      We are currently working on this section to bring you a clear and
      helpful troubleshooting guide.
      <br><br>
      Please check back shortly.
    </p>
    <div class="footer">
      © Goldsure Pty Ltd
    </div>
  </div>
</body>
</html>
