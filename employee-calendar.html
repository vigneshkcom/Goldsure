<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goldsure Electrician Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
}

h1 {
  margin-bottom: 15px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 15px;
}

button {
  padding: 6px 14px;
  border: none;
  border-radius: 4px;
  background: #1f2937;
  color: #fff;
  cursor: pointer;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: #cbd5e1;
}

.day-header {
  background: #1f2937;
  color: #fff;
  padding: 8px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

.day {
  background: #fff;
  min-height: 110px;
  padding: 6px;
  font-size: 12px;
  position: relative;
}

.date-num {
  font-weight: bold;
  margin-bottom: 4px;
}

.emp {
  font-size: 11px;
  margin-top: 2px;
}

.dot {
  color: #16a34a;
  font-weight: bold;
  margin-right: 4px;
}

/* Suburb badges */
.badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 6px;
  font-size: 9px;
  font-weight: bold;
  border-radius: 999px;
  text-transform: uppercase;
  line-height: 1;
}

.badge-goldcoast {
  background: #dcfce7;
  color: #166534;
}

.badge-north {
  background: #dbeafe;
  color: #1e3a8a;
}

.badge-south {
  background: #fee2e2;
  color: #7f1d1d;
}

.empty {
  background: #f1f5f9;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="monthTitle"></h1>

  <div class="controls">
    <button onclick="changeMonth(-1)">Previous</button>
    <button onclick="changeMonth(1)">Next</button>
  </div>

  <div class="calendar" id="calendar"></div>
</div>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTT6mkngM998tv-L0UpKK5lfCReTFaqx0xpVJXqmPhqyZUSCbaH5sgpN8Mig11Qk4x2nddh2ayHBwcb/pub?output=csv";

const employees = ["William Openshaw", "Corey Rossouw"];
let data = {};
let currentDate = new Date();

/* ===========================
   LOAD & PARSE CSV
   =========================== */
fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    text
      .trim()
      .split(/\r?\n/)
      .slice(1)
      .forEach(row => {
        const cols = row.split(",");

        const date = cols[0]?.trim();
        const william = cols[1]?.trim();
        const williamArea = cols[2]?.trim();
        const corey = cols[3]?.trim();
        const coreyArea = cols[4]?.trim();

        if (!date) return;

        data[date] = {
          "William Openshaw": william === "TRUE" ? williamArea : null,
          "Corey Rossouw": corey === "TRUE" ? coreyArea : null
        };
      });

    render();
  });

/* ===========================
   RENDER CALENDAR
   =========================== */
function render() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startDay = first.getDay();
  const days = last.getDate();

  document.getElementById("monthTitle").innerText =
    first.toLocaleString("default", { month: "long", year: "numeric" });

  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(d => {
    cal.innerHTML += `<div class="day-header">${d}</div>`;
  });

  for (let i = 0; i < startDay; i++) {
    cal.innerHTML += `<div class="day empty"></div>`;
  }

  for (let d = 1; d <= days; d++) {
    const dateStr =
      `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

    let html = `<div class="day"><div class="date-num">${d}</div>`;

    employees.forEach(emp => {
      const area = data[dateStr]?.[emp];
      if (area !== null && area !== undefined) {
        let badgeClass = "";
        if (area === "Goldcoast") badgeClass = "badge-goldcoast";
        if (area === "North Brisbane") badgeClass = "badge-north";
        if (area === "South Brisbane") badgeClass = "badge-south";

        html += `
          <div class="emp">
            <span class="dot">●</span>${emp}
            ${area ? `<span class="badge ${badgeClass}">${area}</span>` : ""}
          </div>
        `;
      }
    });

    html += `</div>`;
    cal.innerHTML += html;
  }
}

/* ===========================
   MONTH NAVIGATION
   =========================== */
function changeMonth(offset) {
  currentDate.setMonth(currentDate.getMonth() + offset);
  render();
}
</script>

</body>
</html>
