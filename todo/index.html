<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Team Tasks | Goldsure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/internal-systems-sidebar.css">
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--line:#e6e9ef;--text:#323338;--muted:#676879;--blue:#0073ea;--blue-soft:#e6f1fd;--green:#00a86b;--red:#d83a52;--orange:#fdab3d;--purple:#7b5cff;--shadow:0 1px 3px rgba(20,30,55,.08)}
    *{box-sizing:border-box}
    /* Class rules like .seg{display:flex} outrank the UA [hidden] rule, so the
       manager-only controls stayed visible for employees without this. */
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Figtree,Arial,sans-serif}
    .page{max-width:1560px;margin:auto;padding:28px 32px 60px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
    h1{font-size:29px;line-height:1.15;margin:0 0 7px}
    .subtitle{color:var(--muted);font-size:14px}
    .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .who{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px 5px 6px}
    .who .avatar{margin:0}
    .who select{border:0;background:none;font:600 14px inherit;color:var(--text);outline:none;padding:4px 2px}
    .role-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 7px;border-radius:5px;background:var(--blue-soft);color:#075ea8}
    .role-tag.mgr{background:#efe9ff;color:#5636d6}
    .control{height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 12px;color:var(--text);font:inherit}
    .btn{height:40px;border:0;border-radius:7px;padding:0 16px;font:600 14px inherit;cursor:pointer}
    .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#0060b9}
    .btn-light{background:#fff;color:var(--text);border:1px solid var(--line)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
    .kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 17px;box-shadow:var(--shadow)}
    .kpi-label{font-size:12px;color:var(--muted);margin-bottom:7px}
    .kpi-value{font-size:25px;font-weight:700}
    .kpi.overdue .kpi-value{color:var(--red)}.kpi.today .kpi-value{color:var(--blue)}.kpi.done .kpi-value{color:var(--green)}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
    .filters{display:flex;gap:8px;flex-wrap:wrap}.search{min-width:220px}
    .seg{display:flex;gap:3px;background:#e9ebf0;padding:3px;border-radius:8px}
    .seg button{border:0;background:transparent;border-radius:6px;padding:8px 13px;color:var(--muted);font:600 13px inherit;cursor:pointer;white-space:nowrap}
    .seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

    /* ── Board ── */
    .swim{margin-bottom:22px}
    .swim-head{display:flex;align-items:center;gap:9px;margin:0 0 10px}
    .swim-head .nm{font-weight:700;font-size:14px}
    .swim-head .ct{font-size:12px;color:var(--muted)}
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
    .col{background:#eef0f5;border-radius:11px;padding:11px;min-height:120px;transition:background .12s}
    .col.drag-over{background:#dbe7f8;outline:2px dashed var(--blue);outline-offset:-3px}
    .col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 11px}
    .col-dot{width:9px;height:9px;border-radius:50%;flex:none}
    .col-todo .col-dot{background:var(--blue)}.col-followup .col-dot{background:var(--orange)}.col-done .col-dot{background:var(--green)}
    .col-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
    .col-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:#fff;border-radius:20px;padding:2px 8px}
    .card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow);cursor:grab}
    .card:last-child{margin-bottom:0}
    .card:hover{border-color:#c7cddb}
    .card.dragging{opacity:.45}
    .card.done .card-title{text-decoration:line-through;color:var(--muted)}
    .card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .card-title{font-weight:600;font-size:13.5px;line-height:1.4}
    .card-desc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:5px;overflow-wrap:anywhere}
    .card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
    .avatar{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:#075ea8;font-weight:700;font-size:10px;flex:none}
    .due{font-size:11.5px;font-weight:600;color:var(--muted);background:#f1f3f7;border-radius:5px;padding:3px 7px;white-space:nowrap}
    .due.over{background:#ffe8ec;color:#b3263e}.due.today{background:var(--blue-soft);color:#075ea8}
    .due .t{opacity:.85}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:700;text-transform:capitalize}
    .pill::before{content:'';width:6px;height:6px;border-radius:50%}
    .urgent{background:#ffe8ec;color:#b3263e}.urgent::before{background:var(--red)}
    .high{background:#fff2dd;color:#a05d00}.high::before{background:var(--orange)}
    .normal{background:#e6f1fd;color:#075ea8}.normal::before{background:var(--blue)}
    .low{background:#edf8f4;color:#087657}.low::before{background:var(--green)}
    .kebab{border:0;background:transparent;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:17px;line-height:1;color:var(--muted);flex:none}
    .kebab:hover{background:#eceef3}
    .moves{display:flex;gap:5px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
    .moves button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 4px;font:600 10.5px inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
    .moves button:hover{border-color:var(--blue);color:var(--blue)}
    .moves button[disabled]{opacity:.35;cursor:default}
    .col-empty{padding:20px 8px;text-align:center;color:#9aa2b4;font-size:12px}
    .loading{padding:55px;text-align:center;color:var(--muted)}
    .setup{background:#fff;border:1px solid var(--line);border-radius:10px;padding:52px 24px;text-align:center}
    .setup h3{margin:0 0 7px}.setup p{margin:0;color:var(--muted);font-size:13px}

    dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 28px));box-shadow:0 18px 60px rgba(20,30,55,.25)}
    dialog::backdrop{background:rgba(20,27,45,.45)}
    .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .modal-head h2{font-size:19px;margin:0}
    .close{border:0;background:none;font-size:25px;color:var(--muted);cursor:pointer;line-height:1}
    .form{padding:20px 24px}
    .field{margin-bottom:15px}
    .field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
    .field input,.field textarea,.field select{width:100%;border:1px solid #cfd2dc;border-radius:7px;padding:10px 11px;font:14px inherit;color:var(--text);background:#fff}
    .field textarea{min-height:80px;resize:vertical}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .hint{font-size:11px;color:var(--muted);margin-top:5px}
    .modal-actions{display:flex;justify-content:space-between;gap:10px;padding:15px 24px;border-top:1px solid var(--line);background:#fafbfc}
    .danger{color:var(--red);border-color:#f0bdc6}
    .toast{position:fixed;right:24px;bottom:24px;background:#262b3a;color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:13px;z-index:1200;transform:translateY(80px);opacity:0;transition:.2s}
    .toast.show{transform:none;opacity:1}

    @media(max-width:900px){
      .page{padding:70px 14px 40px}
      .topbar{display:block}.top-actions{margin-top:14px}
      .kpis{grid-template-columns:1fr 1fr}
      /* Columns scroll sideways as snap panes rather than squashing. */
      .board{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 6px}
      .col{flex:0 0 84%;scroll-snap-align:start}
      .search{min-width:0;width:100%}
      .filters{width:100%}.filters>*{flex:1;min-width:0}
      .seg{width:100%}.seg button{flex:1}
      .form-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body data-internal-sidebar-mode="hover">
  <main class="page">
    <div class="topbar">
      <div>
        <div class="eyebrow">Team workspace</div>
        <h1>Follow-ups &amp; Tasks</h1>
        <div class="subtitle" id="subtitle">Assign work, set a due day and keep every follow-up visible.</div>
      </div>
      <div class="top-actions">
        <div class="who">
          <span class="avatar" id="whoAvatar"></span>
          <select id="currentUser" aria-label="Working as"></select>
          <span class="role-tag" id="roleTag">Employee</span>
        </div>
        <button class="btn btn-primary" onclick="openTask()">+ New task</button>
      </div>
    </div>

    <section class="kpis">
      <div class="kpi"><div class="kpi-label" id="kOpenLabel">Open tasks</div><div class="kpi-value" id="kOpen">0</div></div>
      <div class="kpi today"><div class="kpi-label">Due today</div><div class="kpi-value" id="kToday">0</div></div>
      <div class="kpi overdue"><div class="kpi-label">Overdue</div><div class="kpi-value" id="kOverdue">0</div></div>
      <div class="kpi done"><div class="kpi-label">Completed this week</div><div class="kpi-value" id="kDone">0</div></div>
    </section>

    <div class="toolbar">
      <div class="seg" id="scopeSeg" hidden>
        <button data-scope="team" class="active">Whole team</button>
        <button data-scope="mine">My tasks</button>
        <button data-scope="byagent">By agent</button>
      </div>
      <div class="filters">
        <input class="control search" id="search" placeholder="Search tasks">
        <select class="control" id="assigneeFilter" hidden><option value="">Everyone</option></select>
        <select class="control" id="priorityFilter">
          <option value="">Any priority</option>
          <option value="urgent">Urgent</option><option value="high">High</option>
          <option value="normal">Normal</option><option value="low">Low</option>
        </select>
      </div>
    </div>

    <div id="boardHost" class="loading">Loading tasks…</div>
  </main>

  <dialog id="taskDialog"><form id="taskForm">
    <div class="modal-head"><h2 id="modalTitle">New task</h2><button type="button" class="close" onclick="taskDialog.close()">×</button></div>
    <div class="form">
      <input type="hidden" id="taskId">
      <div class="field"><label for="title">Task or follow-up</label><input id="title" maxlength="180" required placeholder="e.g. Call customer about installation date"></div>
      <div class="field"><label for="description">Notes</label><textarea id="description" placeholder="Add the customer name, job number or anything the assignee needs"></textarea></div>
      <div class="form-grid">
        <div class="field"><label for="assignee">Assign to</label><select id="assignee" required></select></div>
        <div class="field"><label for="status">Column</label><select id="status">
          <option value="todo">To Do</option><option value="followup">Follow Up</option><option value="done">Completed</option>
        </select></div>
      </div>
      <div class="form-grid">
        <div class="field"><label for="dueDate">Due date</label><input id="dueDate" type="date" required></div>
        <div class="field"><label for="dueTime">Due time <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="dueTime" type="time"><div class="hint">Set a time and the assignee is emailed then.</div></div>
      </div>
      <div class="form-grid">
        <div class="field"><label for="priority">Priority</label><select id="priority">
          <option value="urgent">Urgent</option><option value="high">High</option>
          <option value="normal" selected>Normal</option><option value="low">Low</option>
        </select></div>
        <div class="field"><label for="createdBy">Created by</label><select id="createdBy" required></select></div>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" id="archiveBtn" class="btn btn-light danger" onclick="archiveTask()" hidden>Archive</button>
      <span></span>
      <button type="button" class="btn btn-light" onclick="taskDialog.close()">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save task</button>
    </div>
  </form></dialog>

  <div class="toast" id="toast"></div>
  <script src="/assets/internal-systems-sidebar.js"></script>
  <script>
    const SB_URL='https://yxgdixwneprhjxzdlaqw.supabase.co';
    const SB_KEY='sb_publishable_94nQfItNfgNZZc2P1Slb1Q_ECjCmu47';
    const PEOPLE=['Vignesh','David','Shanira','Alda','Amit'];
    // Vignesh manages the team and sees every agent's work; everyone else sees
    // only what is assigned to them. This is a view filter for focus, not a
    // security boundary — the board authenticates by name picker, not a session.
    const MANAGER='Vignesh';
    const COLUMNS=[{id:'todo',name:'To Do'},{id:'followup',name:'Follow Up'},{id:'done',name:'Completed'}];
    // Priority is stored as text, so ordering it in SQL sorts alphabetically
    // (high, low, normal, urgent) and buries urgent work. Rank it explicitly.
    const PRIORITY_RANK={urgent:0,high:1,normal:2,low:3};
    const H={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'};

    let tasks=[],scope='team';
    const $=id=>document.getElementById(id);
    const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials=n=>n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
    const byPriority=(a,b)=>(PRIORITY_RANK[a.priority]??9)-(PRIORITY_RANK[b.priority]??9);
    // Render the stored date as a plain calendar date; parsing it as a local
    // Date would shift the day for anyone not on Sydney time.
    const fmtDate=d=>new Date(`${d}T00:00:00Z`).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
    const fmtTime=t=>{if(!t)return'';const [h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm';const hh=h%12||12;return ` ${hh}${m?':'+String(m).padStart(2,'0'):''}${ap}`};
    function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
    function api(path='',opts={}){return fetch(`${SB_URL}/rest/v1/portal_tasks${path}`,{...opts,headers:{...H,...(opts.headers||{})}})}
    const currentUser=()=>$('currentUser').value;
    const isManager=()=>currentUser()===MANAGER;

    function initPeople(){
      for(const id of ['currentUser','assignee','createdBy'])$(id).innerHTML=PEOPLE.map(n=>`<option>${n}</option>`).join('');
      $('assigneeFilter').insertAdjacentHTML('beforeend',PEOPLE.map(n=>`<option>${n}</option>`).join(''));
      const saved=localStorage.getItem('goldsure_task_user');
      $('currentUser').value=PEOPLE.includes(saved)?saved:MANAGER;
      $('currentUser').onchange=()=>{localStorage.setItem('goldsure_task_user',currentUser());applyRole();render()};
      applyRole();
    }

    // Employees get a focused board; the manager gets team-wide scope controls.
    function applyRole(){
      const mgr=isManager();
      $('whoAvatar').textContent=initials(currentUser());
      $('roleTag').textContent=mgr?'Manager':'Employee';
      $('roleTag').classList.toggle('mgr',mgr);
      $('scopeSeg').hidden=!mgr;
      $('assigneeFilter').hidden=!mgr;
      $('kOpenLabel').textContent=mgr?'Open tasks (team)':'My open tasks';
      $('subtitle').textContent=mgr
        ?'Every agent’s work in one board. Drag a card between columns to move it.'
        :'Your assigned work. Drag a card between columns as you go.';
      if(!mgr){scope='mine';$('assigneeFilter').value=''}
      else{scope=$('scopeSeg').querySelector('.active').dataset.scope}
      $('assignee').value=mgr?$('assignee').value||currentUser():currentUser();
    }

    async function load(){
      try{
        const r=await api('?select=*&archived_at=is.null&order=due_date.asc,created_at.desc');
        if(!r.ok)throw new Error(await r.text());
        tasks=await r.json();
        render();
      }catch(e){
        $('boardHost').className='';
        $('boardHost').innerHTML='<div class="setup"><h3>Task board needs database setup</h3><p>Run <code>todo/schema.sql</code> in the Supabase SQL editor, then reload.</p></div>';
        console.error(e);
      }
    }

    // Everything the current user is allowed to see, before UI filters.
    function visible(){
      return isManager()?tasks:tasks.filter(t=>t.assignee===currentUser());
    }
    function filtered(){
      const q=$('search').value.trim().toLowerCase();
      const person=isManager()?$('assigneeFilter').value:'';
      const prio=$('priorityFilter').value;
      return visible().filter(t=>{
        if(scope==='mine'&&t.assignee!==currentUser())return false;
        if(person&&t.assignee!==person)return false;
        if(prio&&t.priority!==prio)return false;
        if(q&&!`${t.title} ${t.description} ${t.assignee}`.toLowerCase().includes(q))return false;
        return true;
      });
    }

    function render(){
      const t=today(),weekAgo=new Date(Date.now()-7*864e5),mine=visible();
      const open=x=>x.status!=='done';
      $('kOpen').textContent=mine.filter(open).length;
      $('kToday').textContent=mine.filter(x=>open(x)&&x.due_date===t).length;
      $('kOverdue').textContent=mine.filter(x=>open(x)&&x.due_date<t).length;
      $('kDone').textContent=mine.filter(x=>x.status==='done'&&x.completed_at&&new Date(x.completed_at)>=weekAgo).length;

      const rows=filtered();
      $('boardHost').className='';
      if(!rows.length){
        $('boardHost').innerHTML='<div class="setup"><h3>Nothing here</h3><p>Create a task or clear your filters.</p></div>';
        return;
      }
      $('boardHost').innerHTML = (isManager()&&scope==='byagent')
        ? PEOPLE.map(p=>{const own=rows.filter(x=>x.assignee===p);return own.length
            ?`<div class="swim"><div class="swim-head"><span class="avatar">${initials(p)}</span><span class="nm">${esc(p)}</span><span class="ct">${own.filter(open).length} open</span></div>${boardHtml(own)}</div>`:''}).join('')
          ||'<div class="setup"><h3>Nothing here</h3><p>Create a task or clear your filters.</p></div>'
        : boardHtml(rows);
      wireDnd();
    }

    function boardHtml(rows){
      return `<div class="board">${COLUMNS.map(col=>{
        const list=rows.filter(x=>x.status===col.id).sort((a,b)=>a.due_date.localeCompare(b.due_date)||byPriority(a,b));
        return `<div class="col col-${col.id}" data-col="${col.id}">
          <div class="col-head"><span class="col-dot"></span><span class="col-name">${col.name}</span><span class="col-count">${list.length}</span></div>
          ${list.map(cardHtml).join('')||'<div class="col-empty">Nothing here</div>'}
        </div>`}).join('')}</div>`;
    }

    function cardHtml(x){
      const t=today();
      const cls=x.status==='done'?'':(x.due_date<t?'over':x.due_date===t?'today':'');
      return `<div class="card ${x.status==='done'?'done':''}" draggable="true" data-id="${x.id}">
        <div class="card-top">
          <div class="card-title">${esc(x.title)}</div>
          <button class="kebab" aria-label="Edit task" onclick="openTask('${x.id}')">⋯</button>
        </div>
        ${x.description?`<div class="card-desc">${esc(x.description)}</div>`:''}
        <div class="card-meta">
          <span class="avatar" title="${esc(x.assignee)}">${initials(x.assignee)}</span>
          <span class="due ${cls}">${fmtDate(x.due_date)}<span class="t">${fmtTime(x.due_time)}</span></span>
          <span class="pill ${x.priority}">${x.priority}</span>
        </div>
        <div class="moves">${COLUMNS.map(c=>
          `<button ${c.id===x.status?'disabled':''} onclick="moveTask('${x.id}','${c.id}')">${c.name}</button>`).join('')}</div>
      </div>`;
    }

    // Drag and drop for pointer devices; the per-card move buttons cover touch,
    // where HTML5 drag events are unreliable.
    function wireDnd(){
      let dragId=null;
      document.querySelectorAll('.card').forEach(card=>{
        card.addEventListener('dragstart',e=>{dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
        card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('dragging')});
      });
      document.querySelectorAll('.col').forEach(col=>{
        col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over')});
        col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
        col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drag-over');if(dragId)moveTask(dragId,col.dataset.col)});
      });
    }

    async function moveTask(id,status){
      const x=tasks.find(t=>t.id===id);
      if(!x||x.status===status)return;
      const done=status==='done';
      const payload={status,completed_at:done?new Date().toISOString():null,completed_by:done?currentUser():null};
      // Re-arm the timed reminder when a task leaves Completed.
      if(!done&&x.status==='done')payload.reminder_sent_at=null;
      const prev=x.status;x.status=status;render();
      const r=await api(`?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});
      if(r.ok){toast(done?'Task completed':`Moved to ${COLUMNS.find(c=>c.id===status).name}`);await load()}
      else{x.status=prev;render();toast('Could not move task')}
    }

    function openTask(id){
      const x=tasks.find(t=>t.id===id);
      if(x&&!isManager()&&x.assignee!==currentUser()){toast('That task belongs to someone else');return}
      $('taskId').value=x?.id||'';
      $('modalTitle').textContent=x?'Edit task':'New task';
      $('title').value=x?.title||'';
      $('description').value=x?.description||'';
      $('assignee').value=x?.assignee||(isManager()?MANAGER:currentUser());
      $('assignee').disabled=!isManager()&&!!x;
      $('status').value=x?.status||'todo';
      $('dueDate').value=x?.due_date||today();
      $('dueTime').value=x?.due_time?String(x.due_time).slice(0,5):'';
      $('priority').value=x?.priority||'normal';
      $('createdBy').value=x?.created_by||currentUser();
      $('archiveBtn').hidden=!x;
      taskDialog.showModal();
      setTimeout(()=>$('title').focus(),50);
    }

    $('taskForm').onsubmit=async e=>{
      e.preventDefault();
      const id=$('taskId').value;
      const status=$('status').value,done=status==='done';
      const payload={
        title:$('title').value.trim(),
        description:$('description').value.trim(),
        assignee:$('assignee').value,
        due_date:$('dueDate').value,
        due_time:$('dueTime').value||null,
        priority:$('priority').value,
        created_by:$('createdBy').value,
        status,
        completed_at:done?(tasks.find(t=>t.id===id)?.completed_at||new Date().toISOString()):null,
        completed_by:done?(tasks.find(t=>t.id===id)?.completed_by||currentUser()):null,
        // Editing the due date/time re-arms the reminder for the new slot.
        reminder_sent_at:null,
      };
      $('saveBtn').disabled=true;
      try{
        const r=await api(id?`?id=eq.${id}`:'',{method:id?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});
        if(!r.ok)throw new Error(await r.text());
        taskDialog.close();toast(id?'Task updated':'Task assigned');await load();
      }catch(err){toast('Could not save task');console.error(err)}
      finally{$('saveBtn').disabled=false}
    };

    async function archiveTask(){
      const id=$('taskId').value;
      if(!id||!confirm('Archive this task?'))return;
      const r=await api(`?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({archived_at:new Date().toISOString()})});
      if(r.ok){taskDialog.close();toast('Task archived');await load()}else toast('Could not archive task');
    }

    $('scopeSeg').onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      $('scopeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
      scope=b.dataset.scope;render();
    };
    $('search').oninput=render;
    $('assigneeFilter').onchange=render;
    $('priorityFilter').onchange=render;

    initPeople();load();
  </script>
</body>
</html>
