<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Team Tasks | Goldsure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/internal-systems-sidebar.css">
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--line:#e6e9ef;--text:#323338;--muted:#676879;--blue:#0073ea;--blue-soft:#e6f1fd;--green:#00a86b;--red:#d83a52;--orange:#fdab3d;--shadow:0 1px 3px rgba(20,30,55,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Figtree,Arial,sans-serif}.page{max-width:1440px;margin:auto;padding:28px 32px 60px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}h1{font-size:29px;line-height:1.15;margin:0 0 7px}.subtitle{color:var(--muted);font-size:14px}.top-actions{display:flex;gap:10px;align-items:center}.person-select,.control{height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 12px;color:var(--text);font:inherit}.btn{height:40px;border:0;border-radius:7px;padding:0 16px;font:600 14px inherit;cursor:pointer}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#0060b9}.btn-light{background:#fff;color:var(--text);border:1px solid var(--line)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px 18px;box-shadow:var(--shadow)}.kpi-label{font-size:12px;color:var(--muted);margin-bottom:8px}.kpi-value{font-size:26px;font-weight:700}.kpi.overdue .kpi-value{color:var(--red)}.kpi.today .kpi-value{color:var(--blue)}.kpi.done .kpi-value{color:var(--green)}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.tabs{display:flex;gap:4px;background:#e9ebf0;padding:4px;border-radius:8px;overflow-x:auto}.tab{white-space:nowrap;border:0;background:transparent;border-radius:6px;padding:8px 13px;color:var(--muted);font:600 13px inherit;cursor:pointer}.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}.filters{display:flex;gap:8px}.search{min-width:220px}
    .board{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}.thead,.task-row{display:grid;grid-template-columns:42px minmax(260px,1.8fr) 150px 145px 120px 112px 46px;align-items:center}.thead{min-height:43px;background:#f9fafb;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}.thead>div,.task-row>div{padding:0 12px}.task-row{min-height:70px;border-bottom:1px solid var(--line);transition:.12s}.task-row:last-child{border-bottom:0}.task-row:hover{background:#fafbfc}.task-row.completed{opacity:.62}.check{width:22px;height:22px;border:2px solid #c3c6d4;border-radius:50%;background:#fff;cursor:pointer;display:grid;place-items:center}.check.done{border-color:var(--green);background:var(--green);color:#fff}.task-title{font-weight:600;font-size:14px;margin-bottom:4px}.completed .task-title{text-decoration:line-through}.task-desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:#075ea8;font-weight:700;font-size:11px;margin-right:7px}.assignee{font-size:13px;font-weight:500}.due{font-size:13px}.due.over{color:var(--red);font-weight:700}.due.today{color:var(--blue);font-weight:700}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;text-transform:capitalize}.pill::before{content:'';width:7px;height:7px;border-radius:50%}.urgent{background:#ffe8ec;color:#b3263e}.urgent::before{background:var(--red)}.high{background:#fff2dd;color:#a05d00}.high::before{background:var(--orange)}.normal{background:#e6f1fd;color:#075ea8}.normal::before{background:var(--blue)}.low{background:#edf8f4;color:#087657}.low::before{background:var(--green)}.status{font-size:12px;font-weight:600;color:var(--muted)}.status.open{color:var(--blue)}.menu-btn{border:0;background:transparent;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:20px;color:var(--muted)}.menu-btn:hover{background:#eceef3}.empty{padding:64px 20px;text-align:center}.empty-icon{font-size:36px;margin-bottom:10px}.empty h3{margin:0 0 6px}.empty p{margin:0;color:var(--muted);font-size:13px}.loading{padding:55px;text-align:center;color:var(--muted)}
    dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 28px));box-shadow:0 18px 60px rgba(20,30,55,.25)}dialog::backdrop{background:rgba(20,27,45,.45)}.modal-head{padding:21px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:none;font-size:25px;color:var(--muted);cursor:pointer}.form{padding:22px 24px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #cfd2dc;border-radius:7px;padding:10px 11px;font:14px inherit;color:var(--text);background:#fff}.field textarea{min-height:86px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-actions{display:flex;justify-content:space-between;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fafbfc}.danger{color:var(--red);border-color:#f0bdc6}.toast{position:fixed;right:24px;bottom:24px;background:#262b3a;color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:13px;z-index:1200;transform:translateY(80px);opacity:0;transition:.2s}.toast.show{transform:none;opacity:1}
    @media(max-width:1050px){.thead,.task-row{grid-template-columns:42px minmax(220px,1.5fr) 135px 120px 100px 44px}.thead>div:nth-child(6),.task-row>div:nth-child(6){display:none}}
    @media(max-width:760px){.page{padding:70px 14px 36px}.topbar{display:block}.top-actions{margin-top:16px;justify-content:space-between}.person-select{min-width:0;flex:1}.kpis{grid-template-columns:1fr 1fr}.toolbar{display:block}.filters{margin-top:10px}.filters>*{min-width:0;flex:1}.board{background:transparent;border:0;box-shadow:none;overflow:visible}.thead{display:none}.task-row{display:grid;grid-template-columns:38px 1fr 34px;gap:0;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;padding:14px 8px;min-height:0;box-shadow:var(--shadow)}.task-row>div{padding:0 7px}.task-row>div:nth-child(1){grid-row:1/4}.task-row>div:nth-child(2){grid-column:2}.task-row>div:nth-child(3),.task-row>div:nth-child(4),.task-row>div:nth-child(5),.task-row>div:nth-child(6){display:inline-flex!important;align-items:center;margin-top:10px;grid-column:2}.task-row>div:nth-child(4){margin-left:120px;margin-top:-26px}.task-row>div:nth-child(5){margin-top:8px}.task-row>div:nth-child(6){display:none!important}.task-row>div:nth-child(7){grid-column:3;grid-row:1}.task-desc{white-space:normal}.form-grid{grid-template-columns:1fr}.modal-actions{flex-wrap:wrap}}
  </style>
</head>
<body data-internal-sidebar-mode="hover">
  <main class="page">
    <div class="topbar"><div><div class="eyebrow">Team workspace</div><h1>Follow-ups &amp; Tasks</h1><div class="subtitle">Assign work, set a due day and keep every follow-up visible.</div></div><div class="top-actions"><select id="currentUser" class="person-select" aria-label="Working as"></select><button class="btn btn-primary" onclick="openTask()">+ New task</button></div></div>
    <section class="kpis"><div class="kpi"><div class="kpi-label">Open tasks</div><div class="kpi-value" id="kOpen">0</div></div><div class="kpi today"><div class="kpi-label">Due today</div><div class="kpi-value" id="kToday">0</div></div><div class="kpi overdue"><div class="kpi-label">Overdue</div><div class="kpi-value" id="kOverdue">0</div></div><div class="kpi done"><div class="kpi-label">Completed this week</div><div class="kpi-value" id="kDone">0</div></div></section>
    <div class="toolbar"><div class="tabs" id="tabs"><button class="tab active" data-view="open">Open</button><button class="tab" data-view="mine">My tasks</button><button class="tab" data-view="today">Today</button><button class="tab" data-view="overdue">Overdue</button><button class="tab" data-view="completed">Completed</button><button class="tab" data-view="all">All</button></div><div class="filters"><input class="control search" id="search" placeholder="Search tasks"><select class="control" id="assigneeFilter"><option value="">Everyone</option></select></div></div>
    <section class="board"><div class="thead"><div></div><div>Task</div><div>Assigned to</div><div>Due</div><div>Priority</div><div>Status</div><div></div></div><div id="taskList" class="loading">Loading tasks…</div></section>
  </main>
  <dialog id="taskDialog"><form id="taskForm"><div class="modal-head"><h2 id="modalTitle">New task</h2><button type="button" class="close" onclick="taskDialog.close()">×</button></div><div class="form"><input type="hidden" id="taskId"><div class="field"><label for="title">Task or follow-up</label><input id="title" maxlength="180" required placeholder="e.g. Call customer about installation date"></div><div class="field"><label for="description">Notes</label><textarea id="description" placeholder="Add the customer name, job number or anything the assignee needs"></textarea></div><div class="form-grid"><div class="field"><label for="assignee">Assign to</label><select id="assignee" required></select></div><div class="field"><label for="dueDate">Due date</label><input id="dueDate" type="date" required></div></div><div class="form-grid"><div class="field"><label for="priority">Priority</label><select id="priority"><option value="urgent">Urgent</option><option value="high">High</option><option value="normal" selected>Normal</option><option value="low">Low</option></select></div><div class="field"><label for="createdBy">Created by</label><select id="createdBy" required></select></div></div></div><div class="modal-actions"><button type="button" id="archiveBtn" class="btn btn-light danger" onclick="archiveTask()" hidden>Archive</button><span></span><button type="button" class="btn btn-light" onclick="taskDialog.close()">Cancel</button><button class="btn btn-primary" id="saveBtn">Save task</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <script src="/assets/internal-systems-sidebar.js"></script>
  <script>
    const SB_URL='https://yxgdixwneprhjxzdlaqw.supabase.co';
    const SB_KEY='sb_publishable_94nQfItNfgNZZc2P1Slb1Q_ECjCmu47';
    const PEOPLE=['Vignesh','David','Shanira','Alda','Amit'];
    const H={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'};
    let tasks=[],view='open';
    const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials=n=>n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
    const fmt=d=>new Date(`${d}T00:00:00`).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
    function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
    function api(path='',opts={}){return fetch(`${SB_URL}/rest/v1/portal_tasks${path}`,{...opts,headers:{...H,...(opts.headers||{})}})}
    function currentUser(){return $('currentUser').value}
    function initPeople(){for(const id of ['currentUser','assignee','createdBy'])$(id).innerHTML=PEOPLE.map(n=>`<option>${n}</option>`).join('');$('assigneeFilter').insertAdjacentHTML('beforeend',PEOPLE.map(n=>`<option>${n}</option>`).join(''));const saved=localStorage.getItem('goldsure_task_user');$('currentUser').value=PEOPLE.includes(saved)?saved:'Vignesh';$('currentUser').onchange=()=>{localStorage.setItem('goldsure_task_user',currentUser());render()}}
    async function load(){try{const r=await api('?select=*&archived_at=is.null&order=due_date.asc,priority.asc,created_at.desc');if(!r.ok)throw new Error(await r.text());tasks=await r.json();render()}catch(e){$('taskList').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Task board needs database setup</h3><p>The task table is not available yet.</p></div>';console.error(e)}}
    function filtered(){const t=today(),q=$('search').value.trim().toLowerCase(),person=$('assigneeFilter').value;return tasks.filter(x=>{if(person&&x.assignee!==person)return false;if(q&&!`${x.title} ${x.description} ${x.assignee}`.toLowerCase().includes(q))return false;if(view==='open')return x.status==='open';if(view==='mine')return x.status==='open'&&x.assignee===currentUser();if(view==='today')return x.status==='open'&&x.due_date===t;if(view==='overdue')return x.status==='open'&&x.due_date<t;if(view==='completed')return x.status==='completed';return true})}
    function render(){const t=today(),weekAgo=new Date(Date.now()-7*864e5);$('kOpen').textContent=tasks.filter(x=>x.status==='open').length;$('kToday').textContent=tasks.filter(x=>x.status==='open'&&x.due_date===t).length;$('kOverdue').textContent=tasks.filter(x=>x.status==='open'&&x.due_date<t).length;$('kDone').textContent=tasks.filter(x=>x.status==='completed'&&new Date(x.completed_at)>=weekAgo).length;const rows=filtered();if(!rows.length){$('taskList').innerHTML='<div class="empty"><div class="empty-icon">✓</div><h3>No tasks here</h3><p>Create a task or choose another view.</p></div>';return}$('taskList').innerHTML=rows.map(x=>{const dueClass=x.status==='open'?(x.due_date<t?'over':x.due_date===t?'today':''):'';return `<div class="task-row ${x.status==='completed'?'completed':''}"><div><button class="check ${x.status==='completed'?'done':''}" aria-label="${x.status==='completed'?'Reopen':'Complete'} task" onclick="toggleTask('${x.id}')">${x.status==='completed'?'✓':''}</button></div><div><div class="task-title">${esc(x.title)}</div>${x.description?`<div class="task-desc" title="${esc(x.description)}">${esc(x.description)}</div>`:''}</div><div><span class="avatar">${initials(x.assignee)}</span><span class="assignee">${esc(x.assignee)}</span></div><div class="due ${dueClass}">${fmt(x.due_date)}</div><div><span class="pill ${x.priority}">${x.priority}</span></div><div class="status ${x.status}">${x.status==='completed'?'Completed':'Open'}</div><div><button class="menu-btn" aria-label="Edit task" onclick="openTask('${x.id}')">⋯</button></div></div>`}).join('')}
    function openTask(id){const x=tasks.find(t=>t.id===id);$('taskId').value=x?.id||'';$('modalTitle').textContent=x?'Edit task':'New task';$('title').value=x?.title||'';$('description').value=x?.description||'';$('assignee').value=x?.assignee||currentUser();$('dueDate').value=x?.due_date||today();$('priority').value=x?.priority||'normal';$('createdBy').value=x?.created_by||currentUser();$('archiveBtn').hidden=!x;taskDialog.showModal();setTimeout(()=>$('title').focus(),50)}
    $('taskForm').onsubmit=async e=>{e.preventDefault();const id=$('taskId').value,payload={title:$('title').value.trim(),description:$('description').value.trim(),assignee:$('assignee').value,due_date:$('dueDate').value,priority:$('priority').value,created_by:$('createdBy').value};$('saveBtn').disabled=true;try{const r=await api(id?`?id=eq.${id}`:'',{method:id?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());taskDialog.close();toast(id?'Task updated':'Task assigned');await load()}catch(err){toast('Could not save task');console.error(err)}finally{$('saveBtn').disabled=false}}
    async function toggleTask(id){const x=tasks.find(t=>t.id===id),done=x.status!=='completed';const payload={status:done?'completed':'open',completed_at:done?new Date().toISOString():null,completed_by:done?currentUser():null};const r=await api(`?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});if(r.ok){toast(done?'Task completed':'Task reopened');await load()}else toast('Could not update task')}
    async function archiveTask(){const id=$('taskId').value;if(!id||!confirm('Archive this task?'))return;const r=await api(`?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({archived_at:new Date().toISOString()})});if(r.ok){taskDialog.close();toast('Task archived');await load()}else toast('Could not archive task')}
    $('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));view=b.dataset.view;render()};$('search').oninput=render;$('assigneeFilter').onchange=render;
    initPeople();load();
  </script>
</body>
</html>
