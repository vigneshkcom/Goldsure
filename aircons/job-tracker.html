<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Goldsure · VIC Aircon Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/gs-favicon-96px.png">
<link rel="apple-touch-icon" href="/assets/gs-favicon-96px.png">
<style>
/* Grouped table view, monday.com "Main table" style.
   Palette matches /aircons/quote-tracker.html */
:root{
  --blue:#0073ea; --blue-dark:#0060b9; --blue-bg:#e6f1fd;
  --green:#00c875; --green-bg:#e7f9f1;
  --amber:#fdab3d; --amber-bg:#fff4e5;
  --red:#e2445c; --red-bg:#fdecef;
  --bg:#f6f7fb; --surface:#fff; --surface2:#f5f6f8; --surface3:#eceef4;
  --border:#e6e9ef; --border2:#d0d4e4;
  --text:#323338; --muted:#676879;
  --shadow:0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 4px 14px rgba(0,0,0,.10);
  --shadow-lg:0 12px 32px rgba(0,0,0,.18);
  /* Desktop row template — the heading row reuses it so columns line up. */
  /* Customer is a capped range, not a flexible fr track, so it doesn't keep
     growing on a wide monitor when the names inside it never need that
     much room — the space that used to waste there goes to Address and
     the two comment columns instead. */
  --cols:30px 80px minmax(120px,190px) minmax(220px,1.7fr) 60px 98px 110px 94px 98px minmax(155px,1.25fr) minmax(155px,1.25fr);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Figtree',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;
  -webkit-font-smoothing:antialiased;
}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ── Header ── */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:60;min-height:60px;gap:14px;
}
.header-left{display:flex;align-items:center;gap:14px;min-width:0}
.header-logo img{height:36px;width:auto;object-fit:contain;display:block}
.hd{width:1px;height:26px;background:var(--border2);flex:none}
.page-label{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.tracker-nav{display:inline-flex;gap:3px;background:var(--surface2);border-radius:8px;padding:3px}
.trk-link{
  font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:6px;
  color:var(--muted);text-decoration:none;transition:background .12s,color .12s;white-space:nowrap;
}
.trk-link:hover{background:#fff;color:var(--text)}
.trk-link.is-active{background:var(--blue);color:#fff}
.header-right{display:flex;align-items:center;gap:8px;flex:none}
.nav-btn{
  font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:7px;
  border:1px solid var(--border2);background:var(--surface);color:var(--text);
  cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s;
}
.nav-btn:hover{background:var(--surface2)}
.nav-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.nav-btn.primary:hover{background:var(--blue-dark)}
.spin-icon{display:inline-block}
.spinning .spin-icon{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Toolbar ── */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);
}
.search-input{
  font-family:inherit;font-size:13.5px;padding:8px 12px;border-radius:7px;
  border:1px solid var(--border2);background:var(--surface);color:var(--text);
  min-width:260px;flex:1;max-width:420px;outline:none;
}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.stat-pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat-pill{
  display:flex;align-items:baseline;gap:6px;background:var(--surface2);
  border:1px solid var(--border);border-radius:99px;padding:5px 13px;font-size:12.5px;
}
.stat-pill b{font-size:14px;font-weight:700}
.stat-pill span{color:var(--muted)}

/* ── Groups ── */
main{padding:18px 20px 60px;max-width:1800px;margin:0 auto}
.group{margin-bottom:26px}
.group-head{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.group-caret{
  background:none;border:none;cursor:pointer;color:var(--g);padding:2px;
  display:flex;align-items:center;transition:transform .15s;font-family:inherit;
}
.group.collapsed .group-caret{transform:rotate(-90deg)}
.group-name{font-size:16px;font-weight:700;color:var(--g);letter-spacing:-.01em}
.group-count{
  font-size:12px;font-weight:600;color:var(--muted);
  background:var(--surface3);border-radius:99px;padding:2px 9px;
}

.table{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  overflow:hidden;box-shadow:var(--shadow);border-left:4px solid var(--g);
}
.group.collapsed .table{display:none}
.thead{
  display:grid;grid-template-columns:var(--cols);gap:0;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.thead div{
  font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 12px;
  border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.thead div:last-child{border-right:none}
.rows{min-height:8px}
.rows.is-over{background:var(--blue-bg)}

.row{
  display:grid;grid-template-columns:var(--cols);align-items:center;
  border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface);
  transition:background .1s;
}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
.row>div{
  padding:11px 12px;border-right:1px solid var(--border);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;
}
.row>div:last-child{border-right:none}
.row.cancelled{color:var(--muted);background:repeating-linear-gradient(45deg,#fff,#fff 9px,#fafafa 9px,#fafafa 18px)}
.row.cancelled .c-cust,.row.cancelled .c-job{text-decoration:line-through}

.c-grip{
  display:flex;align-items:center;justify-content:center;color:var(--border2);
  cursor:grab;touch-action:none;padding:0!important;font-size:13px;
}
.c-grip:hover{color:var(--muted)}
.c-grip:active{cursor:grabbing}
.c-job{font-weight:700;font-variant-numeric:tabular-nums;cursor:copy}
.c-job:hover{color:var(--blue)}
.c-cust{font-weight:600}
.c-addr{color:var(--muted)}
/* Map gets its own column so every button sits on the same vertical line,
   regardless of how long the address beside it runs. */
.c-map{display:flex;align-items:center;justify-content:center;padding:6px 8px!important}
.map-btn{
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-bg);
  border:1px solid #bcdcfb;border-radius:6px;padding:3px 10px;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s;
}
.map-btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.c-date{font-variant-numeric:tabular-nums;cursor:pointer}
.c-date:hover{color:var(--blue)}
.c-date.overdue{color:var(--red);font-weight:600}
.date-input{
  font-family:inherit;font-size:13px;width:100%;border:1px solid var(--blue);
  border-radius:5px;padding:4px 6px;outline:none;background:#fff;color:var(--text);
  box-shadow:0 0 0 3px var(--blue-bg);
}
.c-oop,.c-dep,.c-pend{font-variant-numeric:tabular-nums;text-align:right}
.c-oop{font-weight:600}
.c-dep{color:#0b8b55;font-weight:600}
.c-pend{font-weight:700}
.c-pend.owing{color:var(--blue-dark)}
.c-pend.settled{color:var(--muted);font-weight:500}

/* Click-to-edit comment cells, like typing into a spreadsheet cell. Wrap
   rather than truncate — a cut-off comment defeats the point of one.
   Goldsure Comments needs a password to edit; Eco Comments is open to
   anyone with the link. */
.c-comment,.c-eco-comment{cursor:text;color:var(--text);white-space:normal!important;overflow:visible!important}
.c-comment .comment-text,.c-eco-comment .comment-text{
  display:block;overflow-wrap:anywhere;white-space:normal;
  min-height:19px;font-size:13px;line-height:1.4;
}
.c-comment .comment-text.empty,.c-eco-comment .comment-text.empty{color:#b6bbc8}
.c-comment:hover .comment-text.empty,.c-eco-comment:hover .comment-text.empty{color:var(--muted)}
.comment-input{
  font-family:inherit;font-size:13px;width:100%;border:1px solid var(--blue);
  border-radius:5px;padding:5px 7px;outline:none;resize:none;overflow:hidden;
  background:#fff;color:var(--text);box-shadow:0 0 0 3px var(--blue-bg);line-height:1.4;
}
.mob-label{display:none}
.lock-label{display:none}

.row-ghost{
  position:fixed;z-index:999;pointer-events:none;width:var(--gw);
  box-shadow:var(--shadow-lg);opacity:.97;border-radius:6px;left:0;top:0;
  background:var(--surface);border:1px solid var(--border2);
}
.drag-placeholder{background:var(--blue-bg);border-bottom:1px solid var(--blue)}

.group-add{
  display:block;width:100%;text-align:left;padding:10px 12px 10px 42px;
  background:var(--surface);border:none;border-top:1px solid var(--border);
  color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
}
.group-add:hover{background:var(--surface2);color:var(--blue)}
.group-empty{padding:16px 12px 16px 42px;color:var(--muted);font-size:13px}

/* ── Modal ── */
.modal-scrim{
  position:fixed;inset:0;background:rgba(32,37,61,.5);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
}
.modal-scrim.show{display:flex}
.modal{
  background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);
  width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;
  animation:pop .16s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 20px;border-bottom:1px solid var(--border);flex:none;
}
.modal-title{font-size:16.5px;font-weight:700}
.modal-x{
  background:none;border:none;font-size:22px;line-height:1;color:var(--muted);
  cursor:pointer;padding:2px 6px;border-radius:6px;font-family:inherit;
}
.modal-x:hover{background:var(--surface2);color:var(--text)}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{
  font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:7px;
  border:1px solid var(--border2);background:var(--surface);color:var(--text);outline:none;width:100%;
}
.field textarea{resize:vertical;min-height:64px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.check-row{display:flex;align-items:center;gap:9px;grid-column:1/-1}
.check-row input{width:16px;height:16px;accent-color:var(--red);flex:none}
.check-row label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);font-weight:600}
.modal-foot{display:flex;align-items:center;gap:9px;padding:14px 20px;border-top:1px solid var(--border);flex:none}
.btn{
  font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:7px;
  border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;transition:background .12s;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.danger{color:var(--red);border-color:rgba(226,68,92,.4)}
.btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.foot-spacer{margin-left:auto}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,150%);
  background:#323338;color:#fff;font-size:13.5px;font-weight:600;
  padding:11px 20px;border-radius:8px;box-shadow:var(--shadow-lg);
  z-index:300;transition:transform .22s ease;max-width:90vw;text-align:center;
}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:var(--red)}
.loading-state{padding:60px 20px;text-align:center;color:var(--muted)}

/* ── Mobile: rows become stacked cards. No horizontal scrolling. ── */
@media (max-width:820px){
  header{position:static;padding:10px 14px;min-height:0;gap:10px;flex-wrap:wrap}
  .page-label{font-size:16px}
  .hd,.tracker-nav,.desktop-only{display:none}
  .header-logo img{height:30px}
  .header-right{flex:1;justify-content:flex-end}
  .toolbar{padding:11px 14px;gap:8px}
  .search-input{min-width:0;max-width:none;flex:1 1 100%}
  .stat-pills{margin-left:0}
  main{padding:14px 12px 50px}
  .group{margin-bottom:22px}
  .group-head{padding:0 2px}

  /* Rows become compact cards — still the same grouped list as desktop (To
     Book / Scheduled / Installed stacked vertically), just each row is a
     handful of dense lines instead of a tall strip. Every field that's
     click-to-edit on desktop (job no. copies, date opens a picker, comment
     opens a text box) works exactly the same way here — this only changes
     how much space the closed, unedited row takes up. */
  .table{background:none;border:none;box-shadow:none;border-left:none;border-radius:0}
  .thead{display:none}
  .rows{display:flex;flex-direction:column;gap:7px}
  .row{
    grid-template-columns:26px 1fr 1fr 1fr;
    grid-template-areas:
      "grip job   .     date"
      "grip cust  cust  cust"
      "grip addr  addr  addr"
      "grip oop   dep   pend"
      "grip comm  comm  comm"
      "grip ecom  ecom  ecom";
    padding:9px 10px 9px 7px;row-gap:2px;column-gap:6px;
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--g);
    border-radius:8px;box-shadow:var(--shadow);
  }
  .row>div{
    border-right:none;padding:1px 2px;white-space:normal;
    overflow-wrap:anywhere;text-overflow:clip;
  }
  /* align-self (not align-items) pins the grip itself to the top of its
     grid area — align-items only affects a flex box's own children, and
     with a container default of stretch, the grip's "⠿" was landing dead
     centre of the whole multi-row card instead of level with the job no. */
  .c-grip{grid-area:grip;align-self:start;padding-top:2px!important;font-size:15px;color:var(--border2)}
  .c-job{grid-area:job;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
  .c-cust{grid-area:cust;font-size:14.5px;font-weight:700;padding-top:1px!important}
  /* Map is desktop-only — on a phone the address gets the full row instead,
     wrapping rather than truncating, so the whole thing is readable without
     needing the button that used to share this line. */
  .c-addr{
    grid-area:addr;font-size:12.5px;line-height:1.35;color:var(--muted);
    white-space:normal!important;overflow:visible!important;text-overflow:clip!important;
  }
  .c-map{display:none}
  .c-date{grid-area:date;text-align:right;font-size:12px;font-weight:600}

  /* Money cells sit three-up on one line — a short label above a bold
     figure, generated with a pseudo-element from data-label rather than the
     long desktop-style text used to bloat this into three separate lines. */
  .c-oop,.c-dep,.c-pend{font-size:12.5px;padding-top:6px!important;border-top:1px solid var(--surface3);margin-top:3px}
  .c-oop{grid-area:oop;text-align:left}
  .c-dep{grid-area:dep;text-align:center}
  .c-pend{grid-area:pend;text-align:right}
  .c-oop::before,.c-dep::before,.c-pend::before{
    content:attr(data-label);display:block;font-size:9.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-bottom:1px;
  }
  /* Each cell's own border-top/margin double as the row's divider line, so
     when out_of_pocket/deposit/pending are all empty, :empty hides every
     cell and the divider disappears with them — no separate rule needed. */
  .c-oop:empty,.c-dep:empty,.c-pend:empty{display:none}

  .c-eco-comment{grid-area:ecom;padding-top:6px!important;font-size:12.5px;border-top:1px solid var(--surface3);margin-top:2px}
  .c-comment{grid-area:comm;padding-top:4px!important;font-size:12.5px}
  .c-comment .comment-text,.c-eco-comment .comment-text{white-space:normal}
  /* An unedited "Add comment…" placeholder is an invitation, not information
     — collapse it to a slim single line rather than a full-height row, and
     drop it out entirely once a real comment is there to show instead. */
  .c-comment .comment-text.empty,.c-eco-comment .comment-text.empty{font-size:11.5px}
  .c-eco-comment::before{
    content:"Eco Comments";display:block;font-size:9.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-bottom:2px;
  }
  .c-comment .lock-label{
    display:block;font-size:9.5px;font-weight:600;text-transform:uppercase;
    letter-spacing:.3px;color:var(--muted);margin-bottom:2px;
  }
  /* Still used for the "· cancelled" tag next to the customer name — the
     three money labels above generate their own via ::before now. */
  .mob-label{display:inline;color:var(--muted);font-weight:500;font-size:11px}
  .group-add{
    padding-left:14px;border:1px dashed var(--border2);border-radius:8px;margin-top:2px;
  }
  .group-empty{padding:14px;border:1px dashed var(--border2);border-radius:8px}

  .modal-scrim{padding:0;align-items:flex-end}
  .modal{max-width:none;border-radius:14px 14px 0 0;max-height:94vh}
  .form-grid{grid-template-columns:1fr}
  .modal-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .btn{padding:11px 16px;flex:1}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-logo"><img src="/assets/Goldsure-Horizontal-Logo-RGB-600px-w-72ppi.jpg" alt="Goldsure"></div>
    <div class="hd"></div>
    <span class="page-label">VIC Aircon · Job Tracker</span>
  </div>
  <div class="header-right">
    <button class="nav-btn desktop-only" onclick="exportCSV()">⬇ CSV</button>
    <button class="nav-btn desktop-only" id="refreshBtn" onclick="loadJobs()"><span class="spin-icon" id="spinIcon">↻</span> Refresh</button>
    <button class="nav-btn primary desktop-only" onclick="openJobModal(null)">+ New Job</button>
  </div>
</header>

<div class="toolbar">
  <input type="search" class="search-input" id="searchInput" placeholder="Search job no, customer, address, comments…" oninput="render()">
  <div class="stat-pills" id="statPills"></div>
</div>

<main id="groups"><div class="loading-state">Loading jobs…</div></main>

<!-- Add / Edit job -->
<div class="modal-scrim" id="jobScrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
    <div class="modal-head">
      <div class="modal-title" id="jobModalTitle">New Job</div>
      <button class="modal-x" onclick="closeJobModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field">
          <label for="f-job-no">Job No.</label>
          <input type="text" id="f-job-no" autocomplete="off" inputmode="numeric">
        </div>
        <div class="field">
          <label for="f-status">Group</label>
          <select id="f-status"></select>
        </div>
        <div class="field full">
          <label for="f-customer">Customer *</label>
          <input type="text" id="f-customer" autocomplete="off">
        </div>
        <div class="field full">
          <label for="f-address">Address</label>
          <input type="text" id="f-address" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-booked">Booked Date</label>
          <input type="date" id="f-booked">
        </div>
        <div class="field">
          <label for="f-oop">Out of Pocket</label>
          <input type="number" id="f-oop" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
        </div>
        <div class="field">
          <label for="f-deposit">Deposit</label>
          <input type="number" id="f-deposit" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
        </div>
        <div class="field">
          <label for="f-pending">ECO</label>
          <input type="text" id="f-pending" readonly tabindex="-1"
                 style="background:var(--surface2);font-weight:700;cursor:default">
        </div>
        <div class="field full">
          <label for="f-notes">Goldsure Comments</label>
          <textarea id="f-notes" rows="2"></textarea>
        </div>
        <div class="field full">
          <label for="f-eco-notes">Eco Comments</label>
          <textarea id="f-eco-notes" rows="2" placeholder="Visible and editable by anyone with this link"></textarea>
        </div>
        <div class="check-row">
          <input type="checkbox" id="f-cancelled">

<script data-cfasync="false">
const SUPABASE_URL = 'https://yxgdixwneprhjxzdlaqw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_94nQfItNfgNZZc2P1Slb1Q_ECjCmu47';
const TABLE = 'aircon_jobs';
const SB_HEADERS = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

// Row groups. `key` is what lives in the status column in Supabase.
// dateLabel is the Booked-column heading — worded per group since a date on
// a To Book job hasn't happened yet (it's a target), where the same column
// on a Scheduled/Installed job is the date that's actually locked in.
const GROUPS = [
  { key:'to_book',   label:'To Book',   color:'var(--blue)',  dateLabel:'To Book' },
  { key:'scheduled', label:'Scheduled', color:'var(--amber)', dateLabel:'Booked' },
  { key:'installed', label:'Installed', color:'var(--green)', dateLabel:'Booked' },
];
const GROUP_KEYS = GROUPS.map(g => g.key);
function groupLabel(key){ return (GROUPS.find(g => g.key === key) || {}).label || key; }
// Free-text stages from the old spreadsheet land in the right group.
const STATUS_ALIASES = {
  'to book':'to_book', 'tobook':'to_book', 'date pending':'to_book', 'pending':'to_book',
  'scheduled':'scheduled', 'booked':'scheduled', 'assigned':'scheduled',
  'overdue assigned':'scheduled', 'overdue':'scheduled',
  'installed':'installed', 'completed':'installed', 'complete':'installed', 'done':'installed',
};
function normStatus(s){
  const raw = String(s || '').trim();
  if (GROUP_KEYS.includes(raw)) return raw;
  return STATUS_ALIASES[raw.toLowerCase().replace(/[_-]+/g,' ')] || 'to_book';
}

let jobs = [];
let editingId = null;
const collapsed = new Set();

// ── Helpers ──
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function money(n){
  const v = parseFloat(n);
  if (!isFinite(v) || v === 0) return '';
  return '$' + v.toLocaleString('en-AU', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function isOverdue(j){
  return !!j.booked_date && !j.cancelled && j.status !== 'installed' && j.booked_date < todayISO();
}
let toastTimer = null;
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Load ──
async function loadJobs(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=position.asc&limit=2000`,
      { headers: SB_HEADERS }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    jobs = (Array.isArray(rows) ? rows : []).map(j => ({ ...j, status: normStatus(j.status) }));
    render();
  }catch(e){
    document.getElementById('groups').innerHTML =
      '<div class="loading-state">Could not load jobs. Check the <code>' + TABLE +
      '</code> table exists in Supabase, then hit Refresh.</div>';
    showToast('Could not load jobs.', true);
  }finally{
    btn.classList.remove('spinning');
  }
}

// ── Render ──
function visibleJobs(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) return jobs;
  return jobs.filter(j =>
    [j.job_no, j.customer, j.address, j.comments, j.eco_comments]
      .filter(Boolean).join(' ').toLowerCase().includes(q)
  );
}

// Pending is never stored — it is always out of pocket minus deposit, so the
// two can't drift apart.
function pendingOf(j){
  const oop = parseFloat(j.out_of_pocket) || 0;
  const dep = parseFloat(j.deposit) || 0;
  return oop - dep;
}

function rowHTML(j){
  const overdue = isOverdue(j);
  const oop = money(j.out_of_pocket), dep = money(j.deposit);
  const pend = pendingOf(j);
  const pendCls = !j.out_of_pocket ? 'settled' : (pend > 0 ? 'owing' : 'settled');
  const pendTxt = !j.out_of_pocket ? '' : (pend > 0 ? money(pend) : 'Paid');
  const addr = j.address || '';
  const mapHref = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr);
  const comment = j.comments || '';
  const ecoComment = j.eco_comments || '';

  return `<div class="row${j.cancelled ? ' cancelled' : ''}" data-id="${esc(j.id)}">
    <div class="c-grip" title="Drag to another group">⠿</div>
    <div class="c-job"${j.job_no ? ' title="Click to copy"' : ''}>${j.job_no ? esc(j.job_no) : '—'}</div>
    <div class="c-cust">${esc(j.customer || 'Untitled')}${j.cancelled ? ' <span class="mob-label">· cancelled</span>' : ''}</div>
    <div class="c-addr">${esc(addr)}</div>
    <div class="c-map">${addr ? `<a class="map-btn" href="${esc(mapHref)}" target="_blank" rel="noopener noreferrer" title="Open in Google Maps">Map</a>` : ''}</div>
    <div class="c-date${overdue ? ' overdue' : ''}" title="Click to set the booked date">${j.booked_date ? (overdue ? '⚠ ' : '') + esc(fmtDate(j.booked_date)) : '—'}</div>
    <div class="c-oop" data-label="Total">${oop ? esc(oop) : ''}</div>
    <div class="c-dep" data-label="Paid">${dep ? esc(dep) : ''}</div>
    <div class="c-pend ${pendCls}" data-label="ECO">${pendTxt ? esc(pendTxt) : ''}</div>
    <div class="c-comment" title="Click to add a comment"><span class="lock-label">Goldsure Comments</span><span class="comment-text${comment ? '' : ' empty'}">${comment ? esc(comment) : 'Add comment…'}</span></div>
    <div class="c-eco-comment" title="Click to add an Eco Comment — anyone with this link can edit"><span class="comment-text${ecoComment ? '' : ' empty'}">${ecoComment ? esc(ecoComment) : 'Add comment…'}</span></div>
  </div>`;
}

// Earliest booked date first. Jobs with no date yet sort to the end of their
// group rather than to the top, since an empty date isn't "the soonest job" —
// it's the opposite, an unscheduled one. Position (drag order) only breaks
// ties, e.g. several jobs on the same day, or several with no date at all.
function byBookedDate(a, b){
  if (a.booked_date && b.booked_date){
    if (a.booked_date !== b.booked_date) return a.booked_date < b.booked_date ? -1 : 1;
    return (a.position ?? 0) - (b.position ?? 0);
  }
  if (a.booked_date) return -1;
  if (b.booked_date) return 1;
  return (a.position ?? 0) - (b.position ?? 0);
}

function render(){
  const list = visibleJobs();
  document.getElementById('groups').innerHTML = GROUPS.map(g => {
    const items = list.filter(j => j.status === g.key).sort(byBookedDate);
    const isCollapsed = collapsed.has(g.key);
    return `<section class="group${isCollapsed ? ' collapsed' : ''}" data-group="${g.key}" style="--g:${g.color}">
      <div class="group-head">
        <button class="group-caret" onclick="toggleGroup('${g.key}')" aria-label="Collapse ${esc(g.label)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
               stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <span class="group-name">${esc(g.label)}</span>
        <span class="group-count">${items.length}</span>
      </div>
      <div class="table">
        <div class="thead">
          <div></div><div>Job No.</div><div>Customer</div><div>Address</div><div></div>
          <div>${esc(g.dateLabel)}</div><div>Out of Pocket</div><div>Deposit</div><div>ECO</div><div>Goldsure Comments</div><div>Eco Comments</div>
        </div>
        <div class="rows" data-status="${g.key}">
          ${items.length ? items.map(rowHTML).join('') : '<div class="group-empty">No jobs in this group yet.</div>'}
        </div>
        <button class="group-add" onclick="openJobModal(null,'${g.key}')">+ Add job</button>
      </div>
    </section>`;
  }).join('');
  renderStats(list);
}

function toggleGroup(key){
  collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key);
  render();
}

// ── Click-to-edit comments, spreadsheet style ──
// Both comment fields are open to anyone with the link — the whole page now
// sits behind its own password gate (see the auth check near the bottom of
// this script), so a per-field gate on top of that is no longer needed.
document.getElementById('groups').addEventListener('click', e => {
  const ecoCell = e.target.closest('.c-eco-comment');
  if (ecoCell && !ecoCell.querySelector('textarea')){
    const id = ecoCell.closest('.row')?.dataset.id;
    if (id) startCommentEdit(id, ecoCell, 'eco_comments');
    return;
  }
  const cell = e.target.closest('.c-comment');
  if (!cell || cell.querySelector('textarea')) return;
  const id = cell.closest('.row')?.dataset.id;
  if (id) startCommentEdit(id, cell, 'comments');
});

function startCommentEdit(id, cell, field){
  const j = jobById(id);
  if (!j) return;
  const original = j[field] || '';
  const ta = document.createElement('textarea');
  ta.className = 'comment-input';
  ta.rows = 1;
  ta.value = original;
  cell.innerHTML = '';
  cell.appendChild(ta);

  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  grow();
  ta.focus();
  ta.setSelectionRange(original.length, original.length);

  let cancelled = false;
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Escape'){ cancelled = true; ta.blur(); }
    // Enter saves, Shift+Enter puts in a line break.
    else if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); ta.blur(); }
  });
  ta.addEventListener('blur', () => {
    const val = cancelled ? original : ta.value.trim();
    paintComment(cell, val, field);
    if (!cancelled && val !== original){
      j[field] = val || null;
      persist(id, { [field]: j[field] }, () => {
        j[field] = original || null;
        paintComment(cell, original, field);
      });
      if (field === 'eco_comments' && val) notifyEcoComment(j, val);
    }
  });
}

function paintComment(cell, text, field){
  const label = field === 'comments' ? '<span class="lock-label">Goldsure Comments</span>' : '';
  cell.innerHTML = `${label}<span class="comment-text${text ? '' : ' empty'}">${text ? esc(text) : 'Add comment…'}</span>`;
}

// Best-effort: the comment is already saved to Supabase by the time this
// fires, so a failed notification never loses or blocks it.
function notifyEcoComment(j, comment){
  fetch('/api/battery/request-callback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'eco-comment-notify',
      job_no: j.job_no || '', customer: j.customer || '', address: j.address || '', comment,
    }),
  }).catch(() => {});
}

// Fires whenever a job's status actually changes (dragged to another group,
// or its status dropdown changed in the modal) — not on a plain reorder
// within the same group.
function notifyStatusChange(j, fromStatus, toStatus){
  fetch('/api/battery/request-callback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'job-status-notify',
      job_no: j.job_no || '', customer: j.customer || '', address: j.address || '',
      from_label: groupLabel(fromStatus), to_label: groupLabel(toStatus),
    }),
  }).catch(() => {});
}

// ── Job No.: click to copy, never to open the editor (it gets pasted a lot) ──
document.getElementById('groups').addEventListener('click', e => {
  const cell = e.target.closest('.c-job');
  if (!cell) return;
  const jobNo = cell.textContent.trim();
  if (!jobNo || jobNo === '—') return;
  copyToClipboard(jobNo);
});

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    // Fallback for browsers/contexts without the async Clipboard API.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e2) { showToast('Could not copy.', true); ta.remove(); return; }
    ta.remove();
  }
  showToast('Copied ' + text);
}

// ── Booked Date: click to edit inline with a native date picker ──
document.getElementById('groups').addEventListener('click', e => {
  const cell = e.target.closest('.c-date');
  if (!cell || cell.querySelector('input')) return;
  const id = cell.closest('.row')?.dataset.id;
  if (id) startDateEdit(id, cell);
});

function startDateEdit(id, cell){
  const j = jobById(id);
  if (!j) return;
  const original = j.booked_date || '';
  const inp = document.createElement('input');
  inp.type = 'date';
  inp.className = 'date-input';
  inp.value = original;
  cell.innerHTML = '';
  cell.appendChild(inp);
  inp.focus();
  if (inp.showPicker) { try { inp.showPicker(); } catch(e){} }

  let done = false;
  const commit = (cancelled) => {
    if (done) return;
    done = true;
    const val = cancelled ? original : inp.value;
    if (val === original){ render(); return; }
    // Booked date drives sort order and the overdue flag, so — unlike a
    // comment — this needs a re-render, not just a repaint of one cell.
    j.booked_date = val || null;
    render();
    persist(id, { booked_date: j.booked_date }, () => {
      j.booked_date = original || null;
      render();
    });
  };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Escape') commit(true); });
  inp.addEventListener('change', () => inp.blur());
  inp.addEventListener('blur', () => commit(false));
}

// The money totals (out of pocket / deposits / pending) live per-group in
// the group header instead — the top bar just says how many jobs there are
// and flags anything overdue, which is what needs to be visible at a glance.
function renderStats(list){
  const overdue = list.filter(isOverdue).length;
  document.getElementById('statPills').innerHTML =
    `<div class="stat-pill"><b>${list.length}</b><span>jobs</span></div>` +
    (overdue ? `<div class="stat-pill" style="background:var(--red-bg);border-color:#f5c2cb"><b style="color:var(--red)">${overdue}</b><span style="color:var(--red)">overdue</span></div>` : '');
}

// ── Drag rows between groups (pointer events → mouse and touch share a path) ──
let drag = null;
let rafId = null;
function jobById(id){ return jobs.find(j => String(j.id) === String(id)); }

document.getElementById('groups').addEventListener('pointerdown', e => {
  const row = e.target.closest('.row');
  if (!row || drag) return;
  // These cells handle their own clicks (map link, comment editor, copy job
  // no., date picker) — starting a drag here would swallow that click, and
  // for job no./date it would also wrongly fall through to "open the editor".
  if (e.target.closest('.map-btn, .c-comment, .c-eco-comment, .c-job, .c-date')) return;
  const onGrip = !!e.target.closest('.c-grip');
  // Touch drags only from the grip, so the page still scrolls under a finger.
  if (e.pointerType !== 'mouse' && !onGrip) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  const rect = row.getBoundingClientRect();
  drag = {
    pointerId:e.pointerId, row, id:row.dataset.id,
    startX:e.clientX, startY:e.clientY,
    offsetX:e.clientX - rect.left, offsetY:e.clientY - rect.top,
    width:rect.width, height:rect.height, started:false,
    lastX:e.clientX, lastY:e.clientY,
  };
});

// On the window, not the list: once a drag is under way the pointer is
// regularly outside the row it started on, and pointer capture breaks the
// moment the DOM underneath it changes.
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  if (!drag.started){
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 6) return;
    beginDrag();
  }
  e.preventDefault();
  positionGhost();
  updateDropTarget();
}, { passive:false });

window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

function beginDrag(){
  drag.started = true;
  document.body.classList.add('is-dragging');

  const ghost = drag.row.cloneNode(true);
  ghost.classList.add('row-ghost');
  ghost.style.setProperty('--gw', drag.width + 'px');
  document.body.appendChild(ghost);
  drag.ghost = ghost;

  // A standalone node does the moving between groups. The real row is only
  // hidden — never relocated — so nothing disturbs the live pointer.
  const ph = document.createElement('div');
  ph.className = 'drag-placeholder';
  ph.style.height = drag.height + 'px';
  drag.row.after(ph);
  drag.placeholder = ph;
  drag.row.style.display = 'none';

  positionGhost();
  const step = () => { if (!drag || !drag.started) return; autoScroll(); rafId = requestAnimationFrame(step); };
  rafId = requestAnimationFrame(step);
}

function positionGhost(){
  if (!drag?.ghost) return;
  drag.ghost.style.transform = `translate(${drag.lastX - drag.offsetX}px, ${drag.lastY - drag.offsetY}px)`;
}

function updateDropTarget(){
  const el = document.elementFromPoint(drag.lastX, drag.lastY);
  const rows = el?.closest('.rows');
  document.querySelectorAll('.rows.is-over').forEach(n => n.classList.remove('is-over'));
  if (!rows) return;
  rows.classList.add('is-over');
  rows.querySelector('.group-empty')?.remove();

  const siblings = [...rows.querySelectorAll('.row')].filter(r => r !== drag.row);
  let before = null;
  for (const r of siblings){
    const b = r.getBoundingClientRect();
    if (drag.lastY < b.top + b.height / 2){ before = r; break; }
  }
  rows.insertBefore(drag.placeholder, before);
}

// Groups stack vertically, so dragging only ever needs the page to scroll.
function autoScroll(){
  const EDGE = 80, SPEED = 14;
  if (drag.lastY < EDGE) window.scrollBy(0, -SPEED);
  else if (drag.lastY > window.innerHeight - EDGE) window.scrollBy(0, SPEED);
}

function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.pointerId)) return;
  const d = drag;
  cancelAnimationFrame(rafId);

  if (!d.started){                      // a tap/click, not a drag
    drag = null;
    openJobModal(d.id);
    return;
  }

  d.ghost?.remove();
  d.row.style.display = '';
  document.body.classList.remove('is-dragging');
  document.querySelectorAll('.rows.is-over').forEach(n => n.classList.remove('is-over'));
  drag = null;

  const rows = d.placeholder.closest('.rows');
  const job = jobById(d.id);
  const newPos = rows ? positionFor(rows, d.placeholder) : null;
  d.placeholder.remove();
  if (!rows || !job){ render(); return; }

  const newStatus = rows.dataset.status;
  if (job.status === newStatus && job.position === newPos){ render(); return; }

  const prev = { status: job.status, position: job.position };
  const statusChanged = job.status !== newStatus;
  job.status = newStatus;
  job.position = newPos;
  render();
  persist(job.id, { status:newStatus, position:newPos }, () => {
    Object.assign(job, prev);           // put it back if the write failed
    render();
  });
  if (statusChanged) notifyStatusChange(job, prev.status, newStatus);
}

// Fractional midpoint between neighbours — reordering never rewrites a group.
function positionFor(rows, placeholder){
  const sibs = [...rows.querySelectorAll('.row, .drag-placeholder')]
    .filter(el => el === placeholder || (el.dataset.id && el.style.display !== 'none'));
  const i = sibs.indexOf(placeholder);
  const prevJob = i > 0 ? jobById(sibs[i-1].dataset.id) : null;
  const nextJob = i < sibs.length - 1 ? jobById(sibs[i+1].dataset.id) : null;
  const p = prevJob ? (prevJob.position ?? 0) : null;
  const n = nextJob ? (nextJob.position ?? 0) : null;
  if (p === null && n === null) return 1000;
  if (p === null) return n - 1000;
  if (n === null) return p + 1000;
  return (p + n) / 2;
}

async function persist(id, patch, onFail){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}`, {
      method:'PATCH',
      headers:{ ...SB_HEADERS, Prefer:'return=minimal' },
      body: JSON.stringify({ ...patch, updated_at:new Date().toISOString() })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  }catch(err){
    showToast('Could not save — change reverted.', true);
    onFail?.();
  }
}

// ── Add / edit ──
function openJobModal(id, presetStatus){
  editingId = id || null;
  const j = id ? jobById(id) : null;

  document.getElementById('f-status').innerHTML =
    GROUPS.map(g => `<option value="${g.key}">${esc(g.label)}</option>`).join('');

  document.getElementById('jobModalTitle').textContent = j ? 'Edit Job' : 'New Job';
  document.getElementById('f-job-no').value      = j?.job_no ?? '';
  document.getElementById('f-customer').value    = j?.customer ?? '';
  document.getElementById('f-address').value     = j?.address ?? '';
  document.getElementById('f-booked').value      = j?.booked_date ?? '';
  document.getElementById('f-oop').value         = j?.out_of_pocket ?? '';
  document.getElementById('f-deposit').value     = j?.deposit ?? '';
  document.getElementById('f-eco-notes').value   = j?.eco_comments ?? '';
  document.getElementById('f-notes').value       = j?.comments ?? '';
  document.getElementById('f-cancelled').checked = !!j?.cancelled;
  document.getElementById('f-status').value      = j?.status || presetStatus || 'to_book';
  document.getElementById('deleteJobBtn').style.display = j ? '' : 'none';

  updatePending();
  document.getElementById('jobScrim').classList.add('show');
  if (!j) setTimeout(() => document.getElementById('f-job-no').focus(), 60);
}
function closeJobModal(){
  document.getElementById('jobScrim').classList.remove('show');
  editingId = null;
}
// Pending updates as you type, so the sum is visible before saving.
function updatePending(){
  const oop = parseFloat(document.getElementById('f-oop').value) || 0;
  const dep = parseFloat(document.getElementById('f-deposit').value) || 0;
  const el = document.getElementById('f-pending');
  const bal = oop - dep;
  el.value = oop ? (bal > 0 ? money(bal) : (bal < 0 ? money(bal) + ' (overpaid)' : 'Paid in full')) : '—';
  el.style.color = bal > 0 && oop ? 'var(--blue-dark)' : (oop ? '#0b8b55' : 'var(--muted)');
}
document.getElementById('f-oop').addEventListener('input', updatePending);
document.getElementById('f-deposit').addEventListener('input', updatePending);

document.getElementById('jobScrim').addEventListener('click', e => {
  if (e.target.id === 'jobScrim') closeJobModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('jobScrim').classList.contains('show')) closeJobModal();
});

async function saveJob(){
  const customer = document.getElementById('f-customer').value.trim();
  if (!customer){ showToast('Customer name is required.', true); return; }

  const oopRaw = document.getElementById('f-oop').value;
  const depRaw = document.getElementById('f-deposit').value;
  const status = document.getElementById('f-status').value;
  const prevEcoComment = editingId ? (jobById(editingId)?.eco_comments || '') : '';
  const prevStatus = editingId ? jobById(editingId)?.status : null;
  const payload = {
    job_no:        document.getElementById('f-job-no').value.trim() || null,
    customer,
    address:       document.getElementById('f-address').value.trim() || null,
    booked_date:   document.getElementById('f-booked').value || null,
    out_of_pocket: oopRaw === '' ? null : parseFloat(oopRaw),
    deposit:       depRaw === '' ? null : parseFloat(depRaw),
    eco_comments:  document.getElementById('f-eco-notes').value.trim() || null,
    comments:      document.getElementById('f-notes').value.trim() || null,
    cancelled:     document.getElementById('f-cancelled').checked,
    status,
    updated_at:    new Date().toISOString(),
  };

  const btn = document.getElementById('saveJobBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    let res;
    if (editingId){
      res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(editingId)}`, {
        method:'PATCH', headers:{ ...SB_HEADERS, Prefer:'return=representation' },
        body: JSON.stringify(payload)
      });
    } else {
      // New rows land at the bottom of their group.
      const bottom = jobs.filter(j => j.status === status)
                         .reduce((m,j) => Math.max(m, j.position ?? 0), 0);
      res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
        method:'POST', headers:{ ...SB_HEADERS, Prefer:'return=representation' },
        body: JSON.stringify({ ...payload, position: bottom + 1000 })
      });
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    const saved = Array.isArray(rows) ? rows[0] : rows;
    if (saved){
      saved.status = normStatus(saved.status);
      const i = jobs.findIndex(j => String(j.id) === String(saved.id));
      if (i >= 0) jobs[i] = saved; else jobs.push(saved);
    }
    if (saved && payload.eco_comments && payload.eco_comments !== prevEcoComment){
      notifyEcoComment(payload, payload.eco_comments);
    }
    if (saved && editingId && prevStatus && status !== prevStatus){
      notifyStatusChange(payload, prevStatus, status);
    }
    closeJobModal();
    render();
    showToast(editingId ? 'Job updated.' : 'Job added.');
  }catch(err){
    showToast('Save failed. Check your connection and try again.', true);
  }finally{
    btn.disabled = false; btn.textContent = 'Save';
  }
}

async function deleteJob(){
  if (!editingId) return;
  const j = jobById(editingId);
  if (!confirm(`Delete the job for ${j?.customer || 'this customer'}? This cannot be undone.`)) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(editingId)}`, {
      method:'DELETE', headers: SB_HEADERS
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    jobs = jobs.filter(x => String(x.id) !== String(editingId));
    closeJobModal();
    render();
    showToast('Job deleted.');
  }catch(err){
    showToast('Delete failed.', true);
  }
}

// ── CSV export ──
function exportCSV(){
  const head = ['Job No.','Customer','Address','Booked Date','Out of Pocket',
                'Deposit','ECO','Group','Cancelled','Eco Comments','Goldsure Comments'];
  const labelOf = k => (GROUPS.find(g => g.key === k) || {}).label || k;
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = visibleJobs().slice()
    .sort((a,b) => GROUP_KEYS.indexOf(a.status) - GROUP_KEYS.indexOf(b.status)
                || byBookedDate(a,b))
    .map(j => [
      j.job_no, j.customer, j.address, j.booked_date, j.out_of_pocket, j.deposit,
      j.out_of_pocket ? pendingOf(j).toFixed(2) : '',
      labelOf(j.status), j.cancelled ? 'Yes' : '', j.eco_comments, j.comments
    ].map(q).join(','));

  const blob = new Blob([[head.map(q).join(','), ...rows].join('\r\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aircon-jobs-${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
