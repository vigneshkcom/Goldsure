name: Sync SMS inbox (safety net)

# Reliability safety net for inbound SMS.
#
# Inbound texts are normally delivered in real time by the SMS Gate phone app,
# which POSTs an sms:received webhook to /api/battery/request-callback. If that
# push is delayed or dropped (usually Android battery optimisation / Doze on the
# gateway phone), the message stays on the phone and never reaches the portal or
# the notification email.
#
# This cron periodically asks SMS Gate to re-fire the last 12 HOURS of received
# messages. Any that were missed get written to the database and emailed; any that
# already arrived are de-duplicated by their SMS Gate message id in the webhook
# handler, so no duplicate rows and no duplicate emails are produced.
#
# Why 12 hours and not 30 minutes: GitHub throttles scheduled workflows hard —
# measured runs of this "*/10" cron actually fire every 1–3 HOURS (20 Jul 2026:
# 00:11, 04:09, 07:28, 10:26 UTC). With a 30-minute window, any message received
# more than 30 min before a run fell through the net entirely and only surfaced
# when the phone flushed its own webhook queue, hours later. A 12-hour window
# costs nothing extra (everything re-fired is deduped) and guarantees every run
# recovers the full gap since the previous one, whatever GitHub's real cadence.
# The portal also self-syncs every 10 minutes while it's open (sms/index.html),
# which is the fast path during business hours. The primary fix remains
# disabling battery optimisation for the SMS Gate app on the gateway phone.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you trigger a recovery run by hand from the Actions tab

concurrency:
  group: sync-inbox
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Re-export recent inbound SMS from the gateway
        run: |
          URL='https://portal.goldsure.com.au/api/battery/request-callback'
          resp=$(curl -sS --max-time 30 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -d '{"action":"sync","minutes":720}') || { echo "curl failed"; exit 0; }
          echo "Sync response: $resp"
