name: Fire scheduled SMS

# Sends any past-due scheduled / bulk SMS even when nobody has the portal open.
# Vercel's Hobby plan only allows once-a-day crons, so this pings the public
# fire-scheduled endpoint every 5 minutes (GitHub's minimum cron interval).
# The endpoint claims each message (scheduled -> sending) before sending, so
# overlapping runs can never send a message twice.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

# Never let two runs overlap.
concurrency:
  group: fire-scheduled-sms
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Drain the scheduled SMS queue
        run: |
          URL='https://portal.goldsure.com.au/api/battery/request-callback?action=fire-scheduled'
          # Each call sends for up to ~8s then returns how many are still queued.
          # Loop so a backlog clears within this run; stop as soon as it's empty.
          for i in $(seq 1 10); do
            resp=$(curl -sS --max-time 60 "$URL") || { echo "curl failed (attempt $i)"; sleep 10; continue; }
            echo "Attempt $i: $resp"
            remaining=$(echo "$resp" | jq -r '.remaining // empty' 2>/dev/null || echo '')
            if [ -z "$remaining" ] || [ "$remaining" = "0" ]; then
              echo "Queue empty — done."
              exit 0
            fi
            # `remaining` counts everything still queued, including a campaign
            # staggered hours into the future. Looping on that alone kept this job
            # hammering the endpoint for ~3.5 of every 5 minutes for the whole life
            # of a campaign. `nextDueAt` says when the earliest one is actually due
            # — if that's still in the future there is nothing to drain right now.
            next_due=$(echo "$resp" | jq -r '.nextDueAt // empty' 2>/dev/null || echo '')
            if [ -n "$next_due" ]; then
              next_ts=$(date -u -d "$next_due" +%s 2>/dev/null || echo '')
              now_ts=$(date -u +%s)
              if [ -n "$next_ts" ] && [ "$next_ts" -gt "$now_ts" ]; then
                echo "Nothing due yet ($remaining queued, next at $next_due) — done."
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Still draining after 10 passes; the next scheduled run will continue."

      # GitHub throttles both of this repo's crons to ~hourly in practice, and they
      # fire at different times — so also syncing the inbox here roughly doubles how
      # often delayed inbound SMS get pulled in. Re-fired messages are de-duplicated
      # by sms_gate_id before insert/email, so overlap with sync-inbox.yml is free.
      - name: Pull inbound SMS from the gateway (inbox sync)
        if: always()   # replies matter even if the drain step errored
        run: |
          URL='https://portal.goldsure.com.au/api/battery/request-callback'
          resp=$(curl -sS --max-time 30 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -d '{"action":"sync","minutes":720}') || { echo "sync failed — next run will retry"; exit 0; }
          echo "Sync response: $resp"
