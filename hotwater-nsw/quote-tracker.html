<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSW Hot Water Quote Tracker · Goldsure</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/gs-favicon-96px.png">
<style>
:root{
  --navy:#292f4c; --blue:#0073ea; --blue-hover:#0060b9; --green:#00c875; --green-dark:#037f4c;
  --purple:#a25ddc; --yellow:#fdab3d; --red:#e2445c;
  --bg:#f6f7fb; --surface:#fff; --surface2:#fafbfc; --border:#e6e9ef;
  --text:#323338; --muted:#676879; --faint:#9699a6;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Roboto',Arial,sans-serif;background:var(--bg);color:var(--text);}

.topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.topbar-left{display:flex;align-items:center;gap:13px;}
.topbar img{height:24px;}
.topbar h1{font-size:16px;margin:0;font-weight:700;}
.topbar .sub{font-size:11.5px;color:rgba(255,255,255,.55);margin-top:2px;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.btn{border:none;border-radius:6px;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--blue);color:#fff;} .btn-primary:hover{background:var(--blue-hover);}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;} .btn-ghost:hover{background:rgba(255,255,255,.18);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.agent-chip{font-size:11.5px;color:rgba(255,255,255,.75);font-weight:600;}
.tracker-nav{display:inline-flex;gap:3px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px;}
.trk-link{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:5px 10px;border-radius:6px;color:rgba(255,255,255,.6);text-decoration:none;white-space:nowrap;}
.trk-link:hover{background:rgba(255,255,255,.12);color:#fff;}
.trk-link.is-active{background:var(--blue);color:#fff;}

.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 16px;}
.kpi .v{font-size:22px;font-weight:700;}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
.kpi .v.blue{color:var(--blue);} .kpi .v.green{color:var(--green-dark);} .kpi .v.red{color:var(--red);}

.filters{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.filters .lbl{font-size:12px;color:var(--muted);font-weight:600;}
.filters input,.filters select{border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12.5px;font-family:inherit;color:var(--text);background:#fff;}
.filters input{min-width:230px;flex:1;}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,115,234,.12);}

.table-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.table-bar{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.table-title{font-size:13px;font-weight:700;}
.del-btn{background:var(--red);color:#fff;border:none;border-radius:6px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.del-btn:disabled{opacity:.4;cursor:not-allowed;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:900px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;}
tbody td{padding:11px 12px;font-size:12.5px;border-bottom:1px solid #f1f2f6;vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbff;}
.td-name{font-weight:600;}
.td-sub{font-size:11px;color:var(--faint);margin-top:1px;}
.td-total{font-weight:700;white-space:nowrap;}
.model-badge{display:inline-block;background:#eef0f4;color:var(--navy);border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600;white-space:nowrap;}
.agent-badge{display:inline-block;background:#f2f8ff;color:var(--blue);border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600;}

.badge{display:inline-block;padding:3px 10px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;text-transform:capitalize;}
.badge-sent{background:var(--yellow);} .badge-accepted{background:var(--green);}
.badge-rejected{background:var(--red);} .badge-installed{background:var(--green-dark);}
.status-btn{cursor:pointer;border:none;background:none;padding:0;font:inherit;position:relative;}
.status-menu{display:none;position:absolute;top:100%;left:0;margin-top:5px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 30px rgba(16,24,40,.18);z-index:60;min-width:150px;overflow:hidden;}
.status-menu.open{display:block;}
.status-menu-item{padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;text-align:left;}
.status-menu-item:hover{background:var(--surface2);}
.status-menu-item.active{color:var(--blue);font-weight:600;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.dot-sent{background:var(--yellow);} .dot-accepted{background:var(--green);}
.dot-rejected{background:var(--red);} .dot-installed{background:var(--green-dark);}

.link-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.link-btn:hover{border-color:var(--blue);color:var(--blue);}

.empty{padding:44px 20px;text-align:center;color:var(--faint);}
.empty .ic{font-size:30px;margin-bottom:8px;}
.empty h3{font-size:15px;color:var(--text);margin:0 0 5px;}
.empty p{font-size:12.5px;margin:0;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:8px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:700px){ .filters input{min-width:auto;width:100%;} }
</style>
<link rel="stylesheet" href="/assets/internal-systems-sidebar.css">
<script src="/assets/internal-systems-sidebar.js" defer></script>
</head>
<body data-internal-sidebar-mode="hover">

<div class="topbar">
  <div class="topbar-left">
    <img src="/assets/goldsure-inverted-logo.jpg" alt="Goldsure">
    <div>
      <h1>NSW Hot Water Quote Tracker</h1>
      <div class="sub">Every quote sent from the NSW builder</div>
    </div>
    <nav class="tracker-nav">
      <a href="/hotwater/quote-tracker.html" class="trk-link">HWS</a>
      <a href="/hotwater-nsw/quote-tracker.html" class="trk-link is-active">NSW HWS</a>
      <a href="/aircons/quote-tracker.html" class="trk-link">Aircon</a>
      <a href="/smoke-alarms/quote-tracker.html" class="trk-link">Smoke Alarm</a>
    </nav>
  </div>
  <div class="topbar-actions">
    <span class="agent-chip" id="agentChip"></span>
    <button class="btn btn-ghost" onclick="loadQuotes()">↻ Refresh</button>
    <a class="btn btn-primary" href="/hotwater-nsw/quote-builder.html">+ New Quote</a>
  </div>
</div>

<div class="wrap">

  <div class="kpis">
    <div class="kpi"><div class="v" id="kTotal">—</div><div class="l">Quotes Sent</div></div>
    <div class="kpi"><div class="v green" id="kAccepted">—</div><div class="l">Accepted</div></div>
    <div class="kpi"><div class="v red" id="kRejected">—</div><div class="l">Rejected</div></div>
    <div class="kpi"><div class="v blue" id="kValue">—</div><div class="l">Total Value Sent</div></div>
  </div>

  <div class="filters">
    <span class="lbl">Filter</span>
    <input type="search" id="fSearch" placeholder="Search name, email, phone, address…" oninput="applyFilters()">
    <select id="fModel" onchange="applyFilters()"><option value="">All Models</option></select>
    <select id="fAgent" onchange="applyFilters()"><option value="">All Agents</option></select>
    <select id="fStatus" onchange="applyFilters()">
      <option value="">All Statuses</option><option value="sent">Sent</option>
      <option value="accepted">Accepted</option><option value="rejected">Rejected</option>
      <option value="installed">Installed</option>
    </select>
    <select id="fPeriod" onchange="applyFilters()">
      <option value="">All Time</option><option value="today">Today</option>
      <option value="week">Last 7 Days</option><option value="month">Last 30 Days</option>
    </select>
  </div>

  <div class="table-card">
    <div class="table-bar">
      <span class="table-title">NSW Hot Water Quotes (<span id="count">0</span>)</span>
      <button class="del-btn" id="deleteBtn" onclick="deleteSelected()" disabled>Delete Selected</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:34px;"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
            <th>Sent</th><th>Customer</th><th>Agent</th><th>Model</th>
            <th>Grand Total</th><th>Finance</th><th>Status</th><th>Quote</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="9"><div class="empty">Loading…</div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://yxgdixwneprhjxzdlaqw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_94nQfItNfgNZZc2P1Slb1Q_ECjCmu47';
const HEADERS = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
const MODEL_LABEL = {
  'ECON-300SV-4.2E':  'ECON-300SV-4.2E — 290L Split System',
  'EG-330FRE-WR':     'EG-330FRE-WR — 330L Split System',
  'ECON-300RVW':      'ECON-300RVW — 290L All-in-One',
  'ECON-300RVW-2.0E': 'ECON-300RVW-2.0E — 290L All-in-One',
};
const STATUSES = ['sent','accepted','rejected','installed'];

let allQuotes = [], filtered = [];

// On a phone, a tracker opened from the builder (which passes ?agent=) shows only
// that agent's quotes. Desktop always shows everyone. Same rule as the VIC tracker.
const IS_MOBILE = window.matchMedia('(max-width: 760px)').matches;
const SCOPE_AGENT = (new URLSearchParams(location.search).get('agent') || localStorage.getItem('nswhw_agent') || '').trim();
const MOBILE_SCOPED = IS_MOBILE && !!SCOPE_AGENT;

const money = n => '$' + (Number(n)||0).toLocaleString('en-AU',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

async function loadQuotes(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/nsw_hws_quotes?select=*&order=sent_at.desc&limit=1000`, { headers: HEADERS });
    if(!res.ok){ showEmpty('Could not load quotes.'); return; }
    allQuotes = await res.json();
    if(MOBILE_SCOPED){
      allQuotes = allQuotes.filter(q => (q.agent_name||'').toLowerCase() === SCOPE_AGENT.toLowerCase());
      document.getElementById('fAgent').style.display = 'none';
      document.getElementById('agentChip').textContent = SCOPE_AGENT;
    }
    populateFilters();
    renderKPIs();
    applyFilters();
  }catch(e){ console.error(e); showEmpty('Network error loading quotes.'); }
}

function populateFilters(){
  const agents=[...new Set(allQuotes.map(q=>q.agent_name).filter(Boolean))].sort();
  const models=[...new Set(allQuotes.map(q=>q.heat_pump_model).filter(Boolean))].sort();
  const a=document.getElementById('fAgent'), ac=a.value;
  a.innerHTML='<option value="">All Agents</option>'+agents.map(x=>`<option>${esc(x)}</option>`).join(''); a.value=ac;
  const m=document.getElementById('fModel'), mc=m.value;
  m.innerHTML='<option value="">All Models</option>'+models.map(x=>`<option value="${esc(x)}">${esc(MODEL_LABEL[x]||x)}</option>`).join(''); m.value=mc;
}

function renderKPIs(){
  const acc = allQuotes.filter(q=>['accepted','installed'].includes((q.status||'').toLowerCase())).length;
  const rej = allQuotes.filter(q=>(q.status||'').toLowerCase()==='rejected').length;
  const val = allQuotes.reduce((s,q)=>s+(Number(q.final_price)||0),0);
  document.getElementById('kTotal').textContent = allQuotes.length;
  document.getElementById('kAccepted').textContent = acc;
  document.getElementById('kRejected').textContent = rej;
  document.getElementById('kValue').textContent = money(val);
}

function applyFilters(){
  const s=document.getElementById('fSearch').value.trim().toLowerCase();
  const model=document.getElementById('fModel').value;
  const agent=document.getElementById('fAgent').value.toLowerCase();
  const status=document.getElementById('fStatus').value.toLowerCase();
  const period=document.getElementById('fPeriod').value;
  const now=new Date();
  filtered = allQuotes.filter(q=>{
    if(s && ![q.customer_name,q.customer_email,q.customer_phone,q.property_address]
      .some(v=>String(v||'').toLowerCase().includes(s))) return false;
    if(model && q.heat_pump_model!==model) return false;
    if(agent && (q.agent_name||'').toLowerCase()!==agent) return false;
    if(status && (q.status||'sent').toLowerCase()!==status) return false;
    if(period && q.sent_at){
      const d=new Date(q.sent_at), days=(now-d)/86400000;
      if(period==='today' && d.toDateString()!==now.toDateString()) return false;
      if(period==='week' && days>7) return false;
      if(period==='month' && days>30) return false;
    }
    return true;
  });
  renderTable();
}

function renderTable(){
  const tbody=document.getElementById('tbody');
  document.getElementById('count').textContent = filtered.length;
  if(!filtered.length){
    tbody.innerHTML=`<tr><td colspan="9"><div class="empty"><div class="ic">📭</div><h3>No quotes found</h3><p>Send your first NSW quote from the Quote Builder.</p></div></td></tr>`;
    updateDeleteBtn(); return;
  }
  tbody.innerHTML = filtered.map(q=>{
    const st=(q.status||'sent').toLowerCase();
    const date=q.sent_at?new Date(q.sent_at).toLocaleString('en-AU',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
    const menu=STATUSES.map(x=>`<div class="status-menu-item${x===st?' active':''}" onclick="updateStatus(event,'${q.id}','${x}')"><span class="dot dot-${x}"></span>${x.charAt(0).toUpperCase()+x.slice(1)}</div>`).join('');
    return `<tr>
      <td><input type="checkbox" class="row-check" value="${q.id}" onchange="updateDeleteBtn()"></td>
      <td style="white-space:nowrap;color:var(--muted);">${date}</td>
      <td><div class="td-name">${esc(q.customer_name)||'—'}</div>
          ${q.customer_phone?`<div class="td-sub">${esc(q.customer_phone)}</div>`:''}
          ${q.customer_email?`<div class="td-sub">${esc(q.customer_email)}</div>`:''}
          ${q.property_address?`<div class="td-sub">${esc(q.property_address)}</div>`:''}</td>
      <td>${q.agent_name?`<span class="agent-badge">${esc(q.agent_name)}</span>`:'—'}</td>
      <td>${q.heat_pump_model?`<span class="model-badge">${esc(MODEL_LABEL[q.heat_pump_model]||q.heat_pump_model)}</span>`:'—'}</td>
      <td class="td-total">${money(q.final_price)}</td>
      <td style="color:var(--muted);white-space:nowrap;">${q.finance_requested?`${money(q.fortnightly_repayment)}/ftn · ${q.finance_term_years}yr`:'—'}</td>
      <td><button class="status-btn" onclick="toggleMenu(event,this)"><span class="badge badge-${st}">${st}</span><div class="status-menu">${menu}</div></button></td>
      <td><a class="link-btn" href="/hotwater-nsw/quote.html?token=${encodeURIComponent(q.quote_token)}" target="_blank">View</a></td>
    </tr>`;
  }).join('');
  updateDeleteBtn();
}

function toggleMenu(e,btn){
  e.stopPropagation();
  const m=btn.querySelector('.status-menu'), open=m.classList.contains('open');
  document.querySelectorAll('.status-menu.open').forEach(x=>x.classList.remove('open'));
  if(!open) m.classList.add('open');
}
document.addEventListener('click',()=>document.querySelectorAll('.status-menu.open').forEach(m=>m.classList.remove('open')));

async function updateStatus(e,id,newStatus){
  e.stopPropagation();
  document.querySelectorAll('.status-menu.open').forEach(m=>m.classList.remove('open'));
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/nsw_hws_quotes?id=eq.${id}`,{
      method:'PATCH',
      headers:{...HEADERS,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({status:newStatus,accepted:['accepted','installed'].includes(newStatus),updated_at:new Date().toISOString()}),
    });
    if(!res.ok){ showToast('Update failed: '+(await res.text()).slice(0,80)); return; }
    const q=allQuotes.find(x=>String(x.id)===String(id));
    if(q){ q.status=newStatus; q.accepted=['accepted','installed'].includes(newStatus); }
    renderKPIs(); applyFilters();
    showToast(`Status → ${newStatus.charAt(0).toUpperCase()+newStatus.slice(1)}`);
  }catch(err){ console.error(err); showToast('Network error updating status.'); }
}

// ── Select + delete (password protected, same action the VIC tracker uses) ──
const selectedIds = () => [...document.querySelectorAll('.row-check:checked')].map(c=>c.value);
function updateDeleteBtn(){
  const n=selectedIds().length, btn=document.getElementById('deleteBtn');
  btn.disabled=n===0; btn.textContent=n?`Delete Selected (${n})`:'Delete Selected';
  const sa=document.getElementById('selectAll'), all=document.querySelectorAll('.row-check');
  if(sa){ sa.checked=all.length>0&&n===all.length; sa.indeterminate=n>0&&n<all.length; }
}
function toggleSelectAll(cb){ document.querySelectorAll('.row-check').forEach(c=>c.checked=cb.checked); updateDeleteBtn(); }
async function deleteSelected(){
  const ids=selectedIds();
  if(!ids.length){ showToast('No quotes selected.'); return; }
  const pw=prompt(`Enter the delete password to permanently remove ${ids.length} quote(s):`);
  if(pw===null) return;
  try{
    const res=await fetch('/api/battery/request-callback',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'delete-quotes',table:'nsw_hws_quotes',ids,pin:pw}),
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok){ showToast(data.error||'Delete failed.'); return; }
    if(!data.deleted){ showToast('Nothing was deleted.'); return; }
    allQuotes=allQuotes.filter(q=>!ids.includes(String(q.id)));
    renderKPIs(); applyFilters();
    showToast(`Deleted ${data.deleted} quote(s).`);
  }catch(e){ console.error(e); showToast('Network error deleting quotes.'); }
}

function showEmpty(msg){
  document.getElementById('tbody').innerHTML=`<tr><td colspan="9"><div class="empty"><div class="ic">🔌</div><h3>No Data</h3><p>${esc(msg)}</p></div></td></tr>`;
}

window.addEventListener('DOMContentLoaded', loadQuotes);
</script>
</body>
</html>
