<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dataforce to GHL Preview | Goldsure</title>
  <style>
    :root{--ink:#172033;--muted:#687187;--line:#e1e5ed;--bg:#f5f7fb;--card:#fff;--brand:#1769aa;--ok:#138a52;--warn:#b56d00;--bad:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,sans-serif}
    main{max-width:1440px;margin:auto;padding:28px}.head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:20px}
    h1{margin:0 0 6px;font-size:26px}.sub{margin:0;color:var(--muted)}.badge{background:#e8f3fb;color:#0a5d97;border-radius:999px;padding:7px 12px;font-weight:700;white-space:nowrap}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(26,40,67,.05)}
    .controls{display:grid;grid-template-columns:minmax(160px,1fr) 160px 160px auto;gap:12px;align-items:end}
    label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}input{width:100%;height:42px;border:1px solid #cfd5e1;border-radius:8px;padding:0 11px;font:inherit;color:var(--ink)}
    button{height:42px;border:0;border-radius:8px;padding:0 18px;background:var(--brand);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .notice{margin-top:12px;padding:11px 13px;background:#fff8e7;border:1px solid #f0d892;border-radius:8px;color:#6f5000}.error{display:none;margin-top:12px;padding:11px 13px;background:#fff0ef;border:1px solid #f3b8b3;border-radius:8px;color:var(--bad)}
    .summary{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px;margin:18px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
    .meta{display:none;margin:12px 0;color:var(--muted)}.table-wrap{display:none;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
    table{width:100%;min-width:1120px;border-collapse:collapse}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{position:sticky;top:0;background:#f8f9fc;color:#505a70;font-size:12px;z-index:1}tr:last-child td{border-bottom:0}
    .name{font-weight:700}.small{font-size:12px;color:var(--muted);margin-top:3px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#eef1f6;color:#586176}.pill.ok{background:#e8f7ef;color:var(--ok)}.pill.warn{background:#fff3d7;color:var(--warn)}.pill.bad{background:#ffedeb;color:var(--bad)}
    .changes{margin:0;padding-left:17px}.changes li+li{margin-top:3px}a{color:var(--brand);font-weight:700;text-decoration:none}.empty{color:var(--muted)}
    @media(max-width:820px){main{padding:16px}.head{align-items:flex-start}.controls{grid-template-columns:1fr 1fr}.pin{grid-column:1/-1}.controls button{grid-column:1/-1}.summary{grid-template-columns:repeat(2,1fr)}.table-wrap{overflow:visible;border:0;background:transparent}table,tbody,tr,td{display:block;min-width:0}thead{display:none}tr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:5px 12px}td{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}td:before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}td:last-child{border-bottom:0}.changes{padding-left:16px}}
  </style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>Dataforce to GHL Preview</h1><p class="sub">Review exact customer matches and proposed GHL changes.</p></div>
    <span class="badge">Read only</span>
  </div>
  <section class="panel">
    <div class="controls">
      <div class="pin"><label for="pin">Access PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter PIN"></div>
      <div><label for="start">From</label><input id="start" type="date"></div>
      <div><label for="end">To</label><input id="end" type="date"></div>
      <button id="preview" type="button">Generate preview</button>
    </div>
    <div class="notice">This screen does not change Dataforce or GHL. It only shows what the sync would do.</div>
    <div class="error" id="error"></div>
  </section>
  <section class="summary" id="summary"></section>
  <div class="meta" id="meta"></div>
  <div class="table-wrap" id="tableWrap">
    <table>
      <thead><tr><th>Customer</th><th>Dataforce job</th><th>Match</th><th>GHL now</th><th>Proposed changes</th><th>Revenue</th><th>GHL</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
  const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const localDate=date=>{const d=new Date(date);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
  const today=new Date();const ago=new Date(today);ago.setDate(ago.getDate()-6);$('start').value=localDate(ago);$('end').value=localDate(today);
  const money=value=>value===null||value===undefined?'Not available':new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(value);
  function matchPill(row){if(row.matchStatus==='matched')return '<span class="pill ok">Matched</span>';if(row.matchStatus==='conflict')return '<span class="pill bad">Conflict</span>';return '<span class="pill warn">No match</span>'}
  function render(data){const s=data.summary||{};const stats=[['Jobs',s.jobs],['Completed',s.completedJobs],['Matched',s.matched],['Proposed updates',s.proposedUpdates],['Conflicts',s.conflicts],['No match',s.unmatched]];$('summary').innerHTML=stats.map(([label,value])=>`<div class="stat"><b>${esc(value||0)}</b><span>${esc(label)}</span></div>`).join('');
    $('meta').style.display='block';$('meta').textContent=`Preview generated ${new Date(data.generatedAt).toLocaleString('en-AU')}. ${data.jobIdField?'GHL Dataforce Job ID field found.':'GHL Dataforce Job ID field is not set up yet.'}`;
    $('rows').innerHTML=(data.rows||[]).map(row=>{const changes=row.proposedChanges?.length?`<ul class="changes">${row.proposedChanges.map(change=>`<li>${esc(change)}</li>`).join('')}</ul>`:`<span class="empty">${esc(row.issue||'No change')}</span>`;const revenue=row.completed?`Current: ${money(row.currentRevenue)}<br>Proposed: ${money(row.proposedRevenue)}${row.revenue?.source?`<div class="small">From ${esc(row.revenue.source)}</div>`:''}`:'<span class="empty">Not completed</span>';return `<tr>
      <td data-label="Customer"><div class="name">${esc(row.customerName)}</div><div class="small">${esc(row.email||'No email')}<br>${esc(row.phone||'No phone')}</div></td>
      <td data-label="Dataforce job"><b>#${esc(row.jobId)}</b><div class="small">Appointment #${esc(row.appointmentId||'')}<br>${esc(row.workType||'Unknown work type')}<br>${esc(row.dataforceStatus||'No status')}</div></td>
      <td data-label="Match">${matchPill(row)}<div class="small">${esc((row.matchedBy||[]).join(' + '))}</div></td>
      <td data-label="GHL now">${row.pipeline?`<b>${esc(row.pipeline)}</b><div class="small">${esc(row.currentStage||'No stage')} · ${esc(row.currentStatus||'')}</div>`:`<span class="empty">${esc(row.issue||'No opportunity')}</span>`}</td>
      <td data-label="Proposed">${changes}</td><td data-label="Revenue">${revenue}</td>
      <td data-label="GHL">${row.ghlLink?`<a href="${esc(row.ghlLink)}" target="_blank" rel="noopener">Open contact</a>`:'<span class="empty">Unavailable</span>'}</td></tr>`}).join('')||'<tr><td colspan="7">No Dataforce jobs were found in this date range.</td></tr>';
    $('tableWrap').style.display='block'}
  $('preview').addEventListener('click',async()=>{const button=$('preview');const error=$('error');error.style.display='none';button.disabled=true;button.textContent='Loading Dataforce and GHL...';try{const response=await fetch('/api/smoke-alarms/google-key',{method:'POST',headers:{'Content-Type':'application/json','x-dataforce-ghl-pin':$('pin').value},body:JSON.stringify({action:'dataforce-ghl-preview',startDate:$('start').value,endDate:$('end').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Preview failed (${response.status})`);render(data)}catch(err){error.textContent=err.message||'Preview failed.';error.style.display='block'}finally{button.disabled=false;button.textContent='Generate preview'}});
</script>
</body>
</html>
