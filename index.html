<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Goldsure Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body, button, a, h1, h2, p {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="max-w-xl w-full bg-white rounded-lg shadow-lg p-8 text-center" style="background:#f1f4f7">

    <!-- Logo -->
    <img 
      src="assets/goldsure-logo.jpg" 
      alt="Goldsure Logo" 
      class="h-16 mx-auto mb-6"
    >

    <!-- Heading -->
    <h1 class="text-2xl font-bold mb-2">Goldsure Tools</h1>
    <p class="text-gray-600 mb-8">
      Internal calculators and customer estimation tools
    </p>

    <!-- Smoke Alarms Section -->
    <div class="mb-4">
      <button 
        onclick="toggleSmokeAlarms()"
        class="w-full py-4 rounded-md font-semibold text-lg flex items-center justify-between px-6"
        style="background:#000;color:#B08D2E;">
        <span>Smoke Alarms</span>
        <span id="smokeArrow">▾</span>
      </button>

      <!-- Sub Options -->
      <div id="smokeOptions" class="hidden mt-3 space-y-3">
        <a href="smoke-alarm.html"
           class="block w-full py-3 rounded-md font-medium"
           style="background:#1f2937;color:#B08D2E;">
          Smoke Alarm Calculator
        </a>

        <a href="smoke-alarm-troubleshooting.html"
           class="block w-full py-3 rounded-md font-medium"
           style="background:#1f2937;color:#B08D2E;">
          Smoke Alarm Troubleshooting
        </a>
      </div>
    </div>

    <!-- Other Tools -->
    <a href="battery-roi.html"
       class="block w-full py-4 rounded-md font-semibold text-lg"
       style="background:#000;color:#B08D2E;">
      Battery ROI Calculator
    </a>

    <!-- Footer -->
    <p class="text-xs text-gray-500 mt-8">
      © Goldsure Pty Ltd · Internal use
    </p>

  </div>

  <!-- Toggle Script -->
  <script>
    function toggleSmokeAlarms() {
      const options = document.getElementById("smokeOptions");
      const arrow = document.getElementById("smokeArrow");

      options.classList.toggle("hidden");
      arrow.textContent = options.classList.contains("hidden") ? "▾" : "▴";
    }
  </script>

</body>
</html>
