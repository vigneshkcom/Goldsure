<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accept Your Quote – Goldsure</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sora', sans-serif;
  background: #000000;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
.logo-wrap { text-align: center; margin-bottom: 28px; }
.logo-wrap img { height: auto; width: 160px; max-width: 80%; }

.card {
  background: #ffffff;
  border-radius: 20px;
  border-top: 3px solid #b08d2e;
  padding: 36px 40px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

#expiredState { display: none; text-align: center; padding: 12px 0; }
.expired-icon { font-size: 44px; margin-bottom: 16px; }
.expired-title { font-size: 20px; font-weight: 700; color: #141c2e; margin-bottom: 8px; }
.expired-msg { font-size: 13px; color: #6b7899; line-height: 1.8; }

#formState { display: none; }
.card-title { font-size: 22px; font-weight: 700; color: #141c2e; margin-bottom: 4px; }
.card-sub { font-size: 13px; color: #6b7899; margin-bottom: 24px; line-height: 1.5; }

.summary-box {
  background: #f5f6f8; border-radius: 10px;
  padding: 16px 18px; margin-bottom: 22px;
}
.summary-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: #9aa5b8; margin-bottom: 12px;
}
.summary-row {
  display: flex; justify-content: space-between;
  padding: 7px 0; border-bottom: 1px solid #e3e7ef; font-size: 13px;
}
.summary-row:last-child { border-bottom: none; padding-top: 10px; }
.summary-row span:first-child { color: #6b7899; }
.summary-row span:last-child { font-family: 'JetBrains Mono', monospace; color: #141c2e; font-weight: 600; }
.summary-total span:first-child { font-weight: 700; color: #141c2e; }
.summary-total span:last-child { font-weight: 700; color: #b08d2e; font-size: 15px; }

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px; color: #6b7899; margin-bottom: 6px;
}
.field input {
  width: 100%; font-family: 'Sora', sans-serif; font-size: 13px;
  padding: 10px 14px; border-radius: 9px; border: 1.5px solid #e3e7ef;
  background: #f5f6f8; color: #141c2e; outline: none;
}
.field input:focus { border-color: #b08d2e; background: #fff; }

.submit-btn {
  width: 100%; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700;
  padding: 14px; border-radius: 50px; border: none; cursor: pointer;
  background: #b08d2e; color: #000000; text-transform: uppercase; letter-spacing: 1.5px;
}
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

#thankYouState { display: none; text-align: center; padding: 12px 0; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #141c2e; color: #fff; font-size: 12px; font-weight: 600;
  padding: 10px 22px; border-radius: 30px; border-left: 3px solid #b08d2e;
  opacity: 0; transition: opacity 0.25s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>

<body>

<div class="logo-wrap">
  <img src="https://assets.cdn.filesafe.space/11epCbQAg9B4rQt5yHjw/media/699a73ab3a2afd85cbdb392f.jpg" alt="Goldsure">
</div>

<div class="card">

<div id="expiredState">
  <div class="expired-icon">⏰</div>
  <div class="expired-title">This Quote Has Expired</div>
</div>

<div id="formState">
  <div class="card-title">Accept Your Quote</div>
  <div class="card-sub">Please confirm your details and we'll be in touch to lock in your booking.</div>

  <div class="field">
    <label>Your Name</label>
    <input type="text" id="fName" readonly>
  </div>

  <div class="field">
    <label>Your Email</label>
    <input type="email" id="fEmail" readonly>
  </div>

  <div class="field">
    <label>Your Phone Number *</label>
    <input type="tel" id="fPhone" placeholder="e.g. 0412 345 678">
  </div>

  <div class="field">
    <label>Property Address *</label>
    <input type="text" id="fAddress" placeholder="Start typing your address..." autocomplete="off">
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitAccept()">Confirm & Accept Quote</button>
</div>

<div id="thankYouState">
  <h2>Quote Accepted!</h2>
</div>

</div>

<div class="toast" id="toast"></div>

<!-- GOOGLE API -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC_naSoCXktG1v18VS08tH4mIb0OtGLl34&libraries=places"></script>

<script>
var _params = {};
var selectedQLDAddress = false;

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}

function initAutocomplete() {
  var input = document.getElementById('fAddress');

  var autocomplete = new google.maps.places.Autocomplete(input, {
    componentRestrictions: { country: "au" },
    fields: ["formatted_address", "address_components", "geometry"],
    types: ["address"]
  });

  autocomplete.addListener("place_changed", function () {
    var place = autocomplete.getPlace();
    selectedQLDAddress = false;

    if (!place.geometry) {
      showToast("Please select a valid address from the list.");
      input.value = "";
      return;
    }

    var state = "";

    place.address_components.forEach(function(component) {
      if (component.types.includes("administrative_area_level_1")) {
        state = component.short_name;
      }
    });

    if (state !== "QLD") {
      showToast("We currently service Queensland properties only.");
      input.value = "";
      return;
    }

    selectedQLDAddress = true;
    input.value = place.formatted_address;
  });
}

function init() {
  var p = new URLSearchParams(window.location.search);

  if (p.get('accept') !== 'true') {
    document.getElementById('expiredState').style.display = 'block';
    return;
  }

  document.getElementById('fName').value  = p.get('name')  || '';
  document.getElementById('fEmail').value = p.get('email') || '';

  document.getElementById('formState').style.display = 'block';

  initAutocomplete();
}

async function submitAccept() {
  var phone   = document.getElementById('fPhone').value.trim();
  var address = document.getElementById('fAddress').value.trim();

  if (!phone) {
    showToast('Please enter your phone number.');
    return;
  }

  if (!address || !selectedQLDAddress) {
    showToast('Please select a valid Queensland address from the dropdown.');
    return;
  }

  document.getElementById('formState').style.display     = 'none';
  document.getElementById('thankYouState').style.display = 'block';
}

init();
</script>

</body>
</html>
