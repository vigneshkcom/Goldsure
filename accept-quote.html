<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accept Your Quote – Goldsure</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', sans-serif;
  background: #000;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.logo-wrap { text-align: center; margin-bottom: 28px; }
.logo-wrap img { width: 160px; max-width: 80%; }

.card {
  background: #fff;
  border-radius: 20px;
  border-top: 3px solid #b08d2e;
  padding: 36px 40px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

#expiredState,
#thankYouState { display: none; text-align: center; }

.card-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #141c2e;
}

.card-sub {
  font-size: 13px;
  color: #6b7899;
  margin-bottom: 24px;
}

.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #6b7899;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 9px;
  border: 1.5px solid #e3e7ef;
  background: #f5f6f8;
  font-size: 13px;
}

.field input:focus {
  border-color: #b08d2e;
  background: #fff;
}

.submit-btn {
  width: 100%;
  padding: 14px;
  border-radius: 50px;
  border: none;
  background: #b08d2e;
  font-weight: 700;
  text-transform: uppercase;
  cursor: pointer;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #141c2e;
  color: #fff;
  padding: 10px 22px;
  border-radius: 30px;
  opacity: 0;
  transition: 0.25s;
}

.toast.show { opacity: 1; }

.footer-note {
  margin-top: 20px;
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
}
</style>
</head>

<body>

<div class="logo-wrap">
  <img src="https://assets.cdn.filesafe.space/11epCbQAg9B4rQt5yHjw/media/699a73ab3a2afd85cbdb392f.jpg" alt="Goldsure">
</div>

<div class="card">

<div id="expiredState">
  <h3>This Quote Has Expired</h3>
</div>

<div id="formState" style="display:none;">
  <div class="card-title">Accept Your Quote</div>
  <div class="card-sub">Confirm your details below.</div>

  <div class="field">
    <label>Your Name</label>
    <input type="text" id="fName" readonly>
  </div>

  <div class="field">
    <label>Your Email</label>
    <input type="email" id="fEmail" readonly>
  </div>

  <div class="field">
    <label>Your Phone *</label>
    <input type="tel" id="fPhone" placeholder="e.g. 0412 345 678">
  </div>

  <div class="field">
    <label>Property Address *</label>
    <input type="text" id="fAddress" placeholder="Start typing your address..." autocomplete="off">
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitAccept()">Confirm & Accept Quote</button>
</div>

<div id="thankYouState">
  <h2>Quote Accepted!</h2>
  <p>Our team will contact you shortly.</p>
</div>

</div>

<div class="footer-note">
  Goldsure Pty Ltd · Queensland, Australia
</div>

<div class="toast" id="toast"></div>

<script>
var _params = {};
var selectedQLDAddress = false;

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function initAutocomplete() {
  const input = document.getElementById('fAddress');

  const autocomplete = new google.maps.places.Autocomplete(input, {
    componentRestrictions: { country: "au" },
    fields: ["formatted_address", "address_components", "geometry"],
    types: ["address"]
  });

  autocomplete.addListener("place_changed", function () {
    const place = autocomplete.getPlace();
    selectedQLDAddress = false;

    if (!place.geometry) {
      showToast("Please select a valid address.");
      input.value = "";
      return;
    }

    let state = "";

    place.address_components.forEach(c => {
      if (c.types.includes("administrative_area_level_1")) {
        state = c.short_name;
      }
    });

    if (state !== "QLD") {
      showToast("We service Queensland only.");
      input.value = "";
      return;
    }

    selectedQLDAddress = true;
    input.value = place.formatted_address;
  });
}

async function loadGoogleMaps() {
  const res = await fetch('/api/smoke-alarms/google-key');
  const data = await res.json();

  const script = document.createElement("script");
  script.src = "https://maps.googleapis.com/maps/api/js?key=" + data.key + "&libraries=places";
  script.async = true;

  script.onload = function () {
    initAutocomplete();
  };

  document.head.appendChild(script);
}

function init() {
  const p = new URLSearchParams(window.location.search);

  if (p.get('accept') !== 'true') {
    document.getElementById('expiredState').style.display = 'block';
    return;
  }

  document.getElementById('fName').value = p.get('name') || '';
  document.getElementById('fEmail').value = p.get('email') || '';

  document.getElementById('formState').style.display = 'block';

  loadGoogleMaps();
}

async function submitAccept() {
  const phone = document.getElementById('fPhone').value.trim();
  const address = document.getElementById('fAddress').value.trim();

  if (!phone) return showToast("Enter phone number.");
  if (!address || !selectedQLDAddress)
    return showToast("Select a valid QLD address from dropdown.");

  document.getElementById('formState').style.display = 'none';
  document.getElementById('thankYouState').style.display = 'block';
}

init();
</script>

</body>
</html>
