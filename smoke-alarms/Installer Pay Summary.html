<html lang="en">
<head>

<body>

<!-- KEEP YOUR ORIGINAL HTML STRUCTURE EXACTLY AS IS ABOVE MAIN -->

<!-- ADD THIS RIGHT BEFORE YOUR PIVOT TABLE CARD -->

<div id="installerBreakdown" class="card no-print" style="display:none;">
  <div class="card-header">
    <div class="card-title">Installer Breakdown Summary</div>
  </div>
  <div class="table-wrap">
    <div id="installerBreakdownTable"></div>
  </div>
</div>

<!-- KEEP YOUR ORIGINAL PIVOT TABLE CARD HERE -->

<script>

/* ===== ORIGINAL PAY LOGIC (UNCHANGED) ===== */

const SHOW_CODES = ['[3429]','[3430]','[3431]','[3434]','[3437]'];
const HIDE_CODES = ['[3439]','[3440]'];

const PAY_MAP = {
  '[3429]': 30,
  '[3430]': 10,
  '[3431]': 10,
  '[3434]': 10,
  '[3437]': 60,
  '[3439]': 0,
  '[3440]': 0,
};

const DEFAULT_PAY = 10;
const GST = 0.10;

function codeOf(name) {
  const m = (name||'').match(/^(\[\d+\])/);
  return m ? m[1] : null;
}
function payRate(name) {
  const c = codeOf(name);
  return (c && PAY_MAP.hasOwnProperty(c)) ? PAY_MAP[c] : DEFAULT_PAY;
}

/* ===== STATE ===== */

let allRows = [], fileDateFrom = '', fileDateTo = '';

/* ===== LOAD DASHBOARD ===== */

function loadDashboard() {

  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  const workers = [...new Set(allRows.map(r => r['Fieldworker']).filter(Boolean))].sort();

  const select = document.getElementById('workerSelect');

  select.innerHTML =
    `<option value="ALL">All Installers</option>` +
    workers.map(w => `<option value="${w}">${w}</option>`).join('');

  select.value = "ALL";

  renderTable();
}

/* ===== RENDER TABLE ===== */

function renderTable() {

  const worker = document.getElementById('workerSelect').value;
  const from   = document.getElementById('dateFrom').value;
  const to     = document.getElementById('dateTo').value;

  const isAll = worker === "ALL";
  const workerLabel = isAll ? "All Installers" : worker;

  document.getElementById('tableWorker').textContent = workerLabel;
  document.getElementById('pWorker').textContent = workerLabel;

  const rows = allRows.filter(r => {
    const d = r['Completed Date'] || r['Scheduled Date'] || '';
    const workerMatch = isAll || r['Fieldworker'] === worker;
    return workerMatch && (!from || d >= from) && (!to || d <= to);
  });

  const jobMap = {};

  rows.forEach(r => {
    const id = r['Job Id'];
    const d  = r['Completed Date']||r['Scheduled Date']||'';
    if (!jobMap[id]) jobMap[id] = { id, d, prods: {} };

    const p = r['Product Name']||'';
    const q = parseInt(r['Product Quantity'])||0;
    if (p && q !== 0) jobMap[id].prods[p] = (jobMap[id].prods[p]||0) + q;
  });

  const jobs = Object.values(jobMap);

  jobs.forEach(j => {
    let ex = 0;
    Object.entries(j.prods).forEach(([p,q]) => {
      ex += q * payRate(p);
    });
    j.payEx  = ex;
    j.payInc = +(ex * (1+GST)).toFixed(2);
  });

  const totJobs  = jobs.length;
  const totUnits = jobs.reduce((s,j) =>
    s + Object.values(j.prods).reduce((a,b)=>a+b,0), 0);

  const totEx  = +jobs.reduce((s,j)=>s+j.payEx,0).toFixed(2);
  const totInc = +jobs.reduce((s,j)=>s+j.payInc,0).toFixed(2);

  document.getElementById('kpiJobs').textContent  = totJobs;
  document.getElementById('kpiUnits').textContent = totUnits;
  document.getElementById('kpiPayEx').textContent  = '$'+totEx.toFixed(2);
  document.getElementById('kpiPayInc').textContent = '$'+totInc.toFixed(2);

  document.getElementById('pJobs').textContent   = totJobs;
  document.getElementById('pUnits').textContent  = totUnits;
  document.getElementById('pPayEx').textContent  = '$'+totEx.toFixed(2);
  document.getElementById('pPayInc').textContent = '$'+totInc.toFixed(2);

  /* ===== INSTALLER BREAKDOWN ===== */

  if (isAll) {

    const breakdownMap = {};

    rows.forEach(r => {
      const name = r['Fieldworker'] || 'Unknown';
      const jobId = r['Job Id'];
      const p = r['Product Name'] || '';
      const q = parseInt(r['Product Quantity']) || 0;

      if (!breakdownMap[name]) {
        breakdownMap[name] = {
          jobs: new Set(),
          units: 0,
          payEx: 0
        };
      }

      breakdownMap[name].jobs.add(jobId);

      if (q > 0) {
        breakdownMap[name].units += q;
        breakdownMap[name].payEx += q * payRate(p);
      }
    });

    const breakdown = Object.entries(breakdownMap).map(([name,data]) => ({
      name,
      jobs: data.jobs.size,
      units: data.units,
      payEx: +data.payEx.toFixed(2),
      payInc: +(data.payEx * (1+GST)).toFixed(2)
    }))
    .sort((a,b) => b.payEx - a.payEx);

    const tableHTML = `
      <table>
        <thead>
          <tr>
            <th class="left">Installer</th>
            <th>Jobs</th>
            <th>Units</th>
            <th>Pay Ex GST</th>
            <th>Pay Inc GST</th>
          </tr>
        </thead>
        <tbody>
          ${breakdown.map(b => `
            <tr>
              <td class="left">${b.name}</td>
              <td>${b.jobs}</td>
              <td>${b.units}</td>
              <td class="pay-ex">$${b.payEx.toFixed(2)}</td>
              <td class="pay-inc">$${b.payInc.toFixed(2)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

    document.getElementById('installerBreakdownTable').innerHTML = tableHTML;
    document.getElementById('installerBreakdown').style.display = 'block';

  } else {
    document.getElementById('installerBreakdown').style.display = 'none';
  }

  /* ===== YOUR ORIGINAL PIVOT TABLE LOGIC CONTINUES HERE ===== */
  /* KEEP YOUR EXISTING COLUMN BUILD + TABLE RENDER CODE BELOW */
}

</script>
</body>
</html>
