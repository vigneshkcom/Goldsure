<head>

<title>Goldsure · Electrician Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════
   DESIGN TOKENS — matches Goldsure Sales Portal exactly
══════════════════════════════════════════════════════════ */
:root {
  --bg:        #f5f6f8;
  --surface:   #ffffff;
  --surface2:  #f0f2f5;
  --border:    #e3e7ef;
  --text:      #141c2e;
  --muted:     #6b7899;
  --gold:      #b08d2e;
  --gold-dark: #8a6900;
  --gold-bg:   #fef7e7;
  --gold-btn:  #b08d2e;
  --red:       #e04f4f;
  --shadow:    0 1px 4px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.10), 0 12px 32px rgba(0,0,0,0.08);
  --r:         12px;

  /* Electrician pill palette */
  --p0-bg: #dbeafe; --p0-t: #1e40af;
  --p1-bg: #dcfce7; --p1-t: #166534;
  --p2-bg: #fce7f3; --p2-t: #9d174d;
  --p3-bg: #ffedd5; --p3-t: #9a3412;
  --p4-bg: #f3e8ff; --p4-t: #6b21a8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ══════════════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════════════ */
header {
  background: var(--surface);
  border-bottom: 3px solid var(--gold);
  padding: 0 28px;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  min-height: 60px;
  box-shadow: var(--shadow);
}

.header-left  { display: flex; align-items: center; gap: 16px; }
.header-right { display: flex; align-items: center; gap: 8px; }

.header-logo { display: flex; align-items: center; gap: 12px; }
.header-logo img { height: 34px; width: auto; object-fit: contain; }
.header-logo-text { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.header-logo-text span { color: var(--gold); }

.hd { width: 1px; height: 28px; background: rgba(0,0,0,0.1); }
.header-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }

/* Worker filter badge */
.agent-chip {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 13px;
}
.agent-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold); animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
.agent-name { font-size: 12px; font-weight: 600; color: var(--text); }

/* Back button */
.nav-btn {
  font-family: 'Sora', sans-serif;
  font-size: 11px; font-weight: 600;
  padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
  background: transparent; color: #4b5b7a; cursor: pointer;
  text-decoration: none; transition: all 0.15s; display: inline-flex;
  align-items: center; white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--gold); }

/* ══════════════════════════════════════════════════════════
   SUB-NAV / TOOLBAR
══════════════════════════════════════════════════════════ */
.sub-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex; align-items: center;
  justify-content: space-between;
  gap: 12px; min-height: 52px; flex-wrap: wrap;
}

.sub-nav-left  { display: flex; align-items: center; gap: 8px; }
.sub-nav-right { display: flex; align-items: center; gap: 8px; }

/* Month nav buttons */
.month-nav-btn {
  font-family: 'Sora', sans-serif;
  font-size: 12px; font-weight: 700;
  padding: 7px 16px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface2); color: var(--text); cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  -webkit-tap-highlight-color: transparent; white-space: nowrap;
}
.month-nav-btn:hover { background: var(--gold-bg); border-color: var(--gold); color: var(--gold-dark); }
.month-nav-btn:active { transform: scale(0.97); }

.month-display {
  font-family: 'Sora', sans-serif;
  font-size: 15px; font-weight: 700;
  color: var(--text); letter-spacing: -0.3px;
  text-align: center; white-space: nowrap;
}
.month-display span { color: var(--gold); }

.today-btn {
  font-family: 'Sora', sans-serif;
  font-size: 10px; font-weight: 700;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 20px;
  background: transparent; color: var(--muted); cursor: pointer;
  transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.3px;
}
.today-btn:hover { border-color: var(--gold); color: var(--gold-dark); background: var(--gold-bg); }

/* Upload CSV */
.upload-btn {
  font-family: 'Sora', sans-serif;
  font-size: 10px; font-weight: 700;
  padding: 7px 14px; border: 1px dashed #c8bfa8; border-radius: 8px;
  background: var(--surface2); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s; white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.upload-btn:hover { border-color: var(--gold); color: var(--gold-dark); background: var(--gold-bg); }
#csvInput { display: none; }

/* ══════════════════════════════════════════════════════════
   MAIN / CALENDAR
══════════════════════════════════════════════════════════ */
.main { max-width: 1280px; margin: 0 auto; padding: 20px 28px 48px; }

.weekday-labels {
  display: grid; grid-template-columns: repeat(7,1fr);
  gap: 5px; margin-bottom: 5px;
}
.weekday-label {
  text-align: center; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); padding: 5px 0;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 5px;
}

/* ── DAY CELL ── */
.day {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 8px;
  min-height: 96px;
  position: relative;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  box-shadow: var(--shadow);
}
.day:hover {
  border-color: var(--gold);
  box-shadow: 0 2px 12px rgba(176,141,46,0.18);
  transform: translateY(-1px);
}
.day.empty {
  background: transparent; border-color: transparent;
  pointer-events: none; box-shadow: none;
}
.day.today {
  background: var(--gold-bg);
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(176,141,46,0.2);
}
.day.weekend { background: #fafbfd; }
.day.weekend.today { background: var(--gold-bg); }

.day-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 500;
  color: var(--muted);
  margin-bottom: 5px; display: block; line-height: 1;
}
.day.today .day-num  { color: var(--gold-dark); font-weight: 700; }
.day.weekend .day-num { color: #9baac0; }

/* today dot */
.today-dot {
  display: none; width: 6px; height: 6px;
  background: var(--gold); border-radius: 50%;
  position: absolute; top: 9px; right: 9px;
}
.day.today .today-dot { display: block; }

/* ── PILLS ── */
.pill {
  display: block; border-radius: 5px;
  padding: 3px 6px; font-size: 10px; font-weight: 600;
  margin-top: 3px; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: 0.01em; font-family: 'Sora', sans-serif;
}
.pill-0 { background: var(--p0-bg); color: var(--p0-t); }
.pill-1 { background: var(--p1-bg); color: var(--p1-t); }
.pill-2 { background: var(--p2-bg); color: var(--p2-t); }
.pill-3 { background: var(--p3-bg); color: var(--p3-t); }
.pill-4 { background: var(--p4-bg); color: var(--p4-t); }

/* ── HOLIDAYS ── */
.holiday-day { background: #fffbe6 !important; border: 2px solid #e8c93a !important; }
.holiday-label {
  display: block; font-size: 9px; font-weight: 700;
  color: #8a6900; margin-top: 4px; line-height: 1.3;
  white-space: normal; letter-spacing: 0.01em;
  font-family: 'Sora', sans-serif;
}

/* ── LOADING ── */
.loading-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 72px 20px; gap: 14px;
  color: var(--muted); font-size: 13px;
  grid-column: 1 / -1;
}
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  z-index: 999; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-box {
  background: var(--surface);
  border-radius: 18px;
  padding: 30px 28px 24px;
  max-width: 400px; width: 92%;
  box-shadow: var(--shadow-lg);
  border-top: 3px solid var(--gold);
  position: relative;
  animation: popIn 0.2s ease;
}
@keyframes popIn { from { transform: scale(0.96) translateY(8px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

.modal-close {
  position: absolute; top: 14px; right: 18px;
  font-size: 20px; background: none; border: none;
  cursor: pointer; color: var(--muted); line-height: 1;
}
.modal-close:hover { color: var(--text); }

.modal-title {
  font-size: 16px; font-weight: 700;
  color: var(--text); margin-bottom: 3px; letter-spacing: -0.3px;
}
.modal-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--muted); margin-bottom: 18px;
}

.checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

.check-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 9px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.check-item:hover { border-color: var(--gold); background: var(--gold-bg); }
.check-item input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: var(--gold); cursor: pointer; flex-shrink: 0;
}
.check-item .check-label {
  font-size: 13px; font-weight: 600;
  color: var(--text); cursor: pointer; flex: 1;
}

.modal-actions { display: flex; gap: 10px; }

.btn-save {
  flex: 1; background: var(--gold-btn); color: #000;
  border: none; border-radius: 9px; padding: 11px 0;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: background 0.15s;
  text-transform: uppercase; letter-spacing: 0.4px;
}
.btn-save:hover { background: #caa535; }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-cancel {
  background: var(--surface2); border: 1.5px solid var(--border);
  color: var(--muted); border-radius: 9px; padding: 11px 18px;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: background 0.15s;
  text-transform: uppercase; letter-spacing: 0.4px;
}
.btn-cancel:hover { background: var(--border); color: var(--text); }

/* ══════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════ */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #000000; color: #fff;
  font-family: 'Sora', sans-serif;
  font-size: 12px; font-weight: 600;
  padding: 10px 22px; border-radius: 30px;
  border-left: 3px solid var(--gold);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  opacity: 0; transition: opacity 0.25s, transform 0.3s;
  pointer-events: none; z-index: 9999; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { border-left-color: var(--red); }

/* ══════════════════════════════════════════════════════════
   SHARE MENU DROPDOWN
══════════════════════════════════════════════════════════ */
.share-menu {
  position: absolute; z-index: 500;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow-lg);
  min-width: 180px; padding: 6px 0;
  animation: popIn 0.15s ease;
}
.share-menu-item {
  display: block; width: 100%; text-align: left;
  background: none; border: none; padding: 9px 16px;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600;
  color: var(--text); cursor: pointer;
  transition: background 0.1s;
}
.share-menu-item:hover { background: var(--gold-bg); color: var(--gold-dark); }
.share-menu-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--muted);
  padding: 8px 16px 4px;
}
.share-menu-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

/* ══════════════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  header { flex-wrap: wrap; min-height: auto; padding: 12px 16px; gap: 8px; }
  .sub-nav { padding: 8px 16px; min-height: auto; flex-wrap: wrap; gap: 8px; padding-top: 10px; padding-bottom: 10px; }
  .main { padding: 14px 12px 36px; }
  .weekday-label { font-size: 9px; letter-spacing: 0; }
}
@media (max-width: 640px) {
  .calendar, .weekday-labels { gap: 4px; }
  .day { padding: 6px 5px; min-height: 72px; border-radius: 7px; }
  .day-num { font-size: 11px; }
  .pill { font-size: 9px; padding: 2px 5px; }
  .month-nav-btn .btn-label { display: none; }
  .month-display { font-size: 13px; }
  .upload-btn .upload-label { display: none; }
}
@media (max-width: 420px) {
  .day { min-height: 58px; }
}
</style>
</head>

async function loadCalendar() {
  document.getElementById('calendar').innerHTML =
    `<div class="loading-state"><div class="spinner"></div><span>Loading schedule…</span></div>`

  const { data, error } = await supabaseClient
    .from("electrician_calendar")
    .select("*")

  if (error) {
    document.getElementById('calendar').innerHTML =
      `<div class="loading-state" style="color:var(--red)">Failed to load data. Please try again.</div>`
    return
  }

  cachedEvents = data || []
  renderCalendar(cachedEvents)
}

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function renderCalendar(events) {
  const calendar = document.getElementById('calendar')
  calendar.innerHTML = ''

  const todayStr  = new Date().toISOString().split('T')[0]
  const firstDay  = new Date(currentYear, currentMonth, 1).getDay()
  const lastDate  = new Date(currentYear, currentMonth + 1, 0).getDate()
  const holidayMap = buildHolidayMap(currentYear)

  // Apply worker filter
  let filteredRows = events
  if (workerFilter) {
    filteredRows = events.filter(r =>
      (r.electrician || '').toLowerCase().includes(workerFilter)
    )
  }

  // Empty offset cells
  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement('div')
    e.className = 'day empty'
    calendar.appendChild(e)
  }

  for (let d = 1; d <= lastDate; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const isToday   = dateStr === todayStr
    const dayOfWeek = new Date(currentYear, currentMonth, d).getDay()
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6
    const dayHols   = holidayMap.get(dateStr) || []

    const dayBox = document.createElement('div')
    let cls = 'day'
    if (isToday)   cls += ' today'
    if (isWeekend) cls += ' weekend'
    if (dayHols.length) cls += ' holiday-day'
    dayBox.className = cls
    dayBox.dataset.date = dateStr
    dayBox.addEventListener('click', () => openModal(dateStr))

    // Today dot
    const dot = document.createElement('div')
    dot.className = 'today-dot'
    dayBox.appendChild(dot)

    // Date number
    const num = document.createElement('span')
    num.className = 'day-num'
    num.textContent = d
    dayBox.appendChild(num)

    // Holiday labels
    dayHols.forEach(label => {
      const hl = document.createElement('span')
      hl.className = 'holiday-label'
      hl.textContent = label
      dayBox.appendChild(hl)
    })

    // Electrician pills
    filteredRows.filter(e => e.work_date === dateStr).forEach(e => {
      const pill = document.createElement('span')
      pill.className = `pill ${getPillClass(e.electrician || '')}`
      pill.textContent = e.electrician || '—'
      pill.title = e.electrician || ''
      dayBox.appendChild(pill)
    })

    calendar.appendChild(dayBox)
  }
}

// ════════════════════════════════════════════════════════════
// NAVIGATION (unchanged logic)
// ════════════════════════════════════════════════════════════
function changeMonth(delta) {
  currentMonth += delta
  if (currentMonth > 11) { currentMonth = 0;  currentYear++ }
  if (currentMonth < 0)  { currentMonth = 11; currentYear-- }
  updateMonthDisplay()
  loadCalendar()
}

function goToToday() {
  const n = new Date()
  currentYear  = n.getFullYear()
  currentMonth = n.getMonth()
  updateMonthDisplay()
  loadCalendar()
}

// ════════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════════
function openModal(dateStr) {
  selectedDate = dateStr
  document.getElementById('modalDate').textContent = formatDate(dateStr)

  const scheduled = cachedEvents
    .filter(e => e.work_date === dateStr)
    .map(e => (e.electrician || '').toLowerCase())

  const list = document.getElementById('checklist')
  list.innerHTML = ''
  electricians.forEach((name, i) => {
    const id   = `chk-${i}`
    const item = document.createElement('div')
    item.className = 'check-item'
    item.addEventListener('click', ev => {
      if (ev.target.tagName !== 'INPUT') {
        item.querySelector('input').checked = !item.querySelector('input').checked
      }
    })
    const cb = document.createElement('input')
    cb.type = 'checkbox'; cb.id = id; cb.value = name
    cb.checked = scheduled.includes(name.toLowerCase())
    const lbl = document.createElement('span')
    lbl.className = 'check-label'; lbl.textContent = name
    item.appendChild(cb); item.appendChild(lbl)
    list.appendChild(item)
  })

  const btn = document.getElementById('saveBtn')
  btn.disabled = false; btn.textContent = 'Save'
  document.getElementById('modalOverlay').classList.add('open')
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open')
  selectedDate = null
}

// ════════════════════════════════════════════════════════════
// SAVE
// ════════════════════════════════════════════════════════════
async function saveElectricians() {
  if (!selectedDate) return
  const btn = document.getElementById('saveBtn')
  btn.disabled = true; btn.textContent = 'Saving…'

  const checked = [...document.querySelectorAll('#checklist input:checked')].map(cb => cb.value)

  const { error: delErr } = await supabaseClient
    .from('electrician_calendar')
    .delete()
    .eq('work_date', selectedDate)

  if (delErr) {
    showToast('Delete failed: ' + delErr.message, true)
    btn.disabled = false; btn.textContent = 'Save'; return
  }

  if (checked.length > 0) {
    const rows = checked.map(name => ({ work_date: selectedDate, electrician: name }))
    const { error: insErr } = await supabaseClient.from('electrician_calendar').insert(rows)
    if (insErr) {
      showToast('Save failed: ' + insErr.message, true)
      btn.disabled = false; btn.textContent = 'Save'; return
    }
  }

  closeModal()
  showToast(`✓ Saved ${checked.length} electrician${checked.length !== 1 ? 's' : ''} for ${formatDate(selectedDate)}`)
  loadCalendar()
}

// ════════════════════════════════════════════════════════════
// CSV UPLOAD — deduplicated, portal format aware
// ════════════════════════════════════════════════════════════
async function handleCSV(event) {
  const file = event.target.files[0]
  event.target.value = ''
  if (!file) return

  const text = await file.text()
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean)
  if (!lines.length) { showToast('CSV is empty', true); return }

  const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim())
  const dtIdx   = headers.indexOf('scheduled datetime')
  const fwIdx   = headers.indexOf('field worker')
  const wdIdx   = headers.indexOf('work_date')
  const elIdx   = headers.indexOf('electrician')

  const isPortal = dtIdx !== -1 && fwIdx !== -1
  const isSimple = wdIdx !== -1 && elIdx !== -1

  if (!isPortal && !isSimple) {
    showToast('CSV columns not recognised. Need "Scheduled Datetime"+"Field Worker" or "work_date"+"electrician"', true)
    return
  }

  const dedupMap = new Map()
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i])
    if (!cols.length) continue
    let work_date = '', electrician = ''
    if (isPortal) {
      const raw = (cols[dtIdx] || '').trim()
      const name = (cols[fwIdx] || '').trim()
      if (!raw || !name) continue
      work_date   = parsePortalDate(raw)
      electrician = name
    } else {
      work_date   = (cols[wdIdx] || '').trim()
      electrician = (cols[elIdx] || '').trim()
    }
    if (!work_date || !electrician) continue
    const key = `${work_date}|${electrician.toLowerCase()}`
    if (!dedupMap.has(key)) dedupMap.set(key, { work_date, electrician })
  }

  const rows = [...dedupMap.values()]
  if (!rows.length) { showToast('No valid rows found in CSV', true); return }

  // Collect affected dates
  const affectedDates = [...new Set(rows.map(r => r.work_date))]

  showToast(`Uploading ${rows.length} unique row${rows.length !== 1 ? 's' : ''}…`)

  // Step 4: Delete existing rows for those dates first
  const { error: delErr } = await supabaseClient
    .from('electrician_calendar')
    .delete()
    .in('work_date', affectedDates)
  if (delErr) { showToast('CSV delete failed: ' + delErr.message, true); return }

  // Step 5: Insert new rows
  const { error } = await supabaseClient.from('electrician_calendar').insert(rows)
  if (error) { showToast('CSV upload failed: ' + error.message, true); return }

  showToast(`✓ Inserted ${rows.length} unique row${rows.length !== 1 ? 's' : ''} from CSV`)
  loadCalendar()
}

function parseCSVLine(line) {
  const result = []; let cur = '', inQ = false
  for (let i = 0; i < line.length; i++) {
    const ch = line[i]
    if (ch === '"') { inQ = !inQ }
    else if (ch === ',' && !inQ) { result.push(cur); cur = '' }
    else { cur += ch }
  }
  result.push(cur)
  return result
}

function parsePortalDate(raw) {
  const MM = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'}
  const m  = raw.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/)
  if (!m) return ''
  return `${m[3]}-${MM[m[2].toLowerCase()]||''}-${String(m[1]).padStart(2,'0')}`
}

// ════════════════════════════════════════════════════════════
// PUBLIC HOLIDAYS — NSW, QLD, VIC — any year
// ════════════════════════════════════════════════════════════
function getPublicHolidays(year) {
  const hols = []
  const ALL  = ['NSW','QLD','VIC']

  function add(ds, name, states) { hols.push({ date: ds, name, states }) }
  function fmt(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` }
  function nth(y, m, wd, n) {
    let count = 0
    for (let d = 1; d <= 31; d++) {
      const dt = new Date(y, m, d)
      if (dt.getMonth() !== m) break
      if (dt.getDay() === wd && ++count === n) return dt
    }
  }
  function easterSunday(y) {
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4
    const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3)
    const h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4
    const l=(32+2*e+2*i-h-k)%7, mm=Math.floor((a+11*h+22*l)/451)
    return new Date(y, Math.floor((h+l-7*mm+114)/31)-1, ((h+l-7*mm+114)%31)+1)
  }

  // New Year's Day
  add(`${year}-01-01`, "New Year's Day", ALL)

  // Australia Day 26 Jan (substitute if weekend)
  let ad = new Date(year, 0, 26)
  if (ad.getDay()===6) ad = new Date(year,0,28)
  else if (ad.getDay()===0) ad = new Date(year,0,27)
  add(fmt(ad), 'Australia Day', ALL)

  // Easter
  const es = easterSunday(year)
  const gf = new Date(es); gf.setDate(es.getDate()-2)
  const esa= new Date(es); esa.setDate(es.getDate()-1)
  const em = new Date(es); em.setDate(es.getDate()+1)
  add(fmt(gf), 'Good Friday', ALL)
  add(fmt(esa),'Easter Saturday', ALL)
  add(fmt(es), 'Easter Sunday', ALL)
  add(fmt(em), 'Easter Monday', ALL)

  // ANZAC Day
  add(`${year}-04-25`, 'ANZAC Day', ALL)

  // Christmas (substitute if weekend)
  let xd = new Date(year,11,25)
  if (xd.getDay()===6) xd=new Date(year,11,27)
  else if (xd.getDay()===0) xd=new Date(year,11,27)
  add(fmt(xd), 'Christmas Day', ALL)

  // Boxing Day
  let bd = new Date(year,11,26)
  if (bd.getDay()===6||bd.getDay()===0) bd=new Date(year,11,28)
  else if (bd.getTime()===xd.getTime()) bd=new Date(year,11,28)
  add(fmt(bd), 'Boxing Day', ALL)

  // NSW Labour Day: 1st Monday October
  add(fmt(nth(year,9,1,1)), 'Labour Day', ['NSW'])
  // QLD Labour Day: 1st Monday May
  add(fmt(nth(year,4,1,1)), 'Labour Day', ['QLD'])
  // QLD Royal Queensland Show: 2nd Wednesday August
  add(fmt(nth(year,7,3,2)), 'Royal Queensland Show', ['QLD'])
  // VIC Labour Day: 2nd Monday March
  add(fmt(nth(year,2,1,2)), 'Labour Day', ['VIC'])
  // VIC Melbourne Cup: 1st Tuesday November
  add(fmt(nth(year,10,2,1)), 'Melbourne Cup Day', ['VIC'])

  return hols
}

function buildHolidayMap(year) {
  const map = new Map()
  getPublicHolidays(year).forEach(h => {
    const isAll = h.states.length === 3
    h.states.forEach(state => {
      const label = isAll ? `${h.name} (All States)` : `${h.name} (${state})`
      if (!map.has(h.date)) map.set(h.date, [])
      // Avoid duplicate "All States" entries
      if (!map.get(h.date).includes(label)) map.get(h.date).push(label)
    })
  })
  return map
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
function formatDate(str) {
  const [y,m,d] = str.split('-')
  return new Date(+y,+m-1,+d)
    .toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'long', year:'numeric' })
}

let _toastTimer
function showToast(msg, isError = false) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = 'toast' + (isError ? ' error' : '')
  void el.offsetWidth
  el.classList.add('show')
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3200)
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
updateMonthDisplay()
loadCalendar()

// ════════════════════════════════════════════════════════════
// SHARE LINK HELPER — dynamically from electricians array
// ════════════════════════════════════════════════════════════
let _shareMenuEl = null

function showShareMenu(event) {
  // Close if already open
  if (_shareMenuEl) { _shareMenuEl.remove(); _shareMenuEl = null; return }

  const btn = document.getElementById('shareLinkBtn')
  const rect = btn.getBoundingClientRect()

  const menu = document.createElement('div')
  menu.className = 'share-menu'
  menu.style.top  = (rect.bottom + window.scrollY + 6) + 'px'
  menu.style.right = (window.innerWidth - rect.right) + 'px'

  const lbl = document.createElement('div')
  lbl.className = 'share-menu-label'
  lbl.textContent = 'Copy link for…'
  menu.appendChild(lbl)

  // Generate one link per active electrician — from const electricians only
  electricians.forEach(name => {
    const item = document.createElement('button')
    item.className = 'share-menu-item'
    item.textContent = name
    item.addEventListener('click', () => {
      const url = new URL(window.location.href.split('?')[0])
      url.searchParams.set('electrician', name.toLowerCase())
      navigator.clipboard.writeText(url.toString()).then(() => {
        showToast(`✓ Copied link for ${name}`)
      }).catch(() => {
        showToast('Could not copy — please copy manually: ' + url.toString(), true)
      })
      closeShareMenu()
    })
    menu.appendChild(item)
  })

  const div = document.createElement('hr')
  div.className = 'share-menu-divider'
  menu.appendChild(div)

  // All electricians link (no filter)
  const allItem = document.createElement('button')
  allItem.className = 'share-menu-item'
  allItem.textContent = 'All electricians'
  allItem.style.color = 'var(--muted)'
  allItem.addEventListener('click', () => {
    const url = new URL(window.location.href.split('?')[0])
    navigator.clipboard.writeText(url.toString()).then(() => {
      showToast('✓ Copied full calendar link')
    }).catch(() => {
      showToast('Could not copy — please copy manually: ' + url.toString(), true)
    })
    closeShareMenu()
  })
  menu.appendChild(allItem)

  document.body.appendChild(menu)
  _shareMenuEl = menu

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', closeShareMenuOutside)
  }, 0)
}

function closeShareMenu() {
  if (_shareMenuEl) { _shareMenuEl.remove(); _shareMenuEl = null }
  document.removeEventListener('click', closeShareMenuOutside)
}

function closeShareMenuOutside(e) {
  if (_shareMenuEl && !_shareMenuEl.contains(e.target) && e.target.id !== 'shareLinkBtn') {
    closeShareMenu()
  }
}
