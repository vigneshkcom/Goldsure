<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldsure · Electrician Calendar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #f5f6f8;
  --surface:   #ffffff;
  --surface2:  #f0f2f5;
  --border:    #e3e7ef;
  --text:      #141c2e;
  --muted:     #6b7899;
  --gold:      #b08d2e;
  --gold-dark: #8a6900;
  --gold-bg:   #fef7e7;
  --gold-btn:  #b08d2e;
  --red:       #e04f4f;
  --shadow:    0 1px 4px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.10), 0 12px 32px rgba(0,0,0,0.08);
  --r:         12px;
  --p0-bg: #dbeafe; --p0-t: #1e40af;
  --p1-bg: #dcfce7; --p1-t: #166534;
  --p2-bg: #fce7f3; --p2-t: #9d174d;
  --p3-bg: #ffedd5; --p3-t: #9a3412;
  --p4-bg: #f3e8ff; --p4-t: #6b21a8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  background: var(--surface);
  border-bottom: 3px solid var(--gold);
  padding: 0 28px;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  min-height: 60px;
  box-shadow: var(--shadow);
}
.header-left  { display: flex; align-items: center; gap: 16px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-logo  { display: flex; align-items: center; gap: 12px; }
.header-logo img { height: 34px; width: auto; object-fit: contain; }
.header-logo-text { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.header-logo-text span { color: var(--gold); }
.hd { width: 1px; height: 28px; background: rgba(0,0,0,0.1); }
.header-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
.agent-chip {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 13px;
}
.agent-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
.agent-name { font-size: 12px; font-weight: 600; color: var(--text); }
.nav-btn {
  font-family: 'Sora', sans-serif;
  font-size: 11px; font-weight: 600;
  padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
  background: transparent; color: #4b5b7a; cursor: pointer;
  text-decoration: none; transition: all 0.15s; display: inline-flex;
  align-items: center; white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--gold); }

/* ── SUB-NAV ── */
.sub-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex; align-items: center;
  justify-content: center;
  gap: 12px; min-height: 52px;
  position: relative;
}
.sub-nav-center { display: flex; align-items: center; gap: 8px; }
.sub-nav-right {
  position: absolute; right: 28px; top: 50%; transform: translateY(-50%);
  display: flex; align-items: center; gap: 8px;
}
.month-nav-btn {
  font-family: 'Sora', sans-serif;
  font-size: 12px; font-weight: 700;
  padding: 7px 16px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface2); color: var(--text); cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  -webkit-tap-highlight-color: transparent; white-space: nowrap;
}
.month-nav-btn:hover { background: var(--gold-bg); border-color: var(--gold); color: var(--gold-dark); }
.month-nav-btn:active { transform: scale(0.97); }
.month-display {
  font-family: 'Sora', sans-serif;
  font-size: 15px; font-weight: 700;
  color: var(--text); letter-spacing: -0.3px;
  text-align: center; white-space: nowrap;
}
.month-display span { color: var(--gold); }
.today-btn {
  font-family: 'Sora', sans-serif;
  font-size: 10px; font-weight: 700;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 20px;
  background: transparent; color: var(--muted); cursor: pointer;
  transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.3px;
}
.today-btn:hover { border-color: var(--gold); color: var(--gold-dark); background: var(--gold-bg); }
.upload-btn {
  font-family: 'Sora', sans-serif;
  font-size: 10px; font-weight: 700;
  padding: 7px 14px; border: 1px dashed #c8bfa8; border-radius: 8px;
  background: var(--surface2); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s; white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.upload-btn:hover { border-color: var(--gold); color: var(--gold-dark); background: var(--gold-bg); }
#csvInput { display: none; }

/* ── MAIN ── */
.main { max-width: 1600px; margin: 0 auto; padding: 24px 28px 48px; width: 100%; flex: 1; }

/* ── TWO-MONTH WRAPPER ── */
.two-month-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}

/* ── CALENDAR CARD ── */
.calendar-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  overflow: hidden;
  padding: 20px 0 0;
}

/* Mobile month header — hidden on desktop */
.mobile-month-header { display: none; }
.mobile-month-header-inner {
  padding: 0 20px 16px;
}

/* ── MONTH LABEL INSIDE CARD (desktop) ── */
.card-month-label {
  text-align: center;
  padding: 0 20px 14px;
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
}
.card-month-label span { color: var(--gold); }

/* ── WEEKDAY LABELS ── */
.weekday-labels {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 0;
  border-top: 1px solid var(--border);
  border-bottom: 2px solid var(--border);
  background: var(--surface);
}
.weekday-label {
  text-align: center; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); padding: 8px 0;
}

/* ── CALENDAR GRID ── */
.calendar {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 0;
}

/* ── DAY CELL ── */
.day {
  background: transparent;
  border: none;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  padding: 10px 10px 8px;
  min-height: 104px;
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
  overflow: hidden;
  box-shadow: none;
}
/* Left border on first column of each row */
.day:nth-child(7n+1) { border-left: 1px solid var(--border); }

.day:hover { background: var(--gold-bg); }

.day.empty {
  background: transparent;
  pointer-events: none;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.day.empty:nth-child(7n+1) { border-left: 1px solid var(--border); }

/* Weekend */
.day.weekend { background: #f7f8fa; }
.day.weekend:hover { background: var(--gold-bg); }

/* Today */
.day.today { background: var(--gold-bg); }
.day.today:hover { background: #fdefc0; }
.day.weekend.today { background: var(--gold-bg); }

/* Holiday */
.day.holiday-day { background: #fffcf0; }
.day.holiday-day:hover { background: var(--gold-bg); }

/* ── DATE NUMBER ── */
.day-num {
  font-family: 'Sora', sans-serif;
  font-size: 12px; font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  border-radius: 50%;
  line-height: 1;
  transition: background 0.15s;
}
.day.today .day-num {
  background: var(--gold);
  color: #fff;
  font-weight: 700;
}
.day.weekend .day-num { color: #b0bac8; }
.day.holiday-day .day-num { color: var(--gold-dark); font-weight: 700; }

.today-dot { display: none !important; }

/* ── PILLS ── */
.pill {
  display: block; border-radius: 5px;
  padding: 3px 7px; font-size: 10px; font-weight: 600;
  margin-top: 3px; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: 0.01em; font-family: 'Sora', sans-serif;
}
.pill-0 { background: var(--p0-bg); color: var(--p0-t); }
.pill-1 { background: var(--p1-bg); color: var(--p1-t); }
.pill-2 { background: var(--p2-bg); color: var(--p2-t); }
.pill-3 { background: var(--p3-bg); color: var(--p3-t); }
.pill-4 { background: var(--p4-bg); color: var(--p4-t); }
.pill-avail   { background: #dcfce7; color: #166534; border: 1px dashed #86efac; font-style: italic; }
.pill-unavail { background: #fee2e2; color: #991b1b; border: 1px dashed #fca5a5; font-style: italic; }

/* ── HOLIDAYS ── */
.holiday-label {
  display: block; font-size: 9px; font-weight: 700;
  color: #8a6900; margin-top: 2px; line-height: 1.3;
  white-space: normal; letter-spacing: 0.01em; font-family: 'Sora', sans-serif;
}

/* ── LOADING ── */
.loading-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 72px 20px; gap: 14px;
  color: var(--muted); font-size: 13px; grid-column: 1 / -1;
}
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border); border-top-color: var(--gold);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── AVAILABILITY ── */
.avail-status {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-radius: 10px; margin-bottom: 16px;
  font-size: 13px; font-weight: 600;
}
.avail-status.booked      { background: #fff3cd; border: 1.5px solid #e8c93a; color: #7a5c00; }
.avail-status.available   { background: #dcfce7; border: 1.5px solid #86efac; color: #166534; }
.avail-status.unavailable { background: #fee2e2; border: 1.5px solid #fca5a5; color: #991b1b; }
.avail-status.open        { background: var(--surface2); border: 1.5px solid var(--border); color: var(--muted); }
.avail-icon { font-size: 18px; flex-shrink: 0; }
.avail-btns { display: flex; gap: 10px; margin-bottom: 16px; }
.avail-btn {
  flex: 1; padding: 12px 8px; border-radius: 10px; border: 2px solid transparent;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.3px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.avail-btn.yes { background: #dcfce7; border-color: #86efac; color: #166534; }
.avail-btn.yes:hover, .avail-btn.yes.active { background: #16a34a; border-color: #16a34a; color: #fff; }
.avail-btn.no  { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
.avail-btn.no:hover, .avail-btn.no.active   { background: #dc2626; border-color: #dc2626; color: #fff; }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  z-index: 999; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface); border-radius: 18px;
  padding: 30px 28px 24px; max-width: 400px; width: 92%;
  box-shadow: var(--shadow-lg); border-top: 3px solid var(--gold);
  position: relative; animation: popIn 0.2s ease;
}
@keyframes popIn { from { transform: scale(0.96) translateY(8px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.modal-close { position: absolute; top: 14px; right: 18px; font-size: 20px; background: none; border: none; cursor: pointer; color: var(--muted); line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 3px; letter-spacing: -0.3px; }
.modal-date  { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 18px; }
.checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.check-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 9px; cursor: pointer; transition: border-color 0.12s, background 0.12s;
}
.check-item:hover { border-color: var(--gold); background: var(--gold-bg); }
.check-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; flex-shrink: 0; }
.check-item .check-label { font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; flex: 1; }
.modal-actions { display: flex; gap: 10px; }
.btn-save {
  flex: 1; background: var(--gold-btn); color: #000;
  border: none; border-radius: 9px; padding: 11px 0;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: background 0.15s; text-transform: uppercase; letter-spacing: 0.4px;
}
.btn-save:hover { background: #caa535; }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel {
  background: var(--surface2); border: 1.5px solid var(--border);
  color: var(--muted); border-radius: 9px; padding: 11px 18px;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: background 0.15s; text-transform: uppercase; letter-spacing: 0.4px;
}
.btn-cancel:hover { background: var(--border); color: var(--text); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #000; color: #fff;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600;
  padding: 10px 22px; border-radius: 30px;
  border-left: 3px solid var(--gold);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  opacity: 0; transition: opacity 0.25s, transform 0.3s;
  pointer-events: none; z-index: 9999; white-space: nowrap;
}
.toast.show  { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { border-left-color: var(--red); }

/* ── SHARE MENU ── */
.share-menu {
  position: absolute; z-index: 500;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow-lg);
  min-width: 180px; padding: 6px 0; animation: popIn 0.15s ease;
}
.share-menu-item {
  display: block; width: 100%; text-align: left;
  background: none; border: none; padding: 9px 16px;
  font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600;
  color: var(--text); cursor: pointer; transition: background 0.1s;
}
.share-menu-item:hover { background: var(--gold-bg); color: var(--gold-dark); }
.share-menu-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); padding: 8px 16px 4px; }
.share-menu-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

/* ── MOBILE NAME LABELS ── */
.mobile-names { display: none; }
.mobile-name {
  display: block; width: 100%;
  font-family: 'Sora', sans-serif; font-size: 8.5px; font-weight: 700;
  border-radius: 3px; padding: 1px 3px; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: center; line-height: 1.4;
}
.mobile-name.dot-0 { background: var(--p0-bg); color: var(--p0-t); }
.mobile-name.dot-1 { background: var(--p1-bg); color: var(--p1-t); }
.mobile-name.dot-2 { background: var(--p2-bg); color: var(--p2-t); }
.mobile-name.dot-3 { background: var(--p3-bg); color: var(--p3-t); }
.mobile-name.dot-4 { background: var(--p4-bg); color: var(--p4-t); }

/* ── FOOTER ── */
.site-footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 28px;
}
.footer-inner {
  max-width: 1600px; margin: 0 auto;
  display: flex; align-items: center; justify-content: center;
  gap: 6px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted);
  font-family: 'Sora', sans-serif; font-weight: 500;
}
.footer-inner a { color: var(--muted); text-decoration: none; transition: color 0.15s; }
.footer-inner a:hover { color: var(--gold-dark); }
.footer-sep { color: var(--border); user-select: none; }

/* ══════════════════════════════════════════════════════════
   RESPONSIVE — TABLET (≤900px)
══════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  header { padding: 10px 16px; min-height: auto; }
  .header-title { display: none; }
  .hd { display: none; }
  .sub-nav { padding: 8px 16px; min-height: auto; flex-wrap: wrap; gap: 8px; }
  .sub-nav-right { position: static; transform: none; }
  .main { padding: 12px 10px 36px; }
  .weekday-label { font-size: 9px; letter-spacing: 0; }

  /* Stack the two months vertically on tablet */
  .two-month-wrapper {
    grid-template-columns: 1fr;
    gap: 16px;
  }
}

/* ══════════════════════════════════════════════════════════
   RESPONSIVE — MOBILE (≤640px)
══════════════════════════════════════════════════════════ */
@media (max-width: 640px) {
  header { padding: 0 12px; min-height: 52px; }
  .header-logo img { height: 28px; }
  .header-logo-text { font-size: 13px; }
  .agent-chip { padding: 4px 10px; }
  .agent-name { font-size: 11px; }
  .nav-btn { font-size: 10px; padding: 6px 10px; }

  .sub-nav { padding: 8px 12px; gap: 8px; justify-content: flex-end; min-height: 44px; }
  .sub-nav-center { display: none; }
  .sub-nav-right  { position: static; transform: none; justify-content: flex-end; gap: 8px; }
  .upload-btn { font-size: 10px; padding: 6px 10px; }

  .main { padding: 10px 6px 36px; }

  .two-month-wrapper {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .calendar-card { border-radius: 12px; padding: 12px 0 0; }

  /* Mobile month header INSIDE card */
  .mobile-month-header {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 12px;
    gap: 8px;
  }
  .mobile-month-nav {
    font-family: 'Sora', sans-serif;
    font-size: 20px; font-weight: 700;
    padding: 4px 12px; border: none;
    background: none; color: var(--gold);
    cursor: pointer; border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s; line-height: 1;
  }
  .mobile-month-nav:hover  { background: var(--gold-bg); }
  .mobile-month-nav:active { transform: scale(0.9); }
  .mobile-month-center { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .mobile-month-display {
    font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700;
    color: var(--text); letter-spacing: -0.3px; text-align: center;
  }
  .mobile-month-display span { color: var(--gold); }

  /* Hide desktop card labels on mobile — mobile header inside card handles it */
  .card-month-label { display: none; }

  /* Weekday labels */
  .weekday-label { font-size: 9px; font-weight: 700; padding: 6px 0; text-align: center; }

  /* Calendar grid */
  .calendar { gap: 0; }

  /* Square cells on mobile */
  .day {
    padding: 5px 3px 3px;
    min-height: unset;
    aspect-ratio: 1 / 1;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    box-shadow: none;
  }
  .day:hover { background: var(--gold-bg); }
  .day.today { background: var(--gold-bg); }
  .day.weekend { background: #f7f8fa; }
  .day.weekend.today { background: var(--gold-bg); }
  .day.holiday-day { background: #fffcf0; }

  .day-num {
    font-family: 'Sora', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--text); margin-bottom: 0;
    line-height: 1; text-align: center;
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
  }
  .day.today .day-num  { background: var(--gold); color: #fff; font-weight: 700; }
  .day.weekend .day-num { color: #9baac0; }
  .day.holiday-day .day-num { color: var(--gold-dark); font-weight: 700; }

// Core render logic — extracted to work for any month/year, targeting a given container id
function renderCalendarGrid(containerId, year, month, events) {
  const calendar   = document.getElementById(containerId)
  calendar.innerHTML = ''
  const todayStr    = new Date().toISOString().split('T')[0]
  const firstDay    = new Date(year, month, 1).getDay()
  const lastDate    = new Date(year, month + 1, 0).getDate()
  const activeState = workerFilter ? (electricianStates[workerFilter] || null) : null
  const holidayMap  = buildHolidayMap(year, activeState)
  const filteredRows = workerFilter
    ? events.filter(r => (r.electrician || '').toLowerCase().includes(workerFilter))
    : events

  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement('div'); e.className = 'day empty'; calendar.appendChild(e)
  }

  for (let d = 1; d <= lastDate; d++) {
    const dateStr   = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const isToday   = dateStr === todayStr
    const dayOfWeek = new Date(year, month, d).getDay()
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6
    const dayHols   = holidayMap.get(dateStr) || []

    const dayBox = document.createElement('div')
    let cls = 'day'
    if (isToday)        cls += ' today'
    if (isWeekend)      cls += ' weekend'
    if (dayHols.length) cls += ' holiday-day'
    dayBox.className = cls
    dayBox.dataset.date = dateStr
    dayBox.addEventListener('click', () => openModal(dateStr))

    // Today dot (hidden via CSS — gold circle on number handles it)
    dayBox.appendChild(Object.assign(document.createElement('div'), { className: 'today-dot' }))

    // Date number
    const numEl = document.createElement('span')
    numEl.className = 'day-num'
    numEl.textContent = d
    dayBox.appendChild(numEl)

    // Holiday labels
    dayHols.forEach(label => {
      dayBox.appendChild(Object.assign(document.createElement('span'), { className: 'holiday-label', textContent: label }))
    })

    const dayWorkers = filteredRows.filter(e => e.work_date === dateStr)

    // Desktop pills
    dayWorkers.forEach(e => {
      const raw  = (e.electrician || '').toLowerCase()
      const pill = document.createElement('span')
      if (raw.startsWith('avail:')) {
        if (workerFilter) return
        const name = raw.replace('avail:', '')
        pill.className = 'pill pill-avail'
        pill.textContent = name.charAt(0).toUpperCase() + name.slice(1) + ' ✓'
      } else if (raw.startsWith('unavail:')) {
        if (workerFilter) return
        const name = raw.replace('unavail:', '')
        pill.className = 'pill pill-unavail'
        pill.textContent = name.charAt(0).toUpperCase() + name.slice(1) + ' ✗'
      } else {
        pill.className = `pill ${getPillClass(e.electrician || '')}`
        pill.textContent = (e.electrician || '').replace(/\[.*?\]/g, '').trim().split(' ')[0] || '—'
      }
      dayBox.appendChild(pill)
    })

    // Mobile name labels
    const mobileWorkers = workerFilter
      ? dayWorkers.filter(e => { const n=(e.electrician||'').toLowerCase(); return !n.startsWith('avail:')&&!n.startsWith('unavail:') })
      : dayWorkers

    if (mobileWorkers.length > 0) {
      const namesCol = document.createElement('div')
      namesCol.className = 'mobile-names'
      mobileWorkers.forEach(e => {
        const raw = (e.electrician || '').toLowerCase()
        const lbl = document.createElement('span')
        if (raw.startsWith('avail:')) {
          lbl.className = 'mobile-name'
          lbl.style.cssText = 'background:#dcfce7;color:#166534;border:1px dashed #86efac;font-style:italic'
          lbl.textContent = raw.replace('avail:','').charAt(0).toUpperCase()+raw.replace('avail:','').slice(1)+' ✓'
        } else if (raw.startsWith('unavail:')) {
          lbl.className = 'mobile-name'
          lbl.style.cssText = 'background:#fee2e2;color:#991b1b;border:1px dashed #fca5a5;font-style:italic'
          lbl.textContent = raw.replace('unavail:','').charAt(0).toUpperCase()+raw.replace('unavail:','').slice(1)+' ✗'
        } else {
          const displayName = (e.electrician||'').replace(/\[.*?\]/g,'').trim().split(' ').filter(Boolean)[0]||'—'
          const isBookedWorker = workerFilter && (e.electrician||'').toLowerCase().includes(workerFilter)
          if (isBookedWorker) {
            lbl.className = 'mobile-name dot-0'
            lbl.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:2px;'
            lbl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;display:inline-block;vertical-align:middle;" aria-hidden="true"><path d="M17 11V7A5 5 0 0 0 7 7v4H5v11h14V11h-2zm-8-4a3 3 0 0 1 6 0v4H9V7zm3 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>' + displayName
          } else {
            lbl.className = `mobile-name ${getPillClass(e.electrician||'').replace('pill-','dot-')}`
            lbl.textContent = displayName
          }
        }
        namesCol.appendChild(lbl)
      })
      dayBox.appendChild(namesCol)
    }

    // Worker view availability tags
    if (workerFilter) {

  }

function changeMonth(delta) {
  currentMonth += delta
  if (currentMonth > 11) { currentMonth = 0; currentYear++ }
  if (currentMonth < 0)  { currentMonth = 11; currentYear-- }
  updateMonthDisplay(); loadCalendar()
}

function goToToday() {
  const n = new Date(); currentYear = n.getFullYear(); currentMonth = n.getMonth()
  updateMonthDisplay(); loadCalendar()
}

function openModal(dateStr) {
  selectedDate = dateStr
  document.getElementById('modalDate').textContent = formatDate(dateStr)
  if (workerFilter) {
    openWorkerModal(dateStr)
  } else {

    document.getElementById('workerView').style.display = 'none'
    document.getElementById('modalTitle').textContent   = 'Select electricians working'
    const scheduled = cachedEvents.filter(e=>e.work_date===dateStr).map(e=>(e.electrician||'').toLowerCase())
    const list = document.getElementById('checklist'); list.innerHTML = ''
    electricians.forEach((name,i) => {
      const item = document.createElement('div'); item.className = 'check-item'

      item.appendChild(cb); item.appendChild(lbl); list.appendChild(item)
    })

  }
  document.getElementById('modalOverlay').classList.add('open')
}

let _workerAvailChoice = null
function openWorkerModal(dateStr) {
  document.getElementById('adminView').style.display  = 'none'
  document.getElementById('workerView').style.display = 'block'
  document.getElementById('modalTitle').textContent   = 'Your Availability'
  const bookedEntry  = cachedEvents.find(e => { const el=(e.electrician||'').toLowerCase(); return e.work_date===dateStr&&el.includes(workerFilter)&&!el.startsWith('avail:')&&!el.startsWith('unavail:') })
  const availEntry   = cachedEvents.find(e => e.work_date===dateStr&&(e.electrician||'').toLowerCase()===`avail:${workerFilter}`)
  const unavailEntry = cachedEvents.find(e => e.work_date===dateStr&&(e.electrician||'').toLowerCase()===`unavail:${workerFilter}`)
  const statusEl=document.getElementById('availStatus'), statusText=document.getElementById('availStatusText')
  const btnsEl=document.getElementById('availBtns'), yesBtn=document.getElementById('availYes'), noBtn=document.getElementById('availNo')
  yesBtn.classList.remove('active'); noBtn.classList.remove('active'); _workerAvailChoice=null
  if (bookedEntry) {
    statusEl.className='avail-status booked'; statusEl.querySelector('.avail-icon').textContent='🔒'
    statusText.textContent='You are booked for this day by the scheduler.'; btnsEl.style.display='none'
  } else if (availEntry) {
    statusEl.className='avail-status available'; statusEl.querySelector('.avail-icon').textContent='✅'
    statusText.textContent='You marked yourself available. Tap to change.'; btnsEl.style.display='flex'; yesBtn.classList.add('active'); _workerAvailChoice=true
  } else if (unavailEntry) {
    statusEl.className='avail-status unavailable'; statusEl.querySelector('.avail-icon').textContent='❌'
    statusText.textContent='You marked yourself unavailable. Tap to change.'; btnsEl.style.display='flex'; noBtn.classList.add('active'); _workerAvailChoice=false
  } else {
    statusEl.className='avail-status open'; statusEl.querySelector('.avail-icon').textContent='📅'
    statusText.textContent='Let the scheduler know your availability.'; btnsEl.style.display='flex'
  }
}

async function setAvailability(isAvailable) {
  if (!selectedDate) return
  const workerName = workerFilter.charAt(0).toUpperCase()+workerFilter.slice(1)
  const availKey=`avail:${workerFilter}`, unavailKey=`unavail:${workerFilter}`
  const yesBtn=document.getElementById('availYes'), noBtn=document.getElementById('availNo')
  const statusEl=document.getElementById('availStatus'), statusText=document.getElementById('availStatusText')
  yesBtn.disabled=true; noBtn.disabled=true
  const toDelete=cachedEvents.filter(e=>e.work_date===selectedDate&&((e.electrician||'').toLowerCase()===availKey||(e.electrician||'').toLowerCase()===unavailKey))
  if (toDelete.length>0) await db.delete('electrician_calendar',{work_date:selectedDate,electrician:{in:toDelete.map(e=>e.electrician)}})
  await db.insert('electrician_calendar',[{work_date:selectedDate,electrician:isAvailable?availKey:unavailKey}])
  yesBtn.disabled=false; noBtn.disabled=false
  yesBtn.classList.toggle('active',isAvailable); noBtn.classList.toggle('active',!isAvailable); _workerAvailChoice=isAvailable
  if (isAvailable) {
    statusEl.className='avail-status available'; statusEl.querySelector('.avail-icon').textContent='✅'
    statusText.textContent='Marked as available — the scheduler can now book you.'
    showToast(`✓ ${workerName}: Available on ${formatDate(selectedDate)}`)
  } else {
    statusEl.className='avail-status unavailable'; statusEl.querySelector('.avail-icon').textContent='❌'
    statusText.textContent='Marked as unavailable for this day.'
    showToast(`✓ ${workerName}: Unavailable on ${formatDate(selectedDate)}`)
  }
  loadCalendar()
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); selectedDate=null }

async function saveElectricians() {
  if (!selectedDate) return
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='Saving…'
  const checked=[...document.querySelectorAll('#checklist input:checked')].map(cb=>cb.value)
  await db.delete('electrician_calendar',{work_date:selectedDate})
  if (checked.length>0) await db.insert('electrician_calendar',checked.map(name=>({work_date:selectedDate,electrician:name})))
  closeModal()
  showToast(`✓ Saved ${checked.length} electrician${checked.length!==1?'s':''} for ${formatDate(selectedDate)}`)
  loadCalendar()
}

async function handleCSV(event) {
  const file=event.target.files[0]; event.target.value=''; if(!file) return
  const text=await file.text()
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean)
  if(!lines.length){showToast('CSV is empty',true);return}
  const headers=parseCSVLine(lines[0]).map(h=>h.toLowerCase().trim())
  const dtIdx=headers.indexOf('scheduled datetime'),fwIdx=headers.indexOf('field worker')
  const wdIdx=headers.indexOf('work_date'),elIdx=headers.indexOf('electrician')
  const isPortal=dtIdx!==-1&&fwIdx!==-1,isSimple=wdIdx!==-1&&elIdx!==-1
  if(!isPortal&&!isSimple){showToast('CSV columns not recognised',true);return}
  const dedupMap=new Map()
  for(let i=1;i<lines.length;i++){
    const cols=parseCSVLine(lines[i]); if(!cols.length) continue
    let work_date='',electrician=''
    if(isPortal){work_date=parsePortalDate((cols[dtIdx]||'').trim());electrician=(cols[fwIdx]||'').trim()}
    else{work_date=(cols[wdIdx]||'').trim();electrician=(cols[elIdx]||'').trim()}
    if(!work_date||!electrician) continue
    const key=`${work_date}|${electrician.toLowerCase()}`
    if(!dedupMap.has(key)) dedupMap.set(key,{work_date,electrician})
  }
  const rows=[...dedupMap.values()]; if(!rows.length){showToast('No valid rows found',true);return}
  const affectedDates=[...new Set(rows.map(r=>r.work_date))]
  const affectedElectricians=[...new Set(rows.map(r=>r.electrician))]
  showToast(`Uploading ${rows.length} row${rows.length!==1?'s':''}…`)
  await db.delete('electrician_calendar',{work_date:{in:affectedDates},electrician:{in:affectedElectricians}})
  await db.insert('electrician_calendar',rows)
  showToast(`✓ Inserted ${rows.length} row${rows.length!==1?'s':''} from CSV`)
  loadCalendar()
}

function parseCSVLine(line) {
  const result=[]; let cur='',inQ=false
  for(let i=0;i<line.length;i++){
    const ch=line[i]
    if(ch==='"') inQ=!inQ
    else if(ch===','&&!inQ){result.push(cur);cur=''}
    else cur+=ch
  }
  result.push(cur); return result
}

function parsePortalDate(raw) {
  const MM={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'}
  const m=raw.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/)
  return m?`${m[3]}-${MM[m[2].toLowerCase()]||''}-${String(m[1]).padStart(2,'0')}`:''
}

function getPublicHolidays(year) {
  const hols=[],ALL=['NSW','QLD','VIC']
  const add=(ds,name,states)=>hols.push({date:ds,name,states})
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
  const nth=(y,m,wd,n)=>{let count=0;for(let d=1;d<=31;d++){const dt=new Date(y,m,d);if(dt.getMonth()!==m)break;if(dt.getDay()===wd&&++count===n)return dt}}
  const easterSunday=y=>{
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4
    const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3)
    const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4
    const l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451)
    return new Date(y,Math.floor((h+l-7*mm+114)/31)-1,((h+l-7*mm+114)%31)+1)
  }
  add(`${year}-01-01`,"New Year's Day",ALL)
  let ad=new Date(year,0,26);if(ad.getDay()===6)ad=new Date(year,0,28);else if(ad.getDay()===0)ad=new Date(year,0,27);add(fmt(ad),'Australia Day',ALL)
  const es=easterSunday(year),gf=new Date(es),esa=new Date(es),em=new Date(es)
  gf.setDate(es.getDate()-2);esa.setDate(es.getDate()-1);em.setDate(es.getDate()+1)
  add(fmt(gf),'Good Friday',ALL);add(fmt(esa),'Easter Saturday',ALL);add(fmt(es),'Easter Sunday',ALL);add(fmt(em),'Easter Monday',ALL)
  add(`${year}-04-25`,'ANZAC Day',ALL)
  let xd=new Date(year,11,25);if(xd.getDay()===6||xd.getDay()===0)xd=new Date(year,11,27);add(fmt(xd),'Christmas Day',ALL)
  let bd=new Date(year,11,26);if(bd.getDay()===6||bd.getDay()===0)bd=new Date(year,11,28);else if(bd.getTime()===xd.getTime())bd=new Date(year,11,28);add(fmt(bd),'Boxing Day',ALL)
  add(fmt(nth(year,9,1,1)),'Labour Day',['NSW']);add(fmt(nth(year,4,1,1)),'Labour Day',['QLD'])
  add(fmt(nth(year,7,3,2)),'Royal Queensland Show',['QLD']);add(fmt(nth(year,2,1,2)),'Labour Day',['VIC']);add(fmt(nth(year,10,2,1)),'Melbourne Cup Day',['VIC'])
  return hols
}

function buildHolidayMap(year,stateFilter) {
  const map=new Map()
  getPublicHolidays(year).forEach(h=>{
    const isNational=h.states.length===3
    if(stateFilter&&!isNational&&!h.states.includes(stateFilter)) return
    const label=isNational?h.name:`${h.name} (${h.states[0]})`
    if(!map.has(h.date)) map.set(h.date,[])
    if(!map.get(h.date).includes(label)) map.get(h.date).push(label)
  })
  return map
}

function formatDate(str) {
  const [y,m,d]=str.split('-')
  return new Date(+y,+m-1,+d).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'long',year:'numeric'})
}

let _toastTimer
function showToast(msg,isError=false) {
  const el=document.getElementById('toast')
  el.textContent=msg; el.className='toast'+(isError?' error':'')
  void el.offsetWidth; el.classList.add('show')
  clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>el.classList.remove('show'),3200)
}

updateMonthDisplay()
loadCalendar()

let _shareMenuEl=null
function showShareMenu(event) {
  if(_shareMenuEl){_shareMenuEl.remove();_shareMenuEl=null;return}
  const btn=document.getElementById('shareLinkBtn'),rect=btn.getBoundingClientRect()
  const menu=document.createElement('div'); menu.className='share-menu'
  menu.style.top=(rect.bottom+window.scrollY+6)+'px'; menu.style.right=(window.innerWidth-rect.right)+'px'
  const lbl=document.createElement('div'); lbl.className='share-menu-label'; lbl.textContent='Copy link for…'; menu.appendChild(lbl)
  electricians.forEach(name=>{
    const item=document.createElement('button'); item.className='share-menu-item'; item.textContent=name
    item.addEventListener('click',()=>{
      const url=new URL(window.location.href.split('?')[0]); url.searchParams.set('electrician',name.toLowerCase())
      navigator.clipboard.writeText(url.toString()).then(()=>showToast(`✓ Copied link for ${name}`)).catch(()=>showToast('Could not copy — please copy manually: '+url.toString(),true))
      closeShareMenu()
    }); menu.appendChild(item)
  })
  const div=document.createElement('hr'); div.className='share-menu-divider'; menu.appendChild(div)
  const allItem=document.createElement('button'); allItem.className='share-menu-item'; allItem.textContent='All electricians'; allItem.style.color='var(--muted)'
  allItem.addEventListener('click',()=>{
    const url=new URL(window.location.href.split('?')[0])
    navigator.clipboard.writeText(url.toString()).then(()=>showToast('✓ Copied full calendar link')).catch(()=>showToast('Could not copy',true))
    closeShareMenu()
  }); menu.appendChild(allItem)
  document.body.appendChild(menu); _shareMenuEl=menu
  setTimeout(()=>document.addEventListener('click',closeShareMenuOutside),0)
}
function closeShareMenu(){
  if(_shareMenuEl){_shareMenuEl.remove();_shareMenuEl=null}
  document.removeEventListener('click',closeShareMenuOutside)
}
function closeShareMenuOutside(e){
  if(!_shareMenuEl) return
  if(!_shareMenuEl.contains(e.target)&&!document.getElementById('shareLinkBtn').contains(e.target)) closeShareMenu()
}
