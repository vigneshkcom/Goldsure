<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Aircon">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dd8e"/>
      <stop offset=".5" stop-color="#c9a13b"/>
      <stop offset="1" stop-color="#a9781f"/>
    </linearGradient>
  </defs>
  <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="48" y1="48" x2="48" y2="14"/>
      <line x1="48" y1="22" x2="41" y2="15"/>
      <line x1="48" y1="22" x2="55" y2="15"/>
    </g>
    <use href="#arm" transform="rotate(60 48 48)"/>
    <use href="#arm" transform="rotate(120 48 48)"/>
    <use href="#arm" transform="rotate(180 48 48)"/>
    <use href="#arm" transform="rotate(240 48 48)"/>
    <use href="#arm" transform="rotate(300 48 48)"/>
  </g>
</svg>
