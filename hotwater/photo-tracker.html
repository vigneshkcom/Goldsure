<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Photo Upload Tracker — Goldsure</title>
<link rel="icon" type="image/png" sizes="96x96" href="/assets/gs-favicon-96px.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────────────────────
     Board UI in the monday.com idiom: grouped rows under coloured
     group headers, solid-fill status cells, battery progress, and
     the blue primary action. Light canvas, 4px radii, hairline grid.
     ───────────────────────────────────────────────────────────── */
  :root {
    color-scheme: light;

    --blue:      #0073ea;
    --blue-dark: #0060b9;
    --green:     #00c875;
    --orange:    #fdab3d;
    --red:       #e2445c;
    --purple:    #a25ddc;

    --ink:       #323338;
    --ink-2:     #676879;
    --ink-3:     #9699a6;
    --line:      #d0d4e4;
    --line-soft: #e6e9ef;
    --canvas:    #f6f7fb;
    --surface:   #ffffff;
    --hover:     #f5f6f8;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Board header ── */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line-soft); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  .top-row { display: flex; align-items: center; gap: 14px; padding: 16px 0 12px; }
  .logo { height: 42px; width: auto; display: block; }
  .divider { width: 1px; height: 28px; background: var(--line); }
  .board-title {
    font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 600;
    letter-spacing: -.01em; margin: 0; white-space: nowrap;
  }
  .top-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .stamp { color: var(--ink-3); font-size: 12px; white-space: nowrap; }

  /* ── Controls ── */
  .btn {
    height: 32px; padding: 0 14px; border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 400;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border: 1px solid transparent; background: transparent; color: var(--ink-2);
    transition: background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .btn:hover { background: var(--hover); color: var(--ink); }
  .btn-primary {
    background: var(--blue); color: #fff; font-weight: 500; height: 32px; padding: 0 16px;
  }
  .btn-primary:hover { background: var(--blue-dark); color: #fff; }
  .btn-primary:disabled { background: #c3c6d4; cursor: not-allowed; }
  .btn-ghost { border-color: var(--line); background: var(--surface); }
  .btn-ghost:hover { border-color: var(--ink-3); background: var(--surface); }

  .controls { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; flex-wrap: wrap; }
  .search { position: relative; width: 240px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
  input[type=search], input[type=text], input[type=tel] {
    width: 100%; height: 32px; padding: 0 12px; border: 1px solid transparent;
    background: var(--surface); border-radius: 4px; color: var(--ink);
    font-family: inherit; font-size: 14px;
  }
  input[type=search] { padding-left: 32px; border-color: var(--line-soft); }
  input::placeholder { color: var(--ink-3); }
  input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }

  /* ── New item drawer ── */
  .drawer { display: none; padding-bottom: 14px; }
  .drawer.open { display: block; animation: pop .22s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  .drawer-card {
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.05);
  }
  .drawer-title { font-weight: 600; margin-bottom: 4px; }
  .drawer-note { color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }
  .drawer-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .drawer-row input { flex: 1; min-width: 160px; border-color: var(--line); }
  .out { display: none; gap: 8px; margin-top: 10px; }
  .out input { flex: 1; border-color: var(--line); font-size: 12.5px; color: var(--ink-2); }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .msg.err { color: var(--red); }
  .msg.ok { color: #0f8a56; }

  /* ── Board ── */
  .board { padding-bottom: 48px; }
  .group { margin-bottom: 26px; }
  .group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding-left: 4px; }
  .caret {
    background: none; border: none; cursor: pointer; padding: 2px; display: flex; color: inherit;
    transition: transform .18s ease;
  }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .group-count { color: var(--ink-2); font-size: 13px; font-weight: 400; }

  .grid { background: var(--surface); border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .group.collapsed .grid { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 150px 150px 108px 96px 168px;
    align-items: center;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
    min-height: 40px;
  }
  .row:last-child { border-bottom: none; }
  .row.head {
    font-size: 13px; color: var(--ink-2); font-weight: 400;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .row.item:hover { background: var(--hover); }
  /* Group colour strip down the left edge, monday's signature */
  .row .cell:first-child { box-shadow: inset 6px 0 0 var(--gcolor, transparent); }
  .cell { padding: 8px 12px 8px 16px; min-width: 0; }
  .cell.c { text-align: center; padding-left: 12px; }

  .item-name {
    font-size: 14px; font-weight: 400; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .with-avatar { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    flex: none; width: 26px; height: 26px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
  }

  /* Solid status cell — the monday board tell */
  .status {
    display: block; width: 100%; height: 100%; min-height: 36px;
    color: #fff; font-size: 13px; font-weight: 400;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 8px;
  }
  .status.done   { background: var(--green); }
  .status.part   { background: var(--orange); }
  .status.none   { background: var(--red); }
  .status.unknown{ background: #c4c4c4; }
  .cell.status-cell { padding: 0; height: 100%; }

  /* Battery progress, monday's segmented style */
  .battery { display: flex; gap: 2px; height: 16px; border-radius: 3px; overflow: hidden; }
  .battery span { flex: 1; background: var(--line-soft); }
  .battery span.on { background: var(--green); }
  .battery span.warn { background: var(--orange); }
  .battery-label { font-size: 12px; color: var(--ink-2); text-align: center; margin-top: 3px; }

  .date { font-size: 13px; color: var(--ink-2); }
  .date b { color: var(--ink); font-weight: 400; }

  /* GHL pipeline, shown read-only beside the name */
  .pipe { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .pipe .stage {
    background: var(--line-soft); color: var(--ink-2); border-radius: 3px;
    padding: 0 5px; font-size: 11px; white-space: nowrap;
  }
  .pipe.loading { color: var(--ink-3); font-style: italic; }

  /* Age — how long a request has sat. Empty and old is the delete candidate. */
  .age { font-size: 13px; color: var(--ink-2); }
  .age.stale { color: var(--red); font-weight: 500; }

  .btn-mini {
    height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-mini:hover { border-color: var(--blue); color: var(--blue); }
  .btn-mini:disabled { opacity: .55; cursor: not-allowed; border-color: var(--line); color: var(--ink-3); }
  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* ── SMS modal ── */
  .overlay {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(41,47,76,.5);
  }
  .overlay.show { display: flex; animation: fade .16s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: var(--surface); border-radius: 8px; width: 100%; max-width: 520px;
    box-shadow: 0 12px 40px rgba(0,0,0,.22); animation: lift .2s cubic-bezier(.22,1,.36,1);
    max-height: 92vh; display: flex; flex-direction: column;
  }
  @keyframes lift { from { opacity: 0; transform: translateY(10px) scale(.99) } to { opacity: 1; transform: none } }
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 20px 12px; border-bottom: 1px solid var(--line-soft);
  }
  .modal-head h2 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 600; margin: 0; }
  .modal-x {
    margin-left: auto; background: none; border: none; cursor: pointer; color: var(--ink-2);
    width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .modal-x:hover { background: var(--hover); }
  .modal-body { padding: 16px 20px; overflow-y: auto; }
  .to-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .to-label { font-size: 13px; color: var(--ink-2); }
  .to-chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--hover);
    border-radius: 99px; padding: 3px 12px 3px 3px; font-size: 13px;
  }
  .to-chip .avatar { width: 22px; height: 22px; font-size: 10px; }
  .to-phone { color: var(--ink-2); font-size: 12.5px; }
  .field-label { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; display: block; }
  textarea#smsText {
    width: 100%; min-height: 150px; resize: vertical; padding: 12px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
    color: var(--ink); font-family: inherit; font-size: 14px; line-height: 1.55;
  }
  textarea#smsText:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .counter { font-size: 12px; color: var(--ink-3); margin-top: 6px; text-align: right; }
  .modal-foot {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px 18px; border-top: 1px solid var(--line-soft);
  }
  .modal-foot .grow { flex: 1; }
  .modal-msg { font-size: 12.5px; }
  .modal-msg.err { color: var(--red); }
  a.open {
    color: var(--blue); text-decoration: none; font-size: 13px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  a.open:hover { text-decoration: underline; }

  .state { padding: 40px 16px; text-align: center; color: var(--ink-2); background: var(--surface); border-radius: 6px; }
  .state.err { color: var(--red); }

  .row.item { animation: slide .34s ease backwards; }
  @keyframes slide { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ── Mobile: rows become stacked cards ── */
  @media (max-width: 860px) {
    .topbar { padding-top: 54px; }
  }

  @media (max-width: 800px) {
    .wrap { padding: 0 12px; }
    .stamp { display: none; }
    .logo { height: 34px; }
    .search { width: 100%; }
    .lbl { display: none; }
    /* Logo and actions share the first line; the title drops beneath so it
       never has to compete with them for width. */
    .top-row { flex-wrap: wrap; gap: 10px; padding-bottom: 8px; }
    .divider { display: none; }
    .board-title { order: 3; width: 100%; font-size: 17px; }

    .row.head { display: none; }
    .row {
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      padding: 10px 12px 12px;
      border-left: 6px solid var(--gcolor, transparent);
    }
    .row .cell:first-child { box-shadow: none; }
    .cell { padding: 0; }
    .cell.c { text-align: left; }
    .m-name   { grid-column: 1; grid-row: 1; }
    .m-status { grid-column: 2; grid-row: 1; }
    .m-batt   { grid-column: 1 / -1; grid-row: 2; margin: 6px 0 2px; }
    .m-sent   { grid-column: 1; grid-row: 3; }
    .m-age    { grid-column: 2; grid-row: 3; text-align: right; }
    .m-link   { grid-column: 1 / -1; grid-row: 4; margin-top: 8px; }
    .m-link .actions { justify-content: space-between; }
    .status { min-height: 24px; border-radius: 4px; padding: 0 12px; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="/assets/internal-systems-sidebar.css">
<script src="/assets/internal-systems-sidebar.js" defer></script>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="top-row">
      <img class="logo" src="/assets/Goldsure-Horizontal-Logo-RGB-600px-w-72ppi.jpg" alt="Goldsure">
      <span class="divider"></span>
      <h1 class="board-title">Photo Upload Tracker</h1>
      <div class="top-end">
        <span class="stamp" id="stamp"></span>
        <button class="btn" id="refreshBtn" aria-label="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span class="lbl">Refresh</span>
        </button>
        <button class="btn btn-primary" id="newBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>New<span class="lbl"> item</span></span>
        </button>
      </div>
    </div>

    <div class="controls">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input type="search" id="search" placeholder="Search this board">
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="drawer" id="drawer">
    <div class="drawer-card">
      <div class="drawer-title">New photo request</div>
      <div class="drawer-note">Creates the customer's folder and gives you a link to send however you like.</div>
      <div class="drawer-row">
        <input type="text" id="reqName" placeholder="Customer name" autocomplete="off">
        <input type="tel" id="reqPhone" placeholder="Mobile (optional)" autocomplete="off">
        <button class="btn btn-primary" id="reqBtn">Create link</button>
      </div>
      <div class="out" id="out">
        <input type="text" id="reqLink" readonly>
        <button class="btn btn-ghost" id="copyBtn">Copy</button>
      </div>
      <div class="msg" id="reqMsg"></div>
    </div>
  </div>

  <div class="board" id="board">
    <div class="state">Loading board…</div>
  </div>
</div>

<!-- Reminder SMS: previewed and editable before anything is sent -->
<div class="overlay" id="smsOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="smsTitle">
    <div class="modal-head">
      <h2 id="smsTitle">Send reminder</h2>
      <button class="modal-x" id="smsClose" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="to-row">
        <span class="to-label">To</span>
        <span class="to-chip" id="smsTo"></span>
      </div>
      <label class="field-label" for="smsText">Message</label>
      <textarea id="smsText" spellcheck="true"></textarea>
      <div class="counter" id="smsCount"></div>
    </div>
    <div class="modal-foot">
      <span class="modal-msg" id="smsMsg"></span>
      <span class="grow"></span>
      <button class="btn btn-ghost" id="smsCancel">Cancel</button>
      <button class="btn btn-primary" id="smsSend">Send SMS</button>
    </div>
  </div>
</div>

<script>
/* The upload page asks for four shots — switchboard, existing unit, access,
   and the optional compliance plate — so counts read against four. */
const SLOTS = 4;
const AVATAR_COLORS = ['#0073ea','#a25ddc','#00c875','#fdab3d','#e2445c','#009eb5','#ff642e'];

let folders = [];
let ghl = {};              // phone → { pipeline, stage, … } from GHL
const collapsed = {};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const fmtDate = ms => {
  if (!ms) return '—';
  const d = new Date(Number(ms));
  return isNaN(d) ? '—' : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
};

function relative(ms) {
  if (!ms) return '';
  const days = Math.floor((Date.now() - Number(ms)) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return days + 'd ago';
  return '';
}

const initials = name => String(name || '?')
  .replace(/\(.*?\)/g, '').trim().split(/\s+/).slice(0, 2)
  .map(w => w[0] || '').join('').toUpperCase() || '?';

const avatarColor = name => AVATAR_COLORS[
  Math.abs([...String(name)].reduce((h, c) => h * 31 + c.charCodeAt(0) | 0, 7)) % AVATAR_COLORS.length
];

function statusOf(f) {
  const n = f.photoCount;
  if (n === null || n === undefined) return { cls: 'unknown', text: 'Unknown' };
  if (n === 0) return { cls: 'none', text: 'Waiting on photos' };
  if (n < 3)   return { cls: 'part', text: 'Partly received' };
  return { cls: 'done', text: 'Photos received' };
}

function battery(count) {
  const n = Math.max(0, Math.min(SLOTS, Number(count) || 0));
  const cls = n >= 3 ? 'on' : 'warn';
  let bars = '';
  for (let i = 0; i < SLOTS; i++) bars += `<span class="${i < n ? cls : ''}"></span>`;
  return `<div class="battery">${bars}</div><div class="battery-label">${count === null ? '—' : n + '/' + SLOTS}</div>`;
}

function ageDays(ms) {
  if (!ms) return null;
  return Math.floor((Date.now() - Number(ms)) / 86400000);
}

function ageHtml(f) {
  const d = ageDays(f.createdAt);
  if (d === null) return '<span class="age">—</span>';
  const empty = (f.photoCount || 0) === 0;
  // An empty folder sitting for a week is the one worth chasing or deleting.
  const stale = empty && d >= 7;
  const text = d === 0 ? 'today' : d === 1 ? '1 day' : `${d} days`;
  return `<span class="age${stale ? ' stale' : ''}" title="Created ${fmtDate(f.createdAt)}">${text}</span>`;
}

function pipeHtml(f) {
  const info = ghl[ghlKey(f)];
  if (info === undefined) return '<div class="pipe loading">checking GHL…</div>';
  if (!info || !info.pipeline) return '';
  return `<div class="pipe">${esc(info.pipeline)}${info.stage ? `<span class="stage">${esc(info.stage)}</span>` : ''}</div>`;
}

function rowHtml(f, i, gcolor) {
  const st = statusOf(f);
  const canRemind = Boolean(phoneFor(f)) && (f.photoCount || 0) < 3;
  return `<div class="row item" style="--gcolor:${gcolor};animation-delay:${Math.min(i * 22, 300)}ms">
    <div class="cell m-name">
      <div class="with-avatar">
        <div class="avatar" style="background:${avatarColor(f.name)}">${esc(initials(f.name))}</div>
        <div style="min-width:0">
          <div class="item-name" title="${esc(f.name)}">${esc(f.name)}</div>
          ${pipeHtml(f)}
        </div>
      </div>
    </div>
    <div class="cell status-cell m-status"><span class="status ${st.cls}">${st.text}</span></div>
    <div class="cell c m-batt">${battery(f.photoCount)}</div>
    <div class="cell c m-sent"><div class="date"><b>${fmtDate(f.createdAt)}</b></div></div>
    <div class="cell c m-age">${ageHtml(f)}</div>
    <div class="cell c m-link">
      <div class="actions">
        ${canRemind ? `<button class="btn-mini" data-remind="${esc(f.id)}" title="Text this customer a reminder">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Remind</button>` : ''}
        ${f.link ? `<a class="open" href="${esc(f.link)}" target="_blank" rel="noopener">Folder
         <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></a>` : ''}
      </div>
    </div>
  </div>`;
}

function groupHtml(key, name, color, items) {
  if (!items.length) return '';
  const isCollapsed = collapsed[key] ? ' collapsed' : '';
  return `<section class="group${isCollapsed}" data-group="${key}">
    <div class="group-head" style="color:${color}">
      <button class="caret" data-toggle="${key}" aria-label="Collapse ${esc(name)}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <span class="group-name">${esc(name)}</span>
      <span class="group-count">${items.length} ${items.length === 1 ? 'item' : 'items'}</span>
    </div>
    <div class="grid">
      <div class="row head">
        <div class="cell">Customer</div>
        <div class="cell c">Status</div>
        <div class="cell c">Photos</div>
        <div class="cell c">Link sent</div>
        <div class="cell c">Waiting</div>
        <div class="cell c">Actions</div>
      </div>
      ${items.map((f, i) => rowHtml(f, i, color)).join('')}
    </div>
  </section>`;
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const list = q ? folders.filter(f => f.name.toLowerCase().includes(q)) : folders;
  const board = $('board');

  if (!list.length) {
    board.innerHTML = `<div class="state">${folders.length
      ? 'No items match your search.'
      : 'No photo requests yet — create one with <b>New item</b>, or from the SMS portal.'}</div>`;
    return;
  }

  const waiting = list.filter(f => (f.photoCount || 0) === 0);
  const partial = list.filter(f => (f.photoCount || 0) > 0 && f.photoCount < 3);
  const done    = list.filter(f => (f.photoCount || 0) >= 3);

  board.innerHTML =
      groupHtml('waiting', 'Waiting on photos', 'var(--red)', waiting)
    + groupHtml('partial', 'Partly received',   'var(--orange)', partial)
    + groupHtml('done',    'Photos received',   'var(--green)', done);

  board.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.toggle;
      collapsed[key] = !collapsed[key];
      board.querySelector(`[data-group="${key}"]`).classList.toggle('collapsed', collapsed[key]);
    };
  });

  board.querySelectorAll('[data-remind]').forEach(btn => {
    btn.onclick = () => openSmsModal(btn.dataset.remind);
  });
}

/* ── GHL lookup ──
   Folders are named "John Smith (8761)", so the name plus those last four
   digits identify the contact — no phone number needs storing anywhere, and
   folders created before any of this existed resolve too. GHL then supplies
   the full number, which is what makes the reminder button possible.
   Batched; any failure just leaves the row without a pipeline or reminder. */
const ghlKey = f => `${String(f.name || '').replace(/\s*\(\d{3,4}\)\s*$/, '').trim()}~${(/\((\d{3,4})\)\s*$/.exec(f.name || '') || [])[1] || ''}`;

async function loadPipelines() {
  const keys = [...new Set(folders.map(ghlKey).filter(k => k && !k.startsWith('~')))];
  if (!keys.length) return;

  for (let i = 0; i < keys.length; i += 20) {
    const batch = keys.slice(i, i + 20);
    try {
      const res = await fetch('/api/battery/request-callback?action=ghl-find&items=' + encodeURIComponent(batch.join(',')));
      if (!res.ok) throw new Error('lookup failed');
      const found = await res.json();
      batch.forEach(k => { ghl[k] = found[k] || null; });
    } catch {
      batch.forEach(k => { if (ghl[k] === undefined) ghl[k] = null; });
    }
    render();
  }
}

// The number GHL holds, falling back to one stored on the folder itself.
const phoneFor = f => (ghl[ghlKey(f)] || {}).phone || f.phone || '';

/* ── SMS reminder ── */
function uploadLinkFor(f) {
  const first = String(f.name || '').replace(/\(.*?\)/g, '').trim().split(/\s+/)[0] || '';
  const n = first ? `&n=${encodeURIComponent(first)}` : '';
  const ph = phoneFor(f);
  const p = ph ? `&p=${encodeURIComponent(ph)}` : '';
  return `${location.origin}/u?f=${encodeURIComponent(f.id)}${n}${p}`;
}

function reminderText(f) {
  const first = String(f.name || '').replace(/\(.*?\)/g, '').trim().split(/\s+/)[0] || 'there';
  // The actual date the link went out, so the customer can place it.
  const sent = f.createdAt
    ? new Date(Number(f.createdAt)).toLocaleDateString('en-AU', { day: 'numeric', month: 'long' })
    : '';
  const on = sent ? ` on ${sent}` : '';
  const link = uploadLinkFor(f);

  return (f.photoCount || 0) > 0
    ? `Hi ${first}, Goldsure here. Thanks for the photos you've sent through so far. We're still missing a couple before we can finish your hot water quote — could you add the rest when you get a minute? Here's the link again: ${link}`
    : `Hi ${first}, Goldsure here. We sent you a link${on} to upload photos of your existing hot water system, switchboard and the access to your property. We need these before we can put your quote together. In case you missed it, here's the link again — it only takes a minute: ${link}`;
}

/* ── Reminder modal ── */
let smsTarget = null;

function openSmsModal(folderId) {
  const f = folders.find(x => x.id === folderId);
  const phone = phoneFor(f || {});
  if (!f || !phone) return;
  smsTarget = { ...f, phone };

  $('smsTo').innerHTML =
    `<span class="avatar" style="background:${avatarColor(f.name)}">${esc(initials(f.name))}</span>` +
    `${esc(f.name)} <span class="to-phone">${esc(phone)}</span>`;
  $('smsText').value = reminderText(f);
  $('smsMsg').textContent = '';
  $('smsMsg').className = 'modal-msg';
  $('smsSend').disabled = false;
  $('smsSend').textContent = 'Send SMS';
  updateSmsCount();
  $('smsOverlay').classList.add('show');
  setTimeout(() => $('smsText').focus(), 60);
}

function closeSmsModal() {
  $('smsOverlay').classList.remove('show');
  smsTarget = null;
}

function updateSmsCount() {
  const len = $('smsText').value.length;
  // Multipart SMS are billed at 153 characters each once past the first 160.
  const parts = len <= 160 ? 1 : Math.ceil(len / 153);
  $('smsCount').textContent = `${len} characters · ${parts} SMS ${parts === 1 ? 'part' : 'parts'}`;
}

async function sendSms() {
  if (!smsTarget) return;
  const message = $('smsText').value.trim();
  if (!message) {
    $('smsMsg').textContent = 'The message is empty.';
    $('smsMsg').className = 'modal-msg err';
    return;
  }

  const btn = $('smsSend');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  $('smsMsg').textContent = '';

  try {
    const res = await fetch('/api/battery/request-callback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'send', phone: smsTarget.phone, message }),
    });
    const data = await res.json();
    // The gateway refuses numbers that replied STOP — surface that plainly
    // rather than reporting a send that never happened.
    if (!res.ok || !data.success) throw new Error(data.error || 'Send failed');
    closeSmsModal();
  } catch (e) {
    $('smsMsg').textContent = e.message;
    $('smsMsg').className = 'modal-msg err';
    btn.disabled = false;
    btn.textContent = 'Send SMS';
  }
}

$('smsText').addEventListener('input', updateSmsCount);
$('smsSend').onclick = sendSms;
$('smsCancel').onclick = closeSmsModal;
$('smsClose').onclick = closeSmsModal;
$('smsOverlay').addEventListener('click', e => { if (e.target === $('smsOverlay')) closeSmsModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSmsModal(); });

async function load() {
  try {
    const res = await fetch('/api/zoho/create-photo-request?action=list');
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || `HTTP ${res.status}`);
    folders = data.folders || [];
    render();
    loadPipelines();
    $('stamp').textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
  } catch (e) {
    $('board').innerHTML = `<div class="state err">Couldn't load the board: ${esc(e.message)}</div>`;
  }
}

$('search').addEventListener('input', render);
$('refreshBtn').onclick = load;
$('newBtn').onclick = () => { if ($('drawer').classList.toggle('open')) $('reqName').focus(); };

const msg = (text, cls) => {
  const el = $('reqMsg');
  el.textContent = text || '';
  el.className = 'msg' + (cls ? ' ' + cls : '');
};

$('reqBtn').onclick = async () => {
  const name = $('reqName').value.trim();
  const phone = $('reqPhone').value.trim();
  if (!name) { msg('Enter the customer name first.', 'err'); return; }

  const btn = $('reqBtn');
  btn.disabled = true; btn.textContent = 'Creating…'; msg('');

  try {
    const res = await fetch('/api/zoho/create-photo-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, ...(phone ? { phone } : {}) }),
    });
    const data = await res.json();
    if (!res.ok || !data.uploadPageUrl) throw new Error(data.detail || data.error || 'Failed');

    $('reqLink').value = data.uploadPageUrl;
    $('out').style.display = 'flex';
    msg(data.reused ? `Using ${name}'s existing folder.` : `Folder created for ${name}.`, 'ok');
    $('reqName').value = ''; $('reqPhone').value = '';
    load();
  } catch (e) {
    msg('Could not create the link: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Create link';
  }
};

$('copyBtn').onclick = async () => {
  const input = $('reqLink');
  try {
    await navigator.clipboard.writeText(input.value);
    $('copyBtn').textContent = 'Copied';
    setTimeout(() => { $('copyBtn').textContent = 'Copy'; }, 1700);
  } catch {
    // Clipboard needs a secure context/permission; select it so it can still
    // be copied by hand rather than the button doing nothing.
    input.select();
    msg('Press Ctrl/Cmd+C to copy.', 'ok');
  }
};

$('reqName').addEventListener('keydown', e => { if (e.key === 'Enter') $('reqBtn').click(); });
$('reqPhone').addEventListener('keydown', e => { if (e.key === 'Enter') $('reqBtn').click(); });

load();
</script>
</body>
</html>
