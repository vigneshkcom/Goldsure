<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldsure · Heatpumps Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface2: #f0f2f5; --surface3: #e8eaf0;
  --border: #e3e7ef; --border2: #d0d5df; --text: #141c2e; --muted: #6b7899;
  --gold: #b08d2e; --gold-light: #caa535; --gold-bg: #fef7e7; --gold-border: #e8d28a;
  --green: #18a96e; --green-bg: #eaf7f2; --green-border: #b0e8d2;
  --amber: #d98c1e; --blue: #2d6be4; --blue-bg: #edf2fd;
  --red: #e04f4f; --red-bg: rgba(224,79,79,0.08); --teal: #0e9488;
  --shadow: 0 1px 4px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.04);
  --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header { background: #fff; border-bottom: 3px solid var(--gold); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; min-height: 60px; }
.header-left { display: flex; align-items: center; gap: 16px; }
.header-logo img { height: 34px; width: auto; }
.hd { width: 1px; height: 26px; background: rgba(0,0,0,0.1); }
.page-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
.header-right { display: flex; align-items: center; gap: 8px; }
.nav-btn { font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600; padding: 7px 14px; border: 1px solid var(--border2); border-radius: 8px; background: transparent; color: #4b5b7a; cursor: pointer; text-decoration: none; transition: all 0.15s; display: inline-flex; align-items: center; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.3px; }
.nav-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--gold); }
@keyframes spin { to { transform: rotate(360deg); } }
.spin-icon { display: inline-block; margin-right: 5px; }
.spinning .spin-icon { animation: spin 0.7s linear infinite; }

main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

/* ── DATE RANGE ── */
.range-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 18px; display: flex; align-items: center; gap: 8px; margin-bottom: 18px; box-shadow: var(--shadow); flex-wrap: wrap; }
.range-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-right: 4px; }
.range-btn { font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600; padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.range-btn:hover, .range-btn.active { background: var(--gold-bg); color: var(--gold); border-color: var(--gold-border); }
.range-divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.date-input { font-family: 'Sora', sans-serif; font-size: 12px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text); outline: none; transition: border-color 0.15s; }
.date-input:focus { border-color: var(--gold); }
.apply-btn { font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700; padding: 7px 16px; border-radius: 8px; border: none; background: var(--gold); color: #fff; cursor: pointer; transition: opacity 0.15s; }
.apply-btn:hover { opacity: 0.88; }

/* ── KPI GRID ── */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-card.blue::before   { background: var(--blue); }
.kpi-card.green::before  { background: var(--green); }
.kpi-card.amber::before  { background: var(--amber); }
.kpi-card.teal::before   { background: var(--teal); }
.kpi-card.gold::before   { background: var(--gold); }
.kpi-card.red::before    { background: var(--red); }
.kpi-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 10px; }
.kpi-val { font-size: 26px; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--text); line-height: 1; }
.kpi-card.blue  .kpi-val { color: var(--blue); }
.kpi-card.green .kpi-val { color: var(--green); }
.kpi-card.amber .kpi-val { color: var(--amber); }
.kpi-card.teal  .kpi-val { color: var(--teal); }
.kpi-card.gold  .kpi-val { color: var(--gold); }
.kpi-card.red   .kpi-val { color: var(--red); }
.kpi-sub { font-size: 10px; color: var(--muted); margin-top: 5px; }

/* ── CHARTS ── */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); }
.chart-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 18px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-name { font-size: 11px; font-weight: 600; width: 140px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.bar-track { flex: 1; background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; min-width: 3px; }
.bar-fill.blue  { background: var(--blue); }
.bar-fill.green { background: var(--green); }
.bar-fill.amber { background: var(--amber); }
.bar-fill.teal  { background: var(--teal); }
.bar-fill.gold  { background: var(--gold); }
.bar-fill.red   { background: var(--red); }
.bar-fill.purple{ background: #7c3aed; }
.bar-fill.gray  { background: #94a3b8; }
.bar-val { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--muted); min-width: 32px; text-align: right; }
.bar-pct { font-size: 10px; color: var(--muted); min-width: 36px; text-align: right; }
.empty-chart { text-align: center; padding: 32px 0; font-size: 12px; color: var(--muted); }

/* ── TABLE ── */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.table-header-bar { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.table-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
.table-count { font-size: 11px; color: var(--muted); }
.table-count strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
thead tr { background: var(--surface2); }
th { padding: 10px 14px; text-align: left; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--gold-bg); }
td { padding: 11px 14px; font-size: 12px; color: var(--text); vertical-align: middle; }
.td-name { font-weight: 600; }
.td-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
.td-mono-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #4b5b7a; margin-top: 2px; }
.td-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.badge::before { content: '●'; font-size: 6px; }

/* Stage badge colours */
.stage-new-lead      { background: #f1f2f4; color: #6b7280; border: 1px solid #d1d5db; }
.stage-follow-up     { background: #e6faf8; color: #0d9488; border: 1px solid #99e6df; }
.stage-iba           { background: #f0f9ff; color: #0369a1; border: 1px solid #7dd3fc; }
.stage-won           { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
.stage-lost          { background: #fff8f0; color: #c2410c; border: 1px solid #fdba74; }
.stage-not-reachable  { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; }
.stage-not-interested { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
.stage-out-of-area    { background: #f5f3ff; color: #7c3aed; border: 1px solid #c4b5fd; }
.stage-unserviceable  { background: #f1f5f9; color: #475569; border: 1px solid #94a3b8; }
.stage-default       { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }

.skeleton { background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; height: 12px; display: block; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skeleton.w-20{width:20%}.skeleton.w-30{width:30%}.skeleton.w-40{width:40%}.skeleton.w-60{width:60%}.skeleton.w-80{width:80%}

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #141c2e; color: #fff; font-size: 12px; font-weight: 600; padding: 10px 22px; border-radius: 30px; border-left: 3px solid var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 9999; white-space: nowrap; }
.toast.show { opacity: 1; }
.error-banner { background: var(--red-bg); border: 1px solid rgba(224,79,79,0.3); border-radius: var(--r); padding: 14px 18px; margin-bottom: 18px; font-size: 12px; color: var(--red); display: none; }
.error-banner.show { display: block; }

@media(max-width:900px) { .kpi-grid{grid-template-columns:repeat(2,1fr)} .charts-grid{grid-template-columns:1fr} }
@media(max-width:600px) { main{padding:16px} header{padding:0 16px} .kpi-grid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-logo">
      <img src="/assets/Goldsure-Horizontal-Logo-RGB-600px-w-72ppi.jpg" alt="Goldsure">
    </div>
    <div class="hd"></div>
    <span class="page-label">Heatpumps Performance</span>
  </div>
  <div class="header-right">
    <a href="/" class="nav-btn">← Portal</a>
    <button class="nav-btn" id="refreshBtn" onclick="loadAll()"><span class="spin-icon" id="spinIcon">↻</span> Refresh</button>
  </div>
</header>

<main>
  <div class="error-banner" id="errorBanner"></div>

  <!-- Date Range -->
  <div class="range-bar">
    <span class="range-label">Period</span>
    <button class="range-btn" data-days="7"  onclick="setRange(7)">7D</button>
    <button class="range-btn" data-days="14" onclick="setRange(14)">14D</button>
    <button class="range-btn" data-days="30" onclick="setRange(30)">30D</button>
    <button class="range-btn" data-days="90" onclick="setRange(90)">90D</button>
    <div class="range-divider"></div>
    <input type="date" class="date-input" id="dateFrom" onchange="clearRangeActive()">
    <span style="font-size:11px;color:var(--muted);">to</span>
    <input type="date" class="date-input" id="dateTo" onchange="clearRangeActive()">
    <button class="apply-btn" onclick="loadAll()">Apply</button>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card blue">
      <div class="kpi-label">Total Leads</div>
      <div class="kpi-val" id="kpi-leads">—</div>
      <div class="kpi-sub" id="kpi-leads-sub">in selected period</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-label">Google Spend</div>
      <div class="kpi-val" id="kpi-spend">—</div>
      <div class="kpi-sub">Heatpumps campaigns</div>
    </div>
    <div class="kpi-card amber">
      <div class="kpi-label">Cost Per Lead</div>
      <div class="kpi-val" id="kpi-cpl">—</div>
      <div class="kpi-sub">spend ÷ leads</div>
    </div>
    <div class="kpi-card teal">
      <div class="kpi-label">Won / Installed</div>
      <div class="kpi-val" id="kpi-won">—</div>
      <div class="kpi-sub" id="kpi-won-rate">of total leads</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">Stage Breakdown</div>
      <div id="stage-chart"><div class="empty-chart">Loading…</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Campaign Spend</div>
      <div id="campaign-chart"><div class="empty-chart">Loading…</div></div>
    </div>
  </div>

  <!-- Leads Table -->
  <div class="table-wrap">
    <div class="table-header-bar">
      <span class="table-title">Leads — HWS Pipeline</span>
      <span class="table-count"><strong id="lead-count">0</strong> leads shown</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Date Added</th>
            <th>Customer</th>
            <th>Stage</th>
            <th>Status</th>
            <th>Source</th>
          </tr>
        </thead>
        <tbody id="leads-body">
          <tr><td><span class="skeleton w-30"></span></td><td><span class="skeleton w-60"></span></td><td><span class="skeleton w-40"></span></td><td><span class="skeleton w-20"></span></td><td><span class="skeleton w-40"></span></td></tr>
          <tr><td><span class="skeleton w-30"></span></td><td><span class="skeleton w-60"></span></td><td><span class="skeleton w-40"></span></td><td><span class="skeleton w-20"></span></td><td><span class="skeleton w-40"></span></td></tr>
          <tr><td><span class="skeleton w-30"></span></td><td><span class="skeleton w-60"></span></td><td><span class="skeleton w-40"></span></td><td><span class="skeleton w-20"></span></td><td><span class="skeleton w-40"></span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allLeads     = [];   // all GHL opps fetched (not filtered by date)
let dateFrom     = '';
let dateTo       = '';
let spendData    = null; // last fetched spend payload

const STAGE_COLOURS = [
  'blue','green','teal','amber','gold','purple','red','gray'
];

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  setRange(30);
});

// ── Date range helpers ─────────────────────────────────────────────────────
function setRange(days) {
  const to   = new Date();
  const from = new Date(+to - days * 864e5);
  dateTo   = to.toISOString().slice(0, 10);
  dateFrom = from.toISOString().slice(0, 10);
  document.getElementById('dateTo').value   = dateTo;
  document.getElementById('dateFrom').value = dateFrom;
  document.querySelectorAll('.range-btn').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.days) === days)
  );
  loadAll();
}

function clearRangeActive() {
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  dateFrom = document.getElementById('dateFrom').value;
  dateTo   = document.getElementById('dateTo').value;
}

// ── Load ───────────────────────────────────────────────────────────────────
async function loadAll() {
  dateFrom = document.getElementById('dateFrom').value;
  dateTo   = document.getElementById('dateTo').value;
  if (!dateFrom || !dateTo) return;

  const btn  = document.getElementById('refreshBtn');
  const spin = document.getElementById('spinIcon');
  btn.classList.add('spinning');

  hideError();

  try {
    // 1. Config → location ID
    const cfg = await fetch('/api/MetaAdPerformace/config').then(r => r.json());
    if (!cfg.ghlLocationId) throw new Error('GHL location not configured.');
    const locationId = cfg.ghlLocationId;

    // 2. Fetch pipeline to find HWS Pipeline
    const pipelinesData = await ghlFetch(`/opportunities/pipelines?locationId=${encodeURIComponent(locationId)}`);
    const pipelines = pipelinesData.pipelines || [];
    const hwsPipeline = pipelines.find(p =>
      (p.name || '').toLowerCase().includes('hws') ||
      (p.name || '').toLowerCase().includes('hot water') ||
      (p.name || '').toLowerCase().includes('hotwater')
    );
    if (!hwsPipeline) throw new Error(`HWS Pipeline not found. Available: ${pipelines.map(p=>p.name).join(', ')}`);

    // 3. Fetch leads + spend in parallel
    const [leads, spend] = await Promise.all([
      fetchAllLeads(locationId, hwsPipeline.id),
      fetchSpend(dateFrom, dateTo),
    ]);

    allLeads  = leads;
    spendData = spend;

    renderAll();
    showToast(`Loaded ${leads.length} leads`);
  } catch(e) {
    console.error(e);
    showError(e.message);
  } finally {
    btn.classList.remove('spinning');
  }
}

// ── GHL helpers ────────────────────────────────────────────────────────────
async function ghlFetch(path) {
  const res = await fetch(`/api/MetaAdPerformace/ghl?path=${encodeURIComponent(path)}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `GHL ${res.status}`);
  return data;
}

async function fetchAllLeads(locationId, pipelineId) {
  let all = [], page = 1;
  while (true) {
    const data = await ghlFetch(
      `/opportunities/search?location_id=${encodeURIComponent(locationId)}&pipeline_id=${encodeURIComponent(pipelineId)}&limit=100&page=${page}`
    );
    const opps = data.opportunities || [];
    all = all.concat(opps);
    if (opps.length < 100 || !data.meta?.nextPage || page >= 10) break;
    page++;
  }
  return all;
}

async function fetchSpend(from, to) {
  const res = await fetch(`/api/MetaAdPerformace/google-spend?from=${from}&to=${to}&filter=Heatpumps`);
  const data = await res.json();
  if (!res.ok || !data.success) throw new Error(data.error || 'Google Ads fetch failed');
  return data;
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderAll() {
  const fromTs = new Date(dateFrom + 'T00:00:00');
  const toTs   = new Date(dateTo   + 'T23:59:59');

  const filtered = allLeads.filter(o => {
    const d = new Date(o.createdAt || o.dateAdded || 0);
    return d >= fromTs && d <= toTs;
  });

  renderKPIs(filtered);
  renderStageChart(filtered);
  renderCampaignChart();
  renderLeadsTable(filtered);
}

function renderKPIs(leads) {
  const total = leads.length;
  const spend = spendData?.total_spend || 0;
  const cpl   = total > 0 ? spend / total : null;
  const won   = leads.filter(l =>
    (l.pipelineStageName || '').toLowerCase().includes('won') ||
    (l.pipelineStageName || '').toLowerCase().includes('install') ||
    l.status === 'won'
  ).length;
  const wonRate = total > 0 ? Math.round(won / total * 100) : 0;

  document.getElementById('kpi-leads').textContent     = total;
  document.getElementById('kpi-leads-sub').textContent = total === 1 ? '1 lead' : `${total} leads`;
  document.getElementById('kpi-spend').textContent     = '$' + spend.toLocaleString('en-AU', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  document.getElementById('kpi-cpl').textContent       = cpl !== null ? '$' + Math.round(cpl).toLocaleString('en-AU') : '—';
  document.getElementById('kpi-won').textContent       = won;
  document.getElementById('kpi-won-rate').textContent  = total > 0 ? `${wonRate}% of ${total} leads` : 'of total leads';
}

function renderStageChart(leads) {
  const container = document.getElementById('stage-chart');
  if (!leads.length) { container.innerHTML = '<div class="empty-chart">No leads in this period</div>'; return; }

  const counts = {};
  leads.forEach(l => {
    const s = l.pipelineStageName || 'Unknown';
    counts[s] = (counts[s] || 0) + 1;
  });

  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max     = entries[0][1];
  const colours = ['blue','green','teal','amber','gold','purple','red','gray'];

  container.innerHTML = entries.map(([name, count], i) => {
    const pct   = Math.round(count / leads.length * 100);
    const width = Math.round(count / max * 100);
    const cls   = colours[i % colours.length];
    return `<div class="bar-row">
      <div class="bar-name" title="${esc(name)}">${esc(name)}</div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${width}%"></div></div>
      <div class="bar-val">${count}</div>
      <div class="bar-pct">${pct}%</div>
    </div>`;
  }).join('');
}

function renderCampaignChart() {
  const container = document.getElementById('campaign-chart');
  const campaigns = spendData?.campaigns || [];
  if (!campaigns.length) { container.innerHTML = '<div class="empty-chart">No campaign spend data</div>'; return; }

  const max = campaigns[0].spend;
  const colours = ['blue','teal','green','amber'];

  container.innerHTML = campaigns.map((c, i) => {
    const label = c.name.replace(/\s*\d{2}\.\d{2}\.\d{2,4}\s*$/, '').trim(); // strip trailing date
    const width = Math.round(c.spend / max * 100);
    const cls   = colours[i % colours.length];
    return `<div class="bar-row">
      <div class="bar-name" title="${esc(c.name)}">${esc(label)}</div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${width}%"></div></div>
      <div class="bar-val">$${c.spend.toLocaleString('en-AU', {minimumFractionDigits:0,maximumFractionDigits:0})}</div>
    </div>`;
  }).join('');
}

function renderLeadsTable(leads) {
  document.getElementById('lead-count').textContent = leads.length;
  const tbody = document.getElementById('leads-body');
  if (!leads.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted);font-size:13px;">No leads in this period</td></tr>`;
    return;
  }

  const sorted = [...leads].sort((a, b) => {
    const da = new Date(a.createdAt || a.dateAdded || 0);
    const db = new Date(b.createdAt || b.dateAdded || 0);
    return db - da;
  });

  tbody.innerHTML = sorted.map(l => {
    const date = new Date(l.createdAt || l.dateAdded || 0);
    const dateStr = isNaN(date) ? '—' : date.toLocaleString('en-AU', {
      day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    const contactName  = l.contact?.name || l.name || '—';
    const contactEmail = l.contact?.email || l.email || '';
    const contactPhone = l.contact?.phone || l.phone || '';

    const stage  = l.pipelineStageName || '—';
    const status = l.status || 'open';
    const source = l.source || l.contactSource || '—';

    const stageClass = stageBadgeClass(stage);

    return `<tr>
      <td class="td-date">${dateStr}</td>
      <td>
        <div class="td-name">${esc(contactName)}</div>
        ${contactPhone ? `<div class="td-mono-sub">${esc(contactPhone)}</div>` : ''}
        ${contactEmail ? `<div class="td-sub">${esc(contactEmail)}</div>` : ''}
      </td>
      <td><span class="badge ${stageClass}">${esc(stage)}</span></td>
      <td style="font-size:11px;text-transform:capitalize;color:var(--muted);">${esc(status)}</td>
      <td style="font-size:11px;color:var(--muted);">${esc(source)}</td>
    </tr>`;
  }).join('');
}

function stageBadgeClass(stageName) {
  const s = (stageName || '').toLowerCase();
  if (s.includes('new lead'))                               return 'stage-new-lead';
  if (s.includes('follow'))                                 return 'stage-follow-up';
  if (s.includes('iha') || s.includes('booked'))           return 'stage-iba';
  if (s.includes('won') || s.includes('install'))          return 'stage-won';
  if (s.includes('not accepted') || s.includes('quote not')) return 'stage-lost';
  if (s.includes('not reachable') || s.includes('no answer')) return 'stage-not-reachable';
  if (s.includes('not interest') || s.includes('spam'))    return 'stage-not-interested';
  if (s.includes('unserviceable'))                          return 'stage-unserviceable';
  return 'stage-default';
}

// ── Utilities ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.textContent = 'Error: ' + msg;
  b.classList.add('show');
}
function hideError() {
  document.getElementById('errorBanner').classList.remove('show');
}
</script>
</body>
</html>
