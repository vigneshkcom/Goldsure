<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electrician availability - December 2026</title>
<style>
  :root{--bg:#f6f7f9;--cell:#fff;--line:#e2e5ea;--text:#1f2430;--muted:#8a909c}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1200px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px;display:block;white-space:nowrap}
  .Gurdip{background:#dbe4ff;color:#2f4bc4}
  .Josh{background:#d9f5e1;color:#1f7a3a}
  .Alex{background:#ead9fb;color:#7a2fc4}
  .Mason{background:#fdefc2;color:#8a5a00}
  .Closed{background:#fbd9d9;color:#b02a2a}
  .months{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .month h2{text-align:center;font-size:17px;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
  .day{background:var(--cell);border:1px solid var(--line);border-radius:6px;min-height:84px;padding:5px;display:flex;flex-direction:column;gap:3px}
  .day.off{background:#eceef2;border-color:#e6e8ec}
  .day.empty{visibility:hidden}
  .n{font-size:11px;font-weight:600;color:#555}
  .day.off .n{color:var(--muted)}
  .day .chip{font-size:10.5px;padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis}
  .tbc{font-size:10.5px;color:var(--muted)}
  @media(max-width:900px){.months{grid-template-columns:1fr}}
  @media(max-width:520px){body{padding:12px}.day{min-height:64px;padding:3px}.day .chip{font-size:9px;padding:1px 3px}.grid{gap:3px}}
  @media print{body{background:#fff;padding:8px}.months{grid-template-columns:1fr 1fr;gap:12px}.day{min-height:70px}}

  .checker{margin:0 0 20px;padding:16px;background:var(--cell);border:1px solid var(--line);border-radius:8px}
  .checker h2{font-size:16px;margin:0 0 12px}
  .fields{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
  .fields label{display:grid;gap:4px;font-size:14px;font-weight:600}
  .fields input,.fields select,.fields button{min-height:40px;padding:7px 10px;border:1px solid #b1b7c2;border-radius:5px;background:#fff;color:var(--text);font:inherit}
  .fields button{background:#2f4bc4;border-color:#2f4bc4;color:#fff;cursor:pointer}
  .fields button:disabled{opacity:.65}
  .status{margin:8px 0;color:#555d6a;font-size:14px}
  .status:empty{display:none}
  .results{width:100%;margin-top:12px;border-collapse:collapse;font-size:14px}
  .results th,.results td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}
  .day .chip{display:flex;justify-content:space-between;gap:2px}
  .chip-name{overflow:hidden;text-overflow:ellipsis}
  .chip-count{flex:none;font-variant-numeric:tabular-nums}
  .battery-note{display:block;font-size:10px;font-weight:700;white-space:normal}
  .day .chip{flex-wrap:wrap}
  .battery-note{flex-basis:100%}
  .priority-note{display:block;margin-top:4px;font-size:12px;color:#555d6a}
  .restriction{display:block;color:#9a3412;font-weight:700}
  .day .chip.full{box-shadow:inset 0 0 0 1px currentColor}
  .day .chip.full .chip-count{font-weight:800}
  @media print{.checker{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Electrician availability</h1>
  <div class="legend">
    <span class="chip Gurdip">Gurdip</span><span class="chip Josh">Josh</span>
    <span class="chip Alex">Alex</span><span class="chip Mason">Mason</span>
  </div>

  <section class="checker" aria-labelledby="checker-heading">
    <h2 id="checker-heading">Find electricians by area</h2>
    <form id="checker-form" class="fields">
      <label>Suburb or postcode
        <input type="search" id="area" maxlength="100" placeholder="e.g. Coombabah or 4216">
      </label>
      <label>Job duration
        <select id="job-duration">
          <option value="30">30 minutes</option>
          <option value="60" selected>60 minutes</option>
          <option value="90">90 minutes</option>
          <option value="120">120 minutes</option>
        </select>
      </label>
      <button id="check-button" type="submit">Find electricians</button>
    </form>
    <p id="checker-status" class="status" role="status"></p>
    <table id="results" class="results" hidden>
      <thead><tr><th>Date</th><th>Electrician / alarm type</th><th>Verified space</th><th>Suggested window</th><th>Booked area</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
  </section>
  <p id="counts-status" class="status" role="status"></p>
  <div class="months" id="months"></div>
</div>
<script type="module">
import { verifyRouteCandidates } from '/electrician-availability/route-check.js';
import { availability, months, year, dateKey, shiftFor, bookingLimit, bookingRule, bookingWindowLimits, getAvailabilityStartDate } from '/electrician-availability/availability.js';

const $ = id => document.getElementById(id);
const monthsRoot = $('months');
const countsStatus = $('counts-status');
const checkerStatus = $('checker-status');
const resultsTable = $('results');
const resultsBody = $('results-body');
const areaInput = $('area');
const checkButton = $('check-button');
const durationInput = $('job-duration');
const weekdayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const dateFormatter = new Intl.DateTimeFormat('en-AU', {
  weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'
});

function createElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function setCount(element, count, name, windowCounts) {
  const date = element.dataset.date;
  const limit = bookingLimit(date, name);
  const full = Number.isInteger(count) && limit != null && count >= limit;
  element.textContent = (limit ? (count ?? '-') + '/' + limit : count ?? '-') + (full ? ' Full' : '');
  element.title = count == null ? 'Booked-job count unavailable' : count + ' jobs booked';
  if (limit) element.title += ' out of ' + limit + (full ? ' - Full' : '');
  const windows = bookingWindowLimits(date, name);
  if (windowCounts && windows) {
    element.title += '; AM ' + windowCounts.AM + '/' + windows.AM + '; PM ' + windowCounts.PM + '/' + windows.PM;
    if (windowCounts.unknown) element.title += '; ' + windowCounts.unknown + ' booking times unknown';
  }
  element.setAttribute('aria-label', element.title);
  element.parentElement.classList.toggle('full', full);
}

const countElements = new Map();
function renderCalendar() {
  const start = getAvailabilityStartDate();
  for (const { name, month, days, firstDay = 1 } of months) {
    if (dateKey(month, days) < start) continue;
    const panel = createElement('div', 'month');
    const grid = createElement('div', 'grid');
    panel.append(createElement('h2', '', name), grid);
    weekdayLabels.forEach(label => grid.appendChild(createElement('div', 'dow', label)));
    const leadingDays = (new Date(year, month - 1, firstDay).getDay() + 6) % 7;
    for (let i = 0; i < leadingDays; i++) grid.appendChild(createElement('div', 'day empty'));
    for (let day = firstDay; day <= days; day++) {
      if (dateKey(month, day) < start) {
        grid.appendChild(createElement('div', 'day empty'));
        continue;
      }
      const workers = availability[month + '-' + day];
      const cell = createElement('div', workers ? 'day' : 'day off');
      cell.appendChild(createElement('span', 'n', day));
      if (Array.isArray(workers)) {
        for (const worker of workers) {
          const chip = createElement('span', 'chip ' + worker);
          const count = createElement('span', 'chip-count');
          count.dataset.date = dateKey(month, day);
          countElements.set(dateKey(month, day) + '/' + worker, count);
          chip.append(createElement('span', 'chip-name', worker), count);
          const rule = bookingRule(dateKey(month, day), worker);
          const shift = shiftFor(dateKey(month, day), worker);
          if (shift?.startHour) chip.appendChild(createElement('span', 'battery-note', shift.startHour + ' am start'));
          if (rule?.batteryOnly) chip.appendChild(createElement('span', 'battery-note', 'Battery alarms only'));
          if (rule) chip.title = rule.southGoldCoast ? 'Priority: South Gold Coast' : 'Priority: battery alarms only';
          setCount(count, null, worker);
          cell.appendChild(chip);
        }
      } else if (workers === 'Closed') {
        cell.appendChild(createElement('span', 'chip Closed', workers));
      } else if (workers === 'TBC') {
        cell.appendChild(createElement('span', 'tbc', workers));
      }
      grid.appendChild(cell);
    }
    monthsRoot.appendChild(panel);
  }
}

function clearResults(message = '') {
  resultsTable.hidden = true;
  resultsBody.replaceChildren();
  checkerStatus.textContent = message;
}
areaInput.addEventListener('input', () => clearResults());
durationInput.addEventListener('change', () => clearResults());

let countsRevision = 0;
async function lookup(area = '') {
  const revision = ++countsRevision;
  const response = await fetch('/api/electrician-availability?checked=' + Date.now(), {
    method: 'POST',
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ area, durationMinutes: Number(durationInput.value) })
  });
  const data = await response.json();
  if (response.status === 400) throw new Error('Enter a suburb name, a four-digit postcode, or both.');
  if (!response.ok || !Array.isArray(data.matches)) throw new Error('Availability could not be checked. Please try again.');
  if (revision === countsRevision) {
    renderCounts(data.counts || data.matches);
    countsStatus.textContent = scheduleStatus(data);
  }
  if (data.routeVerificationRequired) {
    checkerStatus.textContent = 'Checking driving time against the next booked job.';
    const checked = await verifyRouteCandidates(data.candidates);
    data.matches = checked.matches;
    data.incomplete = data.incomplete || checked.incomplete;
  }
  return data;
}

function renderCounts(matches) {
  for (const { date, name, jobCount, windowCounts } of matches) {
    const element = countElements.get(date + '/' + name);
    if (element) setCount(element, jobCount, name, windowCounts);
  }
}

function scheduleStatus(data) {
  if (!data.updatedAt) return 'Waiting for the first successful Dataforce sync.';
  const updated = new Intl.DateTimeFormat('en-AU', {timeZone:'Australia/Brisbane',
    day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date(data.updatedAt));
  return 'Jobs booked / daily limit. Last Dataforce sync ' + updated +
    (data.stale ? '. Some schedules are over 10 minutes old or unavailable. Suggestions require a recent sync.' : '.') +
    (data.incomplete ? ' Some route details are still syncing.' : '');
}
async function loadCounts() {
  countsStatus.textContent = 'Loading booked jobs from Dataforce.';
  try {
    const data = await lookup();
    countsStatus.textContent = scheduleStatus(data);
  } catch {
    countsStatus.textContent = 'Booked-job counts could not be loaded. Refresh the page to try again.';
  }
}

$('checker-form').addEventListener('submit', async event => {
  event.preventDefault();
  const area = areaInput.value.trim();
  clearResults();
  if (!area) {
    checkerStatus.textContent = 'Enter a suburb or postcode.';
    areaInput.focus();
    return;
  }
  if (/^\d+$/.test(area) && !/^\d{4}$/.test(area)) {
    checkerStatus.textContent = 'Enter a four-digit postcode.';
    areaInput.focus();
    return;
  }
  checkButton.disabled = true;
  checkerStatus.textContent = 'Checking booked routes.';
  try {
    const { matches, incomplete, stale, bookedRoutes = [] } = await lookup(area);
    if (areaInput.value.trim() !== area || document.hidden) return;
    for (const match of matches) {
      const row = createElement('tr');
      const day = dateFormatter.format(new Date(match.date + 'T00:00:00Z'));
      row.append(createElement('td', '', day), createElement('td', '', match.name), createElement('td', '', match.windowRemaining ?? match.remaining),
        createElement('td', '', match.window + (match.windowRemaining != null ? ' (' + match.windowRemaining + ' left)' : '')), createElement('td', '', (match.newRoute ? 'New route: ' : match.nearby ? 'Near ' : '') + match.bookedArea));
      if (match.batteryOnly) row.children[1].appendChild(createElement('span', 'restriction', 'Battery alarms only'));
      if (match.priority) row.children[0].appendChild(createElement('span', 'priority-note', 'Priority - ' + match.remaining + ' space' + (match.remaining === 1 ? '' : 's') + ' left'));
      resultsBody.appendChild(row);
    }
    resultsTable.hidden = !matches.length;
    checkerStatus.textContent = matches.some(match => match.priority)
      ? 'Priority dates are listed first, then the closest booked areas. Slots marked Battery alarms only cannot take hardwired alarm jobs.'
      : matches.length ? 'Each result fits one additional job, including travel before and after it. New routes are available on days with no bookings.'
      : 'No upcoming routes with room matched this area.';
    const bookedOnly = bookedRoutes.filter(route => !matches.some(match =>
      match.name === route.name && match.date === route.date && match.window === route.window));
    if (bookedOnly.length) {
      const routes = bookedOnly.map(route => route.name + ', ' +
        dateFormatter.format(new Date(route.date + 'T00:00:00Z')) + ' ' + route.window);
      const detail = 'Already booked in this area: ' + routes.join('; ') +
        '. No additional ' + durationInput.value + '-minute slot verified on those routes.';
      checkerStatus.textContent = matches.length ? checkerStatus.textContent + ' ' + detail : detail;
    }
    if (stale) checkerStatus.textContent += ' Availability suggestions are paused for schedules awaiting a recent Dataforce sync.';
    if (incomplete) {
      checkerStatus.textContent = [checkerStatus.textContent, 'Some dates could not be verified against the complete route.']
        .filter(Boolean).join(' ');
    }
  } catch (error) {
    checkerStatus.textContent = error.message;
  } finally {
    checkButton.disabled = false;
  }
});

renderCalendar();
loadCounts();
setInterval(() => {
  if (!document.hidden && !checkButton.disabled) loadCounts();
}, 60000);
</script>
</body>
</html>
